anchor="middle" fill="#111">1</text><text x="57.3" y="64.4" font-size="10.8" text-anchor="middle" fill="#111">2</text><text x="62.7" y="58" font-size="12" text-anchor="start" fill="#111" xml:space="preserve" textLength="38.4" lengthAdjust="spacingAndGlyphs">·m·vₑ²</text><text x="20" y="96" font-size="12" text-anchor="start" fill="#111" xml:space="preserve" textLength="42.9" lengthAdjust="spacingAndGlyphs">Ep = −</text><line x1="63.9" y1="92.2" x2="101" y2="92.2" stroke="#111" stroke-width="0.9"/><text x="82.5" y="89.5" font-size="10.8" text-anchor="middle" fill="#111">G·M·m</text><text x="82.5" y="102.4" font-size="10.8" text-anchor="middle" fill="#111">R</text><text x="102" y="96" font-size="12" text-anchor="start" fill="#111" xml:space="preserve" textLength="69.5" lengthAdjust="spacingAndGlyphs">  (negativa)</text><text x="20" y="128" font-size="12" text-anchor="start" fill="#1f5fbf" font-weight="bold">Em (inicial) = Ec + Ep</text><text x="680" y="26" font-size="13" text-anchor="end" fill="#111" font-weight="bold">Estat final (r → ∞)</text><text x="680" y="54" font-size="12" text-anchor="end" fill="#111">Ep = 0 (origen a l’infinit)</text><text x="680" y="78" font-size="12" text-anchor="end" fill="#111">velocitat mínima ⇒ Ec = 0</text><text x="680" y="104" font-size="12" text-anchor="end" fill="#1f5fbf" font-weight="bold">Em (final) = 0</text><text x="430" y="312" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">Només actua la gravetat (conservativa): Em (inicial) = Em (final) = 0</text></svg>