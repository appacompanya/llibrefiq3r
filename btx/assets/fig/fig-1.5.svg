<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif"><rect width="700" height="330" fill="#fff"/><line x1="40" y1="165" x2="670" y2="165" stroke="#555" stroke-width="1" stroke-linecap="round"/><line x1="40" y1="165" x2="666" y2="165" stroke="#555" stroke-width="1" stroke-linecap="round"/><polygon points="672,165 664.7,168.3 664.7,161.7" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/><line x1="120" y1="315" x2="120" y2="28" stroke="#555" stroke-width="1" stroke-linecap="round"/><polygon points="120,22 123.3,29.3 116.7,29.3" fill="#555" stroke="#555" stroke-width="1" stroke-linejoin="round"/><text x="675" y="157" font-size="14" text-anchor="end" fill="#111" font-style="italic">x</text><text x="128" y="30" font-size="14" text-anchor="start" fill="#111" font-style="italic">F</text><polygon points="280,165 280,209 520,275 520,165" fill="#b3261e" fill-opacity="0.18" stroke="none"/><line x1="72" y1="151.8" x2="608" y2="299.2" stroke="#111" stroke-width="2.4" stroke-linecap="round"/><text x="552" y="309.8" font-size="13" text-anchor="start" fill="#111">F = −k·x</text><line x1="280" y1="160" x2="280" y2="170" stroke="#111" stroke-width="1.4" stroke-linecap="round"/><line x1="280" y1="165" x2="280" y2="209" stroke="#111" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="280" y="153" font-size="13" text-anchor="middle" fill="#111" font-style="italic">x<tspan dy='4' font-size='10'>A</tspan></text><line x1="115" y1="209" x2="280" y2="209" stroke="#555" stroke-width="1" stroke-dasharray="3 4" stroke-linecap="round"/><line x1="520" y1="160" x2="520" y2="170" stroke="#111" stroke-width="1.4" stroke-linecap="round"/><line x1="520" y1="165" x2="520" y2="275" stroke="#111" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="520" y="153" font-size="13" text-anchor="middle" fill="#111" font-style="italic">x<tspan dy='4' font-size='10'>B</tspan></text><line x1="115" y1="275" x2="520" y2="275" stroke="#555" stroke-width="1" stroke-dasharray="3 4" stroke-linecap="round"/><text x="112" y="213" font-size="12" text-anchor="end" fill="#111">−k·x<tspan dy='4' font-size='10'>A</tspan></text><text x="112" y="279" font-size="12" text-anchor="end" fill="#111">−k·x<tspan dy='4' font-size='10'>B</tspan></text><text x="400" y="206.8" font-size="13" text-anchor="middle" fill="#b3261e" font-weight="700">àrea = W</text><text x="400" y="223.8" font-size="11" text-anchor="middle" fill="#b3261e">(negativa: sota l’eix)</text><text x="30" y="322" font-size="12" text-anchor="start" fill="#555">W(A→B) = −(k·x<tspan dy='4' font-size='9'>A</tspan><tspan dy='-4'> + k·x</tspan><tspan dy='4' font-size='9'>B</tspan><tspan dy='-4'>)/2 · (x</tspan><tspan dy='4' font-size='9'>B</tspan><tspan dy='-4'> − x</tspan><tspan dy='4' font-size='9'>A</tspan><tspan dy='-4'>) = −(½·k·x</tspan><tspan dy='4' font-size='9'>B</tspan><tspan dy='-4'>² − ½·k·x</tspan><tspan dy='4' font-size='9'>A</tspan><tspan dy='-4'>²)</tspan></text></svg>