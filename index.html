<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Física i química 3r ESO</title>
<meta name="description" content="Llibre digital dinàmic de Física i química de 3r d'ESO: sis reptes, sessió a sessió, amb fitxes, simulacions i lectures.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='8' fill='white' stroke='%231f2328' stroke-width='5'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='28' text-anchor='middle' fill='%231f2328'%3EFq%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
/* Layout: header + SdA switcher (6 coloured chips), then the selected SdA: hero, 10-session timeline with drawings and download buttons, teacher materials */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --fg:#1f2328; --muted:#5f6670; --line:#e1ddd5; --chip:#efece6;
  --ok:#1f7a4a; --warn:#9a5b00;
  --s1:#2F8F95; --s2:#E0782F; --s3:#6C5CC9; --s4:#3F9A5A; --s5:#D14B66; --s6:#2F6DB5;
  --acc:var(--s1); --ink:#1d2a3a; --ink-fg:#f3f1ec; --desk:#e4e0d8; --paper:#ffffff; --grid:rgba(31,35,40,.07);
  --font-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --font-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171b; --surface:#1d2026; --fg:#eceef1; --muted:#a3aab4; --line:#2f333b; --chip:#272b32; --ok:#5fd394; --warn:#f0b45c; --ink:#0f1620; --ink-fg:#eceef1; --desk:#0e1013; --grid:rgba(236,238,241,.06); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b; --surface:#1d2026; --fg:#eceef1; --muted:#a3aab4; --line:#2f333b; --chip:#272b32; --ok:#5fd394; --warn:#f0b45c; --ink:#0f1620; --ink-fg:#eceef1; --desk:#0e1013; --grid:rgba(236,238,241,.06); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:grid;gap:26px}
.top{display:grid;gap:6px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1.05;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:68ch}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px 28px;align-items:center;border-bottom:3px solid var(--acc);padding-bottom:16px}
.hero h2{font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,3.5vw,2.1rem);margin:2px 0 0;line-height:1.1;text-wrap:balance}
.hero .kq{margin:6px 0 0;font-size:1.05rem}
.hero .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.hero .no{color:var(--acc);font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.btn{font:inherit;font-size:.86rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;border:1.5px solid var(--acc);background:var(--acc);color:#fff;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--acc)}
.btn.link{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.link:hover{border-color:var(--acc)}
.btn svg{width:14px;height:14px;flex:none}
.btn.pending{background:transparent;color:var(--warn);border:1.5px dashed var(--warn);cursor:default}
h3.sec{font-family:var(--font-display);font-weight:800;font-size:1.2rem;margin:0}
.sessions{display:grid;gap:10px}
.ses{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:grid-template-columns .28s ease,border-color .2s ease,box-shadow .2s ease}
.ses:hover{border-color:var(--acc)}
.ses:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ses.sel{grid-template-columns:260px 1fr;border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc) inset,0 10px 24px -16px var(--acc)}
.ses .pic{width:100%;height:84px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;transition:height .28s ease}
.ses.sel .pic{height:186px}
.ses .pic .pend{font-size:.75rem;color:#8a9097;text-align:center;border:1px dashed #c9cdd2;border-radius:8px;padding:14px 10px}
.ses .pic{position:relative}
.ses .pic img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain}
.ses .body{display:grid;gap:6px;min-width:0}
.ses .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.9rem;flex:none}
.ses h4{margin:0;font-size:1.02rem}
.grp{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line, #d9dee7);border-radius:999px;padding:1px 8px}.grp.half{color:#1d7a4a;border-color:#1d7a4a}
.phase{font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 9px}
.ses p{margin:0;color:var(--muted);font-size:.9rem;max-width:72ch}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.fig{margin:4px 0 2px;display:grid;gap:4px;background:#fff;border-radius:10px;padding:8px;border:1px solid var(--line)}
.fig img{width:100%;max-height:420px;object-fit:contain}
.fig figcaption{font-size:.76rem;color:#5f6670;text-align:right}
.teacher{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.tcard b{font-size:.98rem}
.tcard span{color:var(--muted);font-size:.88rem}
.tcard .acts{margin-top:2px}
.soon{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:28px 20px;display:grid;gap:6px;justify-items:start}
.soon b{font-family:var(--font-display);font-size:1.1rem}
.soon span{color:var(--muted)}
.note{font-size:.84rem;color:var(--muted);max-width:75ch}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:.88rem;max-width:calc(100% - 32px)}
.aval{display:grid;gap:12px}
.avgrid{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.stulist{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.stus{display:grid;gap:4px;max-height:360px;overflow:auto}
.stu{font:inherit;font-size:.9rem;text-align:left;cursor:pointer;background:transparent;color:var(--fg);border:1px solid transparent;border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;gap:8px}
.stu:hover{border-color:var(--line)}
.stu.on{background:var(--chip);border-color:var(--acc)}
.stu b{font-variant-numeric:tabular-nums}
.stulist .lbl{font-size:.8rem;font-weight:700;margin-top:6px}
.stulist textarea{font:inherit;font-size:.88rem;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--fg);resize:vertical}
.avmain{display:grid;gap:10px;min-width:0}
.avhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.avhead h4{margin:0;font-family:var(--font-display);font-size:1.25rem}
.nota{display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:.85rem}
.nota b{font-size:1.5rem;color:var(--fg);font-variant-numeric:tabular-nums}
.cechip{display:inline-flex;align-items:center;gap:4px;margin-right:8px;font-weight:700;color:var(--fg)}.cemini{display:inline-flex;gap:2px}.recsel{margin-left:4px;font-size:.75rem}
.avhead .acts{margin-left:auto}
.ins{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ins summary{cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.ins summary span:first-child{flex:1;min-width:0}
.ins .w{font-weight:400;font-size:.8rem;color:var(--muted)}
.tscroll{overflow-x:auto}
table.rub{border-collapse:collapse;width:100%;min-width:640px;margin-top:8px;font-size:.82rem}
table.rub th,table.rub td{border-top:1px solid var(--line);padding:5px;vertical-align:top;text-align:left}
table.rub thead th{font-size:.75rem;color:var(--muted);border-top:0}
table.rub th[scope=row]{width:24%;font-weight:400}
.asp{display:block;font-weight:700}
.cr{display:block;font-size:.75rem;color:var(--muted)}
.cell-lv{font:inherit;font-size:.78rem;line-height:1.3;width:100%;min-height:52px;text-align:left;cursor:pointer;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:5px 7px;display:grid;gap:2px;align-content:start}
.cell-lv:hover{border-color:var(--acc)}
.cell-lv b{font-size:.78rem}
.cell-lv span{color:var(--muted)}
.cell-lv.on{color:#fff}.cell-lv.on span{color:#fff}
.lv{display:inline-block;min-width:30px;text-align:center;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 7px;color:#fff}
.lv-NA{background:#c2413a}.lv-AS{background:#c98a16}.lv-AN{background:#3f8f5a}.lv-AE{background:#2f6db5}
.lv-none{background:var(--chip);color:var(--muted)}
.cell-lv.lv-NA{background:#c2413a;border-color:#c2413a}.cell-lv.lv-AS{background:#c98a16;border-color:#c98a16}.cell-lv.lv-AN{background:#3f8f5a;border-color:#3f8f5a}.cell-lv.lv-AE{background:#2f6db5;border-color:#2f6db5}
h4.sub{margin:6px 0 0;font-size:1rem}
.crits{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.crit{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.crit .cc{font-weight:700;font-variant-numeric:tabular-nums}
.crit .cn{flex:1;font-size:.85rem;color:var(--muted)}
table.grp{border-collapse:collapse;width:100%;font-size:.85rem;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.grp th,table.grp td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.grp th[scope=row]{text-align:left;font-weight:400}
table.grp .nt{font-weight:700;font-variant-numeric:tabular-nums}

/* ===== Portada ===== */
.view{display:grid;gap:30px;min-width:0}
.cover{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-top:10px}
.cover h1{font-size:clamp(2.3rem,6vw,4rem);letter-spacing:-.01em}
.cover .lead{font-size:1.05rem}
.cover-txt{display:grid;gap:14px;min-width:0}
.credit{margin:0;display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.credit .sig{font-family:var(--font-display);font-weight:800;color:var(--fg)}
.credit::before{content:"";width:28px;height:2px;background:var(--fg);flex:none}
.cover-cta{display:flex;flex-wrap:wrap;gap:8px}
.cover-art{position:relative;aspect-ratio:16/11;max-width:100%;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.cover-art img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-art svg.orb{position:absolute;inset:0;width:100%;height:100%}
.tile{position:absolute;left:18px;bottom:18px;width:156px;height:172px;background:var(--surface);color:var(--fg);border:2px solid var(--fg);border-radius:8px;box-shadow:6px 6px 0 var(--fg)}
.tile .tsym{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:20px;display:grid;grid-template-columns:auto auto;column-gap:3px;align-items:end}
.tile .sym{grid-column:2;grid-row:2;font-family:var(--font-display);font-weight:800;font-size:3.7rem;line-height:.86;letter-spacing:-.01em}
.tile .sup,.tile .sub{grid-column:1;justify-self:end;font-family:var(--font-display);font-weight:800;font-size:1.15rem;line-height:1}
.tile .sup{grid-row:1}
.tile .sub{grid-row:3}
.tile .tg{grid-column:2;font-size:.7rem;font-weight:700;line-height:1;letter-spacing:.02em;color:var(--muted);padding-bottom:2px}
.tile .t1{grid-row:1}
.tile .t2{grid-row:3}
.tile .nm{position:absolute;left:12px;right:8px;bottom:10px;font-size:.78rem;font-weight:700;line-height:1.15}
.tile .nm small{display:block;font-size:.68rem;font-weight:600;color:var(--muted)}
.sechd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sechd h2{font-family:var(--font-display);font-weight:800;font-size:1.55rem;margin:0}
.sechd span{color:var(--muted);font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-radius:16px;overflow:hidden;isolation:isolate}
.scard{--c:var(--s1);container-type:inline-size;position:relative;display:block;aspect-ratio:3/2;max-width:100%;border-radius:0;overflow:hidden;background:var(--c);color:#fff;text-decoration:none;isolation:isolate;}
.scard img,.scard svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.scard .num{position:absolute;left:10px;top:10px;z-index:2;background:var(--surface);color:var(--fg);border-radius:8px;padding:3px 8px 4px;font-family:var(--font-display);font-weight:800;font-size:.95rem;line-height:1.1;display:grid;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.scard .num small{font-family:var(--font-body);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.scard .chip{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;justify-self:start;max-width:max-content;background:rgba(20,22,26,.55);backdrop-filter:blur(6px);color:#fff;border-radius:8px;padding:4px 8px;font-size:.78rem;font-weight:700;line-height:1.2}
.scard:hover img,.scard:hover svg{transform:scale(1.04)}
.scard:focus-visible{outline:2px solid #fff;outline-offset:-4px}

/* ===== Visor ===== */
.viewer{display:grid;gap:14px;min-width:0}
.vbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vbar h3{margin:0;font-family:var(--font-display);font-size:1.05rem;flex:1;min-width:0}
.vbar .acts{margin-left:auto}
.vmsg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 20px;display:grid;gap:8px;justify-items:start}
.vmsg b{font-family:var(--font-display);font-size:1.1rem}
.vmsg span{color:var(--muted)}
.pages{display:grid;gap:16px}
.page{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 12px -8px rgba(0,0,0,.2)}
.page canvas{display:block;width:100%;height:auto}

/* ===== Tema i navegació ===== */
.theme{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:20;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.theme svg{width:18px;height:18px}

/* ===== Responsive ===== */
@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .hero .hacts{order:-1;justify-items:start}
  .cover{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .ses{grid-template-columns:1fr}
  .ses.sel{grid-template-columns:1fr}
  .avgrid{grid-template-columns:1fr}
  .stulist{position:static}
}
</style>
</head>
<body>
<button type="button" class="theme" id="themeBtn" aria-label="Canvia el tema" title="Canvia el tema">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<div class="wrap" id="app">
  <div id="cover" class="view" hidden></div>
  <div id="book" class="view" hidden>
    <div class="top">
      <div class="eyebrow">Física i química · 3r ESO</div>
      <h1>Llibre digital</h1>
      <p class="lead">Sis reptes per entendre la física i la química del dia a dia. Aquí tens, sessió a sessió, què farem, els fulls que necessites i les simulacions.</p>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panel"></div>
  </div>
  <div id="vDoc" class="viewer" hidden aria-label="Visor de fulls">
    <div class="vbar">
      <button type="button" class="btn ghost" id="vBack">← Torna</button>
      <h3 id="vTitle"></h3>
      <div class="acts" id="vDl"></div>
    </div>
    <div class="pages" id="vPages"></div>
  </div>
  <div id="vVid" class="viewer" hidden aria-label="Visor de vídeo">
    <div class="vbar">
      <button type="button" class="btn ghost" id="vidBack">← Torna</button>
      <h3 id="vidTitle"></h3>
    </div>
    <iframe id="vidFr" title="" hidden allow="fullscreen" allowfullscreen></iframe>
    <img id="vidImg" alt="" hidden style="max-width:100%;border-radius:12px">
  </div>
</div>
<div id="toast" hidden></div>
<script>
/* ===== Dades ===== */
const MODE = new URLSearchParams(location.search).get("mode") || "alumne";
const ICON_DL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>`;
const ICON_DOC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
const ICON_LINK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>`;
function esc(s){ return String(s||"").replace(/[&<>"]/g, c => ({"&":"&","<":"<",">":">",'"':"""}[c])); }
function ufr(s){ return s.replace(/\b(UR|FR)\b/g, '<abbr title="Unitat de referència / Fitxa de referència">$1</abbr>'); }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 3200); }

function dlBtn(k, ghost){ const d = D[k]; return `<a class="btn${ghost||d.t?' ghost':''}" href="#doc-${k}">${ICON_DOC}${esc(d.l)}</a>`; }
function linkBtn(u, l, k){
  if (k && inBook(k)) return `<button type="button" class="btn link vid" data-open="${k}">${inBook(k)==="i"?"🔍":"▶"} ${esc(l)}</button>`; const ext = /^https?:/.test(u); const dl = /\.xlsx$/.test(u); return `<a class="btn link" href="${u}"${ext ? ' target="_blank" rel="noopener"' : ""}${dl ? " download" : ""}>${ICON_LINK}${esc(l)}</a>`; }

function renderTabs(cur){
  document.getElementById("tabs").innerHTML = SDAS.map(s =>
    `<button type="button" role="tab" class="sbtn" style="--c:var(${s.c})" aria-selected="${s.n===cur}" data-sda="${s.n}" id="tab${s.n}" title="${esc(s.title)}">
      <span class="dot"></span><span>SdA ${s.n}</span><span class="tt">· ${esc(s.title)}</span></button>`).join("");
}

function renderPanel(n){
  const s = SDAS.find(x => x.n === n);
  const p = document.getElementById("panel");
  p.style.setProperty("--acc", `var(${s.c})`);
  p.setAttribute("aria-labelledby", "tab"+n);
  document.documentElement.style.setProperty("--acc", `var(${s.c})`);
  if (!s.ready){
    p.innerHTML = `<div style="display:grid;gap:18px"><div class="hero"><div><div class="no">SdA ${s.n}</div><h2>${esc(s.title)}</h2><p class="kq">${esc(s.q)}</p></div></div>
      <div class="soon"><b>Properament</b><span>Aquí hi trobaràs les sessions, els fulls i els enllaços d'aquesta SdA.</span></div></div>`;
    return;
  }
  const ses = s.sessions.map((x,i) => {
    const docs = x.d.map(k => dlBtn(k)).join("") + (MODE==="profe" ? (x.dt||[]).map(k => dlBtn(k)).join("") : "");
    const links = x.l.map(k => linkBtn(L[k].u, L[k].l, k)).join("");
    const acts = docs + links;
    const fig = x.fig ? `<figure class="fig"><img src="${x.fig.src}" alt="${esc(x.fig.alt)}" loading="lazy"><figcaption>${esc(x.fig.cap)}</figcaption></figure>` : "";
    const pic = x.pic === false ? `<span class="pend">Il·lustració<br>pendent</span>` : `<img src="img/sda${s.n}-s${i+1}.png" alt="" loading="lazy">`;
    return `<article class="ses" id="s${i+1}" tabindex="0" aria-expanded="false" data-ses="${i}"><div class="pic">${pic}</div>
      <div class="body"><div class="hd"><span class="badge">${i+1}</span><h4>${esc(x.t)}</h4><span class="phase">${esc(x.ph)}</span>${(x.half ?? ((i+1)%2===0))?`<span class="grp half" title="Sessió desdoblada: mig grup">Mig grup</span>`:`<span class="grp" title="Grup sencer">Grup sencer</span>`}</div>
      <p>${ufr(esc(x.p))}</p>${fig}${acts?`<div class="acts">${acts}</div>`:""}</div></article>`;
  }).join("");
  const teach = s.teacher.map(t => `<div class="tcard"><b>${esc(t.b)}</b><span>${esc(t.s)}</span><div class="acts">${t.u?linkBtn(t.u,t.ul):""}${(t.d||[]).map(k=>dlBtn(k,true)).join("")}</div></div>`).join("");
  p.innerHTML = `<div style="display:grid;gap:22px">
    <div class="hero"><div><div class="no">SdA ${s.n}</div><h2>${esc(s.title)}</h2><p class="kq">${esc(s.q)}</p><div class="meta">${esc(s.meta)}</div></div>
      <div class="hacts"><div class="thumb">${art(s.n)}</div>${dlBtn("d"+s.n+"teo")}</div></div>
    <h3 class="sec">Sessió a sessió</h3>
    <div class="sessions">${ses}</div>
    <h3 class="sec">Vols anar més enllà?</h3>
    <div class="teacher"><div class="tcard"><b>Dossier de teoria</b><span>Tota la teoria d'aquesta SdA en un sol document: definicions, fórmules, exemples resolts i paraules clau. Fes-lo servir per estudiar i per repassar abans de la demostració d'assoliment.</span><div class="acts">${dlBtn("d"+s.n+"teo",true)}</div></div><div class="tcard"><b>Formulari i glossari del curs</b><span>Totes les fórmules del curs en una pàgina (el pots fer servir a les activitats de demostració d'assoliment) i les paraules clau de cada SdA amb la traducció a l'anglès i una columna per a les teves anotacions.</span><div class="acts">${dlBtn("dcF",true)}${dlBtn("dcG",true)}</div></div><div class="tcard"><b>Reptes d'ampliació</b><span>Problemes i reptes més avançats relacionats amb aquesta SdA. Tria'ls quan acabis la feina o si vols aprofundir-hi. Quan n'acabis un, demana'n el solucionari al professor.</span><div class="acts">${dlBtn("d"+s.n+"amp",true)}</div></div><div class="tcard"><b>Tasques de recuperació</b><span>Si en acabar una competència específica no l'has assolida (NA), el professor t'indicarà la tasca de recuperació d'aquella competència. També la pots fer per millorar: si la fas millor, el nivell nou substitueix l'anterior.</span><div class="acts">${(s.meta.match(/CE\d/g)||[]).map(c => dlBtn("dcR"+c.slice(2),true)).join("")}</div></div></div>
  </div>`;
}

  document.getElementById("vVid").hidden = true;
  document.getElementById("vDoc").hidden = false;
  document.getElementById("vTitle").textContent = d.l;
  document.getElementById("vDl").innerHTML = `<a class="btn" href="docs/${d.f}" download>${ICON_DL}Descarrega</a>`;
  const pages = document.getElementById("vPages");
  pages.innerHTML = `<div class="vmsg"><b>Carregant el PDF…</b></div>`;
  pdfjsLib.getDocument("docs/" + d.f).promise.then(pdf => {
    pages.innerHTML = "";
    const renderPage = (num) => {
      pdf.getPage(num).then(page => {
        const scale = 1.5;
        const viewport = page.getViewport({scale});
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        const div = document.createElement("div");
        div.className = "page";
        div.appendChild(canvas);
        pages.appendChild(div);
        page.render({canvasContext: ctx, viewport}).promise.then(() => {
          if (num < pdf.numPages) renderPage(num+1);
        });
      });
    };
    renderPage(1);
  }).catch(() => {
    pages.innerHTML = `<div class="vmsg"><b>Aquest full no es pot mostrar aquí</b><span>Descarrega'l i obre'l amb el lector de PDF del dispositiu.</span><a class="btn" href="docs/${d.f}" download>${ICON_DL}Descarrega el PDF</a></div>`;
  });
  history.replaceState(null, "", "#doc-"+k);
}

/* ===== Esdeveniments ===== */
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-sda]");
  if (tab) { showBook(+tab.dataset.sda); return; }
  const back = e.target.closest("#vBack, #vidBack");
  if (back) { const h = location.hash; if (h.startsWith("#sda")) showBook(+h.slice(4)); else showCover(); return; }
  const doc = e.target.closest("a[href^='#doc-']");
  if (doc) { e.preventDefault(); openDoc(doc.getAttribute("href").slice(5)); return; }
  const ses = e.target.closest(".ses");
  if (ses && !e.target.closest("a, button")) {
    ses.classList.toggle("sel");
    ses.setAttribute("aria-expanded", ses.classList.contains("sel"));
  }
});

/* ===== Tema ===== */
const themeBtn = document.getElementById("themeBtn");
function setTheme(t){ document.documentElement.dataset.theme = t; localStorage.setItem("theme", t); }
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
if (localStorage.getItem("theme")) setTheme(localStorage.getItem("theme"));
else if (matchMedia("(prefers-color-scheme: dark)").matches) setTheme("dark");

/* ===== Inici ===== */
(function(){
  const h = location.hash;
  if (h.startsWith("#doc-")) openDoc(h.slice(5));
  else if (h.startsWith("#sda")) showBook(+h.slice(4));
  else showCover();
})();
</script>
