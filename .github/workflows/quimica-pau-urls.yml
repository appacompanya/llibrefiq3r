# Prova una llista d'URL candidates (tools/quimica-pau/urls.txt) i desa els PDF que existeixen a la branca «fonts-pau-quimica-urls».
name: Química PAU · URL

on:
  push:
    branches: [main]
    paths: ["tools/quimica-pau/urls.txt", "tools/quimica-pau/wb_pagines.py"]

permissions:
  contents: write

jobs:
  baixa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Baixa
        run: |
          mkdir -p /tmp/f
          python3 tools/quimica-pau/wb_pagines.py > /tmp/wb.txt || true
          cp /tmp/wb.txt /tmp/f/wb_trobats.txt
          { grep -v '^#' tools/quimica-pau/urls.txt; cat /tmp/wb.txt; sed 's#^#https://web.archive.org/web/2023id_/#' /tmp/wb.txt; } | while read -r u; do
            [ -z "$u" ] && continue
            n=$(echo "$u" | sed -E 's#^https?://(web\.archive\.org/web/[0-9a-z_]+/)?##; s#^https?://##' | awk -F/ '{print $1"__"$NF}')
            [ -s "/tmp/f/$n" ] && continue
            if curl -sSfL --max-time 60 --connect-timeout 15 -A "Mozilla/5.0" -o "/tmp/f/$n.tmp" "$u" && head -c 4 "/tmp/f/$n.tmp" | grep -q '%PDF'; then
              mv "/tmp/f/$n.tmp" "/tmp/f/$n"; echo -e "$n\t$(stat -c%s /tmp/f/$n)\t$u" >> /tmp/f/llista.tsv
            else rm -f "/tmp/f/$n.tmp"; fi
          done
          touch /tmp/f/llista.tsv; cat /tmp/f/llista.tsv
      - name: Desa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan fonts-pau-quimica-urls
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/f/. .
          git add -A && git commit -qm "Fonts PAU Química (URL candidates)"
          git push -f origin fonts-pau-quimica-urls
