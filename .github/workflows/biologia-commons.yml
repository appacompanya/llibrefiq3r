# Descarrega a tools/biologia/commons/ els fitxers de Wikimedia Commons llistats a tools/biologia/commons.txt,
# amb la llicència i l'autoria de cada un (commons.json). Les il·lustracions del llibre de Biologia en surten.
name: Biologia · imatges de Commons

on:
  push:
    branches: [main]
    paths: ["tools/biologia/commons.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarrega
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          UA = {"User-Agent": "llibrefiq3r-biologia/1.0 (educational textbook)"}
          out = "tools/biologia/commons"; os.makedirs(out, exist_ok=True)
          names = [l.strip() for l in open("tools/biologia/commons.txt", encoding="utf-8") if l.strip() and not l.startswith("#")]
          mp = os.path.join(out, "commons.json")
          meta = json.load(open(mp, encoding="utf-8")) if os.path.exists(mp) else {}
          def get(url, timeout):
              for k in range(6):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=timeout).read()
                  except urllib.error.HTTPError as e:
                      if e.code != 429: raise
                      time.sleep(20 * (k + 1))
              raise RuntimeError("429 persistent")
          for n in names:
              if n in meta and "file" in meta[n] and os.path.exists(os.path.join(out, meta[n]["file"])):
                  continue
              q = urllib.parse.urlencode({"action": "query", "titles": "File:" + n, "prop": "imageinfo", "iiprop": "url|extmetadata|size", "format": "json"})
              try:
                  d = json.loads(get("https://commons.wikimedia.org/w/api.php?" + q, 60))
                  page = next(iter(d["query"]["pages"].values()))
                  if "imageinfo" not in page:
                      meta[n] = {"error": "no existeix"}; continue
                  ii = page["imageinfo"][0]; em = ii.get("extmetadata", {})
                  g = lambda k: em.get(k, {}).get("value", "")
                  meta[n] = {"url": ii["url"], "descurl": ii.get("descriptionurl"), "w": ii.get("width"), "h": ii.get("height"),
                             "license": g("LicenseShortName"), "artist": g("Artist"), "credit": g("Credit"), "desc": g("ImageDescription")[:600]}
                  data = get(ii["url"], 120)
                  safe = n.replace("/", "_")
                  open(os.path.join(out, safe), "wb").write(data)
                  meta[n]["file"] = safe
              except Exception as e:
                  meta[n] = {"error": str(e)}
              time.sleep(6)
          json.dump(meta, open(os.path.join(out, "commons.json"), "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
      - name: Desa
        run: |
          git add tools/biologia/commons
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Biologia: imatges de Commons descarregades"
          git push
