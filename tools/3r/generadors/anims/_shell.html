<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Animació pas a pas: escena (esquerra) i explicació amb botons (dreta) */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --fg:#1f2328; --muted:#5f6670; --line:#e1ddd5; --chip:#efece6;
  --acc:#C9621C; --acc-soft:#FBEADD; --cold:#2f6db5; --hot:#c2413a; --ok:#2e7d4f; --stage:#fbfaf8;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171c; --surface:#1d2027; --fg:#e8eaee; --muted:#a1a8b3; --line:#2f333c; --chip:#262a32;
  --acc:#f0a064; --acc-soft:#3a2a1e; --cold:#6aa6f0; --hot:#f07870; --ok:#5fc08a; --stage:#191c22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1d2027; --fg:#e8eaee; --muted:#a1a8b3; --line:#2f333c; --chip:#262a32;
  --acc:#f0a064; --acc-soft:#3a2a1e; --cold:#6aa6f0; --hot:#f07870; --ok:#5fc08a; --stage:#191c22; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1160px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.top a{color:var(--acc);font-weight:700;text-decoration:none}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.1;margin:.15em 0 0;text-wrap:balance}
h2{font-family:var(--display);font-size:1.2rem;line-height:1.2;margin:0;text-wrap:balance}
.lead{color:var(--muted);max-width:72ch;margin:0}
.sim{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.sim{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
canvas{display:block;width:100%;height:auto;background:var(--stage);border-radius:10px}
.pas{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);padding:0;cursor:pointer}
.dots button[aria-current=step]{background:var(--acc);border-color:var(--acc)}
.dots button.vist{background:var(--acc-soft);border-color:var(--acc)}
.txt{font-size:1.02rem;display:grid;gap:8px}
.txt p{margin:0}
.txt b{color:var(--acc)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.95rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.dots button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 50%,transparent);outline-offset:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:1px solid #0003}
.hint{font-size:.85rem;color:var(--muted);margin:0}
table.cnt{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
table.cnt th,table.cnt td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center}
table.cnt th{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.cnt td:first-child,table.cnt th:first-child{text-align:left}
.si{color:var(--ok);font-weight:800}.no{color:var(--hot);font-weight:800}
.read{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.read div{background:var(--chip);border-radius:10px;padding:7px 10px;display:grid}
.read span{font-size:.76rem;color:var(--muted);font-weight:700}
.read b{font-size:1.2rem;font-variant-numeric:tabular-nums;font-family:var(--display)}
.eqs{display:grid;gap:6px;font-size:.95rem}
.eqs div{background:var(--chip);border-radius:10px;padding:6px 10px;border:1.5px solid transparent}
.eqs div.on{border-color:var(--acc);background:var(--acc-soft)}
.eqs span{display:block;font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
body.emb .top,body.emb .lead{display:none}
body.emb .wrap{padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">__EYEBROW__</div>
      <h1>__H1__</h1>
    </div>
    <a href="index.html" id="tornar">← Torna al llibre</a>
  </div>
  <p class="lead">__LEAD__</p>
  <div class="sim">
    <div class="card">
      <canvas id="cv" role="img" aria-label=""></canvas>
      <div class="legend">__LEGEND__</div>
    </div>
    <div class="card" aria-label="Explicació pas a pas">
      <div class="pas"><span id="pas"></span><div class="dots" id="dots"></div></div>
      <h2 id="tit"></h2>
      <div id="txt" class="txt" aria-live="polite"></div>
      <div class="ctrls">
        <button type="button" class="btn" id="prev">◀ Anterior</button>
        <button type="button" class="btn" id="rep">↺ Repeteix</button>
        <button type="button" class="btn pri" id="next">Següent ▶</button>
      </div>
      <div id="extra"></div>
      <p class="hint">Animació sense so. També pots avançar amb les fletxes del teclat.</p>
    </div>
  </div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const root=document.documentElement;
if (window.self!==window.top || /[?&]emb=1/.test(location.search)) document.body.classList.add("emb");
let C={};
function readColors(){const cs=getComputedStyle(root);for(const k of ["bg","surface","fg","muted","line","chip","acc","acc-soft","cold","hot","ok","stage"])C[k]=cs.getPropertyValue("--"+k).trim();}
readColors();
const FONT='"Atkinson Hyperlegible",system-ui,sans-serif', DFONT='"Bricolage Grotesque",Georgia,serif';
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const pop=t=>t<=0?0:t>=1?1:1+2.2*Math.pow(t-1,3)+1.2*Math.pow(t-1,2);
const fmt=(n,d=1)=>{const s=n.toFixed(d);return (/^-0[.,]?0*$/.test(s)?s.slice(1):s).replace(".",",").replace("-","−");};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let ctx;
function T(s,x,y,o={}){ctx.save();ctx.font=(o.w||600)+" "+(o.s||16)+"px "+(o.f||FONT);ctx.fillStyle=o.c||C.fg;ctx.textAlign=o.a||"center";ctx.textBaseline=o.b||"middle";if(o.al!=null)ctx.globalAlpha*=o.al;ctx.fillText(s,x,y);ctx.restore();}
function WR(s,x,y,mw,lh,o={}){ctx.save();ctx.font=(o.w||400)+" "+(o.s||15)+"px "+(o.f||FONT);ctx.fillStyle=o.c||C.fg;ctx.textAlign=o.a||"left";ctx.textBaseline="top";if(o.al!=null)ctx.globalAlpha*=o.al;let line="",yy=y;for(const w of s.split(" ")){const tst=line?line+" "+w:w;if(ctx.measureText(tst).width>mw&&line){ctx.fillText(line,x,yy);line=w;yy+=lh}else line=tst}if(line)ctx.fillText(line,x,yy);ctx.restore();return yy+lh;}
function RR(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function ARROW(x1,y1,x2,y2,o={}){const a=Math.atan2(y2-y1,x2-x1),h=o.h||12;ctx.save();ctx.strokeStyle=ctx.fillStyle=o.c||C.fg;ctx.lineWidth=o.lw||3;ctx.lineCap="round";if(o.al!=null)ctx.globalAlpha*=o.al;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*h*.6,y2-Math.sin(a)*h*.6);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-Math.cos(a-.45)*h,y2-Math.sin(a-.45)*h);ctx.lineTo(x2-Math.cos(a+.45)*h,y2-Math.sin(a+.45)*h);ctx.closePath();ctx.fill();ctx.restore();}
function BALL(x,y,r,fill,edge,o={}){if(r<=.3)return;ctx.save();if(o.al!=null)ctx.globalAlpha*=o.al;const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);g.addColorStop(0,"#ffffff");g.addColorStop(.32,fill);g.addColorStop(1,edge);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle=o.s||"rgba(0,0,0,.35)";ctx.stroke();if(o.l&&r>7)T(o.l,x,y+.5,{s:Math.round(r*(o.ls||.9)),w:700,c:o.lc||"#fff"});ctx.restore();}
</script>
<script>
__SIM__
</script>
<script>
(function(){
const cv=$("#cv");ctx=cv.getContext("2d");
const W=SIM.W,H=SIM.H;
function fit(){const d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
fit();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const S=SIM.steps;let i=0,t0=0,raf=0,last=0;const vist=new Set();
const dots=$("#dots");
S.forEach((s,k)=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Pas "+(k+1)+": "+s.t);b.onclick=()=>go(k);dots.appendChild(b);});
function ui(){vist.add(i);$("#pas").textContent="Pas "+(i+1)+" de "+S.length;$("#tit").textContent=S[i].t;$("#txt").innerHTML=S[i].x;$("#prev").disabled=i===0;$("#next").disabled=i===S.length-1;
  [...dots.children].forEach((b,k)=>{if(k===i)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");b.classList.toggle("vist",vist.has(k)&&k!==i);});
  cv.setAttribute("aria-label",S[i].t+". "+$("#txt").textContent);
  if(SIM.panel0)SIM.panel0(S[i],i);}
function go(n){i=clamp(n,0,S.length-1);t0=performance.now();last=t0;if(S[i].init)S[i].init();ui();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);}
function tick(now){const s=S[i];const el=now-t0;const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;
  const t=reduce&&!s.loop?1:clamp(el/(s.d||1600));
  ctx.clearRect(0,0,W,H);s.draw(t,el/1000,dt);if(SIM.panel)SIM.panel(s,t,el/1000);
  if(t<1||s.loop)raf=requestAnimationFrame(tick);}
function redraw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);}
$("#prev").onclick=()=>go(i-1);$("#next").onclick=()=>go(i+1);$("#rep").onclick=()=>go(i);
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,select,textarea"))return;if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readColors();redraw();});
new MutationObserver(()=>{readColors();redraw();}).observe(root,{attributes:true,attributeFilter:["data-theme"]});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
go(0);
})();
</script>
</body>
</html>
