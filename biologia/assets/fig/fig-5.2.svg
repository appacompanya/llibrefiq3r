<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="760" height="280" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="380" y="22" font-size="15" text-anchor="middle" fill="#1F6AA5" font-weight="700" font-style="normal">Forquilla de replicació (model procariota)</text><line x1="40" y1="90" x2="420" y2="90" stroke="#1F6AA5" stroke-width="4"/><line x1="40" y1="170" x2="300" y2="170" stroke="#0E7C66" stroke-width="4"/><line x1="300" y1="170" x2="360" y2="130" stroke="#0E7C66" stroke-width="4"/><line x1="360" y1="130" x2="420" y2="90" stroke="#C4651A" stroke-width="3"/><text x="40" y="78" font-size="13" text-anchor="start" fill="#1F6AA5" font-weight="700" font-style="normal">3′</text><text x="430" y="94" font-size="13" text-anchor="start" fill="#1F6AA5" font-weight="400" font-style="normal">5′  cadena líder, contínua</text><text x="40" y="190" font-size="13" text-anchor="start" fill="#0E7C66" font-weight="700" font-style="normal">5′</text><text x="40" y="220" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">cadena retardada: fragments d’Okazaki, cadascun amb encebador de RNA</text><text x="40" y="246" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Helicasa obre. Primasa posa l’encebador. DNA-polimerasa III allarga només en sentit 5′→3′.</text><text x="40" y="268" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">DNA-polimerasa I treu l’encebador i omple. La ligasa tanca el fosfodièster. La topoisomerasa destensa.</text></svg>