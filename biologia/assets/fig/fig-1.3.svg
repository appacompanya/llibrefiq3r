f24" stroke-width="1.8"/><text x="442" y="154" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">OH</text><line x1="526" y1="146" x2="526" y2="112" stroke="#1b1f24" stroke-width="1.8"/><text x="526" y="106" font-size="13" text-anchor="middle" fill="#1F6AA5" font-weight="700">OH</text><line x1="146" y1="146" x2="280" y2="182" stroke="#B23A52" stroke-width="2.3"/><line x1="280" y1="182" x2="414" y2="146" stroke="#B23A52" stroke-width="2.3"/><text x="280" y="200" font-size="14" text-anchor="middle" fill="#B23A52" font-weight="700">O</text></g><text x="16" y="328" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">L’oxigen vermell surt del C1 (posició α, avall) i arriba al C4 de la segona glucosa.</text><text x="16" y="346" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">És una condensació: en formar-se l’enllaç surt aigua. L’anomèric de la dreta queda lliure.</text><text x="16" y="364" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">La cel·lulosa fa servir els mateixos carbonis, però l’enllaç és β(1→4). Referència: maltosa, CID 439186.</text></svg>