roke="#1b1f24" stroke-width="1.8"/><text x="424" y="166" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">OH</text><line x1="576" y1="146" x2="598" y2="112" stroke="#1b1f24" stroke-width="1.8"/><text x="606" y="105" font-size="13" text-anchor="middle" fill="#1F6AA5" font-weight="700">OH</text><line x1="206" y1="146" x2="335" y2="182" stroke="#B23A52" stroke-width="2.3"/><line x1="335" y1="182" x2="464" y2="146" stroke="#B23A52" stroke-width="2.3"/><text x="335" y="200" font-size="14" text-anchor="middle" fill="#B23A52" font-weight="700">O</text></g><text x="16" y="358" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">L’oxigen vermell surt del C1 (posició α, avall) i arriba al C4 de la segona glucosa.</text><text x="16" y="376" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">És una condensació: en formar-se l’enllaç surt aigua. L’anomèric de la dreta queda lliure.</text><text x="16" y="394" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">La cel·lulosa fa servir els mateixos carbonis, però l’enllaç és β(1→4).</text></svg>