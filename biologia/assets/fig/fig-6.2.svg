<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 205" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="720" height="205" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="360" y="24" font-size="15" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">Selecció natural: tres condicions</text><rect x="20" y="60" width="210" height="50" rx="8" fill="#f3faf0" stroke="#3E7A32" stroke-width="1.5"/><text x="125.0" y="89.0" font-size="13" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">variació</text><rect x="250" y="60" width="210" height="50" rx="8" fill="#e8f1fa" stroke="#1F6AA5" stroke-width="1.5"/><text x="355.0" y="89.0" font-size="13" text-anchor="middle" fill="#1F6AA5" font-weight="700" font-style="normal">heretable</text><rect x="480" y="60" width="220" height="50" rx="8" fill="#f8e6d4" stroke="#C4651A" stroke-width="1.5"/><text x="590.0" y="89.0" font-size="12" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">èxit reproductiu diferent</text><text x="20" y="150.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">No és «el fort sobreviu». És qui deixa més descendents en aquell ambient. La mutació no apareix «per</text><text x="20" y="167.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">necessitat».</text></svg>