<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="640" height="280" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="320" y="22" font-size="15" text-anchor="middle" fill="#8E3A55" font-weight="700" font-style="normal">Anticòs (IgG)</text><path d="M320 200 L240 80 L200 40" fill="none" stroke="#8E3A55" stroke-width="10" stroke-linecap="round"/><path d="M320 200 L400 80 L440 40" fill="none" stroke="#8E3A55" stroke-width="10" stroke-linecap="round"/><path d="M250 90 L220 70" fill="none" stroke="#1F6AA5" stroke-width="6" stroke-linecap="round"/><path d="M390 90 L420 70" fill="none" stroke="#1F6AA5" stroke-width="6" stroke-linecap="round"/><text x="180" y="30" font-size="12" text-anchor="middle" fill="#1F6AA5" font-weight="400" font-style="normal">variable (antigen)</text><text x="460" y="30" font-size="12" text-anchor="middle" fill="#1F6AA5" font-weight="400" font-style="normal">variable</text><text x="320" y="230" font-size="13" text-anchor="middle" fill="#59606a" font-weight="400" font-style="normal">constant · 2 cadenes pesants + 2 de lleugeres · ponts disulfur</text><text x="40" y="262" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">IgM: pentàmer, resposta primària. IgG: monòmer, secundària, travessa la placenta. IgA: secrecions. IgE: al·lèrgia.</text></svg>