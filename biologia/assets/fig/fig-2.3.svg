ont-size="11" text-anchor="start" fill="#1F6AA5" font-weight="400" font-style="normal">centríols</text><rect x="420" y="70" width="300" height="250" rx="8" fill="none" stroke="#3E7A32" stroke-width="8"/><rect x="436" y="86" width="268" height="218" rx="6" fill="#f3faf0" stroke="#3E7A32" stroke-width="2"/><ellipse cx="620" cy="200" rx="70" ry="50" fill="#e7f5f2" stroke="#0E7C66" stroke-width="2"/><text x="620" y="204" font-size="12" text-anchor="middle" fill="#0E7C66" font-weight="700" font-style="normal">vacuol</text><ellipse cx="500" cy="150" rx="28" ry="16" fill="#cfe8c4" stroke="#3E7A32" stroke-width="2"/><text x="470" y="130" font-size="11" text-anchor="start" fill="#3E7A32" font-weight="400" font-style="normal">cloroplast</text><circle cx="520" cy="240" r="22" fill="#efe8fb" stroke="#5C4B8A"/><text x="520" y="244" font-size="11" text-anchor="middle" fill="#5C4B8A" font-weight="400" font-style="normal">nucli</text><text x="40" y="340" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">La paret vegetal és de cel·lulosa, per fora de la membrana. Els centríols són típics de la cèl·lula animal.</text><text x="40" y="362" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Totes dues tenen nucli, mitocondris, reticle, Golgi i ribosomes 80S.</text></svg>