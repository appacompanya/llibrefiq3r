<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="760" height="250" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="380" y="24" font-size="16" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">Glucòlisi al citosol</text><rect x="20" y="70" width="140" height="50" rx="8" fill="#fff" stroke="#1b1f24" stroke-width="1.5"/><text x="90.0" y="99.0" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700" font-style="normal">glucosa</text><rect x="200" y="70" width="150" height="50" rx="8" fill="#f8e6d4" stroke="#C4651A" stroke-width="1.5"/><text x="275.0" y="99.0" font-size="13" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">−2 ATP</text><rect x="390" y="70" width="160" height="50" rx="8" fill="#e7f5f2" stroke="#0E7C66" stroke-width="1.5"/><text x="470.0" y="99.0" font-size="13" text-anchor="middle" fill="#0E7C66" font-weight="700" font-style="normal">+4 ATP, +2 NADH</text><rect x="590" y="70" width="150" height="50" rx="8" fill="#e8f1fa" stroke="#1F6AA5" stroke-width="1.5"/><text x="665.0" y="99.0" font-size="13" text-anchor="middle" fill="#1F6AA5" font-weight="700" font-style="normal">2 piruvat</text><line x1="160" y1="95" x2="200" y2="95" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#ah)"/><line x1="350" y1="95" x2="390" y2="95" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#ah)"/><line x1="550" y1="95" x2="590" y2="95" stroke="#1b1f24" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="170" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Balanç net per glucosa: 2 ATP i 2 NADH. No cal oxigen. El producte són dos piruvats (3C).</text><text x="40" y="194" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Inversió: hexocinasa i fosfofructocinasa. Guany: fosforilació a nivell de substrat.</text><text x="40" y="218" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Els tres passos irreversibles (hexocinasa, fosfofructocinasa, piruvat-cinasa) regulen la via.</text></svg>