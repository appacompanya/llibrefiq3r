<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="700" height="280" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="350" y="24" font-size="15" text-anchor="middle" fill="#5C4B8A" font-weight="700" font-style="normal">Pedigrí · autosòmic recessiu (exemple)</text><rect x="80" y="60" width="28" height="28" fill="#fff" stroke="#1b1f24" stroke-width="2"/><circle cx="160" cy="74" r="14" fill="#fff" stroke="#1b1f24" stroke-width="2"/><line x1="108" y1="74" x2="146" y2="74" stroke="#1b1f24" stroke-width="2"/><line x1="134" y1="74" x2="134" y2="120" stroke="#1b1f24" stroke-width="2"/><line x1="80" y1="120" x2="220" y2="120" stroke="#1b1f24"/><rect x="66" y="120" width="28" height="28" fill="#5C4B8A" stroke="#1b1f24" stroke-width="2"/><circle cx="160" cy="134" r="14" fill="#fff" stroke="#1b1f24" stroke-width="2"/><rect x="206" y="120" width="28" height="28" fill="#fff" stroke="#1b1f24" stroke-width="2"/><text x="80" y="200" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Quadrat: home. Cercle: dona. Ple: afectat.</text><text x="80" y="224" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Dos pares no afectats amb un fill afectat: l’al·lel és recessiu i tots dos són portadors.</text><text x="80" y="248" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Si afecta homes i dones i el pare afectat té filles no afectades, no és lligat a l’X dominant.</text></svg>