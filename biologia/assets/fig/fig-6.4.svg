<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 160" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="740" height="160" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="370" y="22" font-size="14" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">Què canvia les freqüències al·lèliques</text><rect x="16" y="50" width="135" height="40" rx="8" fill="#f3faf0" stroke="#3E7A32" stroke-width="1.5"/><text x="83.5" y="74.0" font-size="12" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">selecció</text><rect x="161" y="50" width="135" height="40" rx="8" fill="#f3faf0" stroke="#3E7A32" stroke-width="1.5"/><text x="228.5" y="74.0" font-size="12" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">mutació</text><rect x="306" y="50" width="135" height="40" rx="8" fill="#f3faf0" stroke="#3E7A32" stroke-width="1.5"/><text x="373.5" y="74.0" font-size="12" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">deriva</text><rect x="451" y="50" width="135" height="40" rx="8" fill="#f3faf0" stroke="#3E7A32" stroke-width="1.5"/><text x="518.5" y="74.0" font-size="12" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">flux gènic</text><rect x="596" y="50" width="135" height="40" rx="8" fill="#f3faf0" stroke="#3E7A32" stroke-width="1.5"/><text x="663.5" y="74.0" font-size="12" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">selecció sexual</text><text x="16" y="120" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">L’aparellament no aleatori canvia les freqüències genotípiques, no per si sol les al·lèliques.</text><text x="16" y="144" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Si es compleix Hardy-Weinberg, les freqüències no canvien: no hi ha evolució en aquell locus.</text></svg>