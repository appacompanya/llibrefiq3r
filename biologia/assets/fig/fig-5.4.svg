<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="740" height="240" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="370" y="22" font-size="15" text-anchor="middle" fill="#B23A52" font-weight="700" font-style="normal">Ribosoma</text><ellipse cx="360" cy="90" rx="180" ry="36" fill="#fde8ec" stroke="#B23A52" stroke-width="2"/><ellipse cx="360" cy="130" rx="200" ry="28" fill="#fff" stroke="#B23A52" stroke-width="2"/><text x="250" y="96" font-size="14" text-anchor="middle" fill="#59606a" font-weight="700" font-style="normal">E</text><text x="360" y="96" font-size="14" text-anchor="middle" fill="#1F6AA5" font-weight="700" font-style="normal">P</text><text x="470" y="96" font-size="14" text-anchor="middle" fill="#0E7C66" font-weight="700" font-style="normal">A</text><text x="40" y="180" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">A: entra l’aminoacil-RNAt. P: porta la cadena. E: surt l’RNAt buit.</text><text x="40" y="204" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">El ribosoma llegeix l’RNAm 5′→3′. L’enllaç peptídic el fa el centre peptidil-transferasa.</text><text x="40" y="228" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Inici: AUG (Met; en bacteris, formilmetionina). Parada: UAA, UAG o UGA, amb factor d’alliberament.</text></svg>