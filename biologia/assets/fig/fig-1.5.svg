</g></g><text x="16" y="308" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">A pH 7 el grup amino és NH₃⁺ i el carboxil és COO⁻. L’estereocentre de la L-alanina és el del CID 5950.</text><text x="16" y="326" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">A la glicilglicina (CID 11163) l’enllaç amida és el peptídic. L’extrem N és el que porta NH₃⁺; l’extrem C, el COO⁻.</text></svg>