<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="760" height="280" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="380" y="24" font-size="16" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">Esquema general</text><rect x="40" y="60" width="200" height="50" rx="8" fill="#fde8ec" stroke="#B23A52" stroke-width="1.5"/><text x="140.0" y="89.0" font-size="13" text-anchor="middle" fill="#B23A52" font-weight="700" font-style="normal">catabolisme</text><text x="140" y="140" font-size="12" text-anchor="middle" fill="#59606a" font-weight="400" font-style="normal">oxida, allibera energia</text><rect x="280" y="60" width="200" height="50" rx="8" fill="#fff8e8" stroke="#A67C12" stroke-width="1.5"/><text x="380.0" y="89.0" font-size="13" text-anchor="middle" fill="#A67C12" font-weight="700" font-style="normal">ATP, NADH</text><rect x="520" y="60" width="200" height="50" rx="8" fill="#e7f5f2" stroke="#0E7C66" stroke-width="1.5"/><text x="620.0" y="89.0" font-size="13" text-anchor="middle" fill="#0E7C66" font-weight="700" font-style="normal">anabolisme</text><text x="620" y="140" font-size="12" text-anchor="middle" fill="#59606a" font-weight="400" font-style="normal">redueix, consumeix energia</text><line x1="240" y1="85" x2="280" y2="85" stroke="#59606a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="480" y1="85" x2="520" y2="85" stroke="#59606a" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="190" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Una via és una seqüència de reaccions amb enzims. Una reacció n’és només un pas.</text><text x="40" y="214" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">L’ATP transporta energia química. NADH, NADPH i FADH₂ transporten poder reductor.</text><text x="40" y="238" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">NADH i FADH₂ van sobretot al catabolisme. El NADPH va sobretot a l’anabolisme.</text><text x="40" y="262" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">La síntesi de proteïnes (traducció) es tracta al tema de genètica molecular.</text></svg>