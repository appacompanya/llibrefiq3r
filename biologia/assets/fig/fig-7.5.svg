<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 150" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="740" height="150" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="370" y="22" font-size="15" text-anchor="middle" fill="#A67C12" font-weight="700" font-style="normal">Formes acel·lulars</text><rect x="20" y="50" width="200" height="50" rx="8" fill="#fde8ec" stroke="#B23A52" stroke-width="1.5"/><text x="120.0" y="79.0" font-size="12" text-anchor="middle" fill="#B23A52" font-weight="700" font-style="normal">virus: àcid nucleic + càpsida</text><rect x="250" y="50" width="220" height="50" rx="8" fill="#efe8fb" stroke="#5C4B8A" stroke-width="1.5"/><text x="360.0" y="79.0" font-size="12" text-anchor="middle" fill="#5C4B8A" font-weight="700" font-style="normal">viroide: RNA, sense càpsida</text><rect x="500" y="50" width="220" height="50" rx="8" fill="#fff8e8" stroke="#A67C12" stroke-width="1.5"/><text x="610.0" y="79.0" font-size="11" text-anchor="middle" fill="#A67C12" font-weight="700" font-style="normal">prió: proteïna, sense àcid nucleic</text><text x="20" y="130" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Cap dels tres és una cèl·lula. El virus només es replica dins un hoste.</text></svg>