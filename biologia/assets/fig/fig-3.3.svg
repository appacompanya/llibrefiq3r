<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="760" height="345" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="380" y="22" font-size="15" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">Cicle de Krebs (matriu), per cada acetil-CoA</text><circle cx="370" cy="160" r="78" fill="none" stroke="#C4651A" stroke-width="3"/><text x="370" y="150" font-size="16" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">Krebs</text><text x="370" y="172" font-size="12" text-anchor="middle" fill="#59606a" font-weight="400" font-style="normal">oxaloacetat</text><text x="370" y="190" font-size="12" text-anchor="middle" fill="#59606a" font-weight="400" font-style="normal">es regenera</text><rect x="20" y="70" width="160" height="44" rx="8" fill="#f8e6d4" stroke="#C4651A" stroke-width="1.5"/><text x="100.0" y="96.0" font-size="13" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">acetil-CoA</text><line x1="180" y1="92" x2="292" y2="130" stroke="#C4651A" stroke-width="1.6" marker-end="url(#ah)"/><text x="560" y="80" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700" font-style="normal">2 CO₂</text><text x="560" y="110" font-size="14" text-anchor="start" fill="#1F6AA5" font-weight="700" font-style="normal">3 NADH</text><text x="560" y="140" font-size="14" text-anchor="start" fill="#5C4B8A" font-weight="700" font-style="normal">1 FADH₂</text><text x="560" y="170" font-size="14" text-anchor="start" fill="#0E7C66" font-weight="700" font-style="normal">1 GTP (≈ 1 ATP)</text><text x="20" y="240" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Abans: piruvat (matriu) → acetil-CoA + CO₂ + NADH. Per glucosa, el cicle gira dues vegades.</text><text x="20" y="264" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Ordre dels intermedis: citrat, isocitrat, α-cetoglutarat, succinil-CoA, succinat, fumarat, malat, oxaloacetat.</text><text x="20" y="288.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">El CO₂ d’aquesta fase no és el que «respirem» com a objectiu: l’objectiu és extreure electrons (NADH,</text><text x="20" y="305.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">FADH₂).</text></svg>