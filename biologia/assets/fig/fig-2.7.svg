<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="780" height="280" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="390" y="22" font-size="14" text-anchor="middle" fill="#5C4B8A" font-weight="700" font-style="normal">Meiosi · una cèl·lula 2n dona quatre cèl·lules n diferents</text><rect x="20" y="46" width="360" height="90" rx="8" fill="#f7f4fb" stroke="#5C4B8A" stroke-width="1.2"/><text x="200" y="78" font-size="14" text-anchor="middle" fill="#5C4B8A" font-weight="700" font-style="normal">Meiosi I (reduccional)</text><text x="200" y="104" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="400" font-style="normal">Profase I: entrecreuament. Anafase I: se separen els homòlegs.</text><rect x="400" y="46" width="360" height="90" rx="8" fill="#f7f4fb" stroke="#5C4B8A" stroke-width="1.2"/><text x="580" y="78" font-size="14" text-anchor="middle" fill="#5C4B8A" font-weight="700" font-style="normal">Meiosi II (equacional)</text><text x="580" y="104" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="400" font-style="normal">Com una mitosi: se separen cromàtides germanes.</text><text x="40" y="180" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Resultat: 4 nuclis haploides, genèticament diferents (entrecreuament + repartiment a l’atzar).</text><text x="40" y="206" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Funció: gàmetes (animals) o espores (plantes, en el cicle que toqui). No és per créixer.</text><text x="40" y="232" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">La mitosi conserva 2n i fa còpies. La meiosi redueix a n i genera variació.</text><text x="40" y="258" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Lligament: gens del mateix cromosoma. La recombinació es mesura a la profase I.</text></svg>