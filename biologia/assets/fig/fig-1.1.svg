e" font-size="13" font-weight="700" fill="#1F6AA5">δ−</text><text x="339.5" y="452.7" text-anchor="middle" font-size="13" font-weight="700" fill="#B23A52">δ+</text><text x="314.9" y="420.9" text-anchor="middle" font-size="13" font-weight="700" fill="#B23A52">δ+</text><circle cx="363.5" cy="255.3" r="12" fill="#fff"/><text x="363.5" y="260.3" text-anchor="middle" font-size="16" font-weight="700" fill="#1F6AA5">O</text><circle cx="398.3" cy="282.2" r="10" fill="#fff"/><text x="398.3" y="287.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">H</text><circle cx="328.7" cy="282.2" r="10" fill="#fff"/><text x="328.7" y="287.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">H</text><text x="380.7" y="237.2" text-anchor="middle" font-size="13" font-weight="700" fill="#1F6AA5">δ−</text><text x="383.6" y="305.2" text-anchor="middle" font-size="13" font-weight="700" fill="#B23A52">δ+</text><text x="314.1" y="267.3" text-anchor="middle" font-size="13" font-weight="700" fill="#B23A52">δ+</text><circle cx="556.5" cy="255.3" r="12" fill="#fff"/><text x="556.5" y="260.3" text-anchor="middle" font-size="16" font-weight="700" fill="#1F6AA5">O</text><circle cx="521.7" cy="282.2" r="10" fill="#fff"/><text x="521.7" y="287.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">H</text><circle cx="591.3" cy="282.2" r="10" fill="#fff"/><text x="591.3" y="287.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">H</text><text x="539.3" y="237.2" text-anchor="middle" font-size="13" font-weight="700" fill="#1F6AA5">δ−</text><text x="507.0" y="267.3" text-anchor="middle" font-size="13" font-weight="700" fill="#B23A52">δ+</text><text x="605.9" y="267.3" text-anchor="middle" font-size="13" font-weight="700" fill="#B23A52">δ+</text><text x="400" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7C66">pont d’hidrogen (línia discontínua)</text></g><text x="16" y="698" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">Cada molècula és angular: l’angle H–O–H és d’uns 104,5°. L’oxigen és δ− i cada hidrogen és δ+.</text><text x="16" y="716" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">El pont, discontinu, surt de l’H (δ+) d’una molècula i arriba a l’O (δ−) de la veïna. O–H···O és gairebé lineal.</text><text x="16" y="734" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">La molècula central en fa quatre: dos pels seus hidrògens i dos per la banda dels parells no enllaçants.</text></svg>