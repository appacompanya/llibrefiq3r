<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="640" height="354" fill="#fff"/><text x="16" y="22" font-size="15" font-weight="700" fill="#0E7C66">Dues molècules d’aigua</text><g transform="translate(0,36)"><line x1="182.0" y1="132.0" x2="212.0" y2="132.0" stroke="#1b1f24" stroke-width="2.6" stroke-linecap="round"/><line x1="164.5" y1="118.4" x2="157.0" y2="89.4" stroke="#1b1f24" stroke-width="2.6" stroke-linecap="round"/><line x1="280.6" y1="120.9" x2="298.9" y2="97.2" stroke="#1b1f24" stroke-width="2.6" stroke-linecap="round"/><line x1="280.6" y1="143.1" x2="298.9" y2="166.8" stroke="#1b1f24" stroke-width="2.6" stroke-linecap="round"/><line x1="242.0" y1="132.0" x2="256.0" y2="132.0" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5"/><text x="168.0" y="138.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1F6AA5">O</text><text x="272.0" y="138.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1F6AA5">O</text><text x="226.0" y="138.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">H</text><text x="153.5" y="81.8" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">H</text><text x="307.5" y="92.1" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">H</text><text x="307.5" y="183.9" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1f24">H</text><text x="168.0" y="160.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1F6AA5">δ−</text><text x="272.0" y="112.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1F6AA5">δ−</text><text x="226.0" y="160.0" text-anchor="middle" font-size="18" font-weight="700" fill="#B23A52">δ+</text><text x="149.5" y="57.8" text-anchor="middle" font-size="18" font-weight="700" fill="#B23A52">δ+</text><text x="323.5" y="70.1" text-anchor="middle" font-size="18" font-weight="700" fill="#B23A52">δ+</text><text x="323.5" y="203.9" text-anchor="middle" font-size="18" font-weight="700" fill="#B23A52">δ+</text><text x="250" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7C66">pont d’hidrogen</text></g><text x="16" y="308" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">Cada molècula és angular, amb dos enllaços O–H. L’oxigen és δ− i cada hidrogen és δ+.</text><text x="16" y="326" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">El pont d’hidrogen (verd, discontinu) va de l’H d’una molècula a l’O de l’altra. No és covalent.</text></svg>