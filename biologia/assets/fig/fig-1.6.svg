<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 305" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="840" height="305" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="40" y="36" font-size="14" text-anchor="start" fill="#0E7C66" font-weight="700" font-style="normal">Primària</text><text x="40" y="58" font-size="12" text-anchor="start" fill="#59606a" font-weight="400" font-style="normal">seqüència</text><text x="40" y="100" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700" font-style="normal">—Ala—Gly—Ser—Val—</text><text x="230" y="36" font-size="14" text-anchor="start" fill="#1F6AA5" font-weight="700" font-style="normal">Secundària</text><text x="230" y="58" font-size="12" text-anchor="start" fill="#59606a" font-weight="400" font-style="normal">α-hèlix / full β</text><path d="M240 90 q20 -30 40 0 t40 0 t40 0" fill="none" stroke="#1F6AA5" stroke-width="3"/><text x="240" y="140" font-size="12" text-anchor="start" fill="#59606a" font-weight="400" font-style="normal">ponts d’H de l’esquelet</text><text x="470" y="36" font-size="14" text-anchor="start" fill="#C4651A" font-weight="700" font-style="normal">Terciària</text><circle cx="540" cy="110" r="40" fill="none" stroke="#C4651A" stroke-width="3"/><text x="500" y="170" font-size="12" text-anchor="start" fill="#59606a" font-weight="400" font-style="normal">R: hidròfobs, iònics,</text><text x="500" y="188" font-size="12" text-anchor="start" fill="#59606a" font-weight="400" font-style="normal">H, ponts S–S</text><text x="640" y="36" font-size="14" text-anchor="start" fill="#5C4B8A" font-weight="700" font-style="normal">Quaternària</text><circle cx="680" cy="100" r="22" fill="#efe8fb" stroke="#5C4B8A" stroke-width="2"/><circle cx="710" cy="130" r="22" fill="#efe8fb" stroke="#5C4B8A" stroke-width="2"/><text x="640" y="188" font-size="12" text-anchor="start" fill="#59606a" font-weight="400" font-style="normal">dues cadenes o més</text><text x="40" y="240" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">L’hèlix α: pont d’hidrogen entre el C=O del residu i i l’N–H del residu i+4. El full β: ponts entre cadenes veïnes.</text><text x="40" y="262.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Desnaturalitzar trenca les estructures 2a, 3a i 4a; la seqüència (1a) es manté. No tots els pròtids tenen estructura</text><text x="40" y="279.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">quaternària.</text></svg>