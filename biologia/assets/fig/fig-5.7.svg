<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 160" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="740" height="160" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="370" y="22" font-size="15" text-anchor="middle" fill="#B23A52" font-weight="700" font-style="normal">Eines</text><rect x="20" y="50" width="160" height="40" rx="8" fill="#e8f1fa" stroke="#1F6AA5" stroke-width="1.5"/><text x="100.0" y="74.0" font-size="13" text-anchor="middle" fill="#1F6AA5" font-weight="700" font-style="normal">restricció</text><rect x="200" y="50" width="150" height="40" rx="8" fill="#e7f5f2" stroke="#0E7C66" stroke-width="1.5"/><text x="275.0" y="74.0" font-size="13" text-anchor="middle" fill="#0E7C66" font-weight="700" font-style="normal">lligasa</text><rect x="370" y="50" width="150" height="40" rx="8" fill="#fff8e8" stroke="#A67C12" stroke-width="1.5"/><text x="445.0" y="74.0" font-size="13" text-anchor="middle" fill="#A67C12" font-weight="700" font-style="normal">plasmidi</text><rect x="540" y="50" width="170" height="40" rx="8" fill="#fde8ec" stroke="#B23A52" stroke-width="1.5"/><text x="625.0" y="74.0" font-size="13" text-anchor="middle" fill="#B23A52" font-weight="700" font-style="normal">PCR / CRISPR</text><text x="20" y="120" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">DNA recombinant = vector + insert, units per la ligasa. Tot OMG no és transgènic: un knockout propi és OMG i no transgènic.</text><text x="20" y="144" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Clonació molecular (copiar un fragment) no és el mateix que la clonació reproductiva (SCNT).</text></svg>