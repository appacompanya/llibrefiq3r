<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="740" height="240" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="370" y="24" font-size="15" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">Fermentacions: regeneren el NAD⁺</text><rect x="40" y="60" width="150" height="44" rx="8" fill="#fff" stroke="#1b1f24" stroke-width="1.5"/><text x="115.0" y="86.0" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700" font-style="normal">2 piruvat</text><rect x="230" y="50" width="220" height="40" rx="8" fill="#fde8ec" stroke="#B23A52" stroke-width="1.5"/><text x="340.0" y="74.0" font-size="13" text-anchor="middle" fill="#B23A52" font-weight="700" font-style="normal">làctica → 2 lactat</text><rect x="230" y="110" width="280" height="40" rx="8" fill="#f8e6d4" stroke="#C4651A" stroke-width="1.5"/><text x="370.0" y="134.0" font-size="13" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">alcohòlica → 2 etanol + 2 CO₂</text><line x1="190" y1="82" x2="230" y2="70" stroke="#B23A52" stroke-width="1.6" marker-end="url(#ah)"/><line x1="190" y1="90" x2="230" y2="130" stroke="#C4651A" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="180" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Balanç net des de glucosa: 2 ATP. El NADH de la glucòlisi es consumeix; no hi ha cadena.</text><text x="40" y="204" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Làctica: múscul en dèficit d’oxigen, iogurt. Alcohòlica: llevat, pa i vi. Són degradacions parcials.</text><text x="40" y="228" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">No és el mateix que la respiració anaeròbica bacteriana (cadena amb un acceptor inorgànic diferent de l’O₂).</text></svg>