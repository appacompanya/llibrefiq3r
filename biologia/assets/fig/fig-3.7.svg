<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="740" height="260" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="370" y="22" font-size="15" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">Cicle de Calvin (estroma), per cada CO₂</text><circle cx="300" cy="130" r="70" fill="none" stroke="#3E7A32" stroke-width="3"/><text x="300" y="126" font-size="14" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">RuBP</text><text x="300" y="146" font-size="12" text-anchor="middle" fill="#59606a" font-weight="400" font-style="normal">5C</text><text x="80" y="80" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="700" font-style="normal">CO₂</text><line x1="110" y1="90" x2="230" y2="120" stroke="#3E7A32" stroke-width="1.6" marker-end="url(#ah)"/><text x="150" y="70" font-size="12" text-anchor="middle" fill="#3E7A32" font-weight="400" font-style="normal">rubisco</text><text x="500" y="80" font-size="14" text-anchor="start" fill="#1F6AA5" font-weight="700" font-style="normal">3-PGA → G3P</text><text x="500" y="110" font-size="13" text-anchor="start" fill="#59606a" font-weight="400" font-style="normal">gasta ATP i NADPH</text><text x="500" y="150" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">una part de G3P surt</text><text x="500" y="174" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">(sucre). La resta</text><text x="500" y="198" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">regenera RuBP (ATP).</text><text x="40" y="230" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Per fixar 1 CO₂ calen 2 NADPH i 3 ATP. Per a una glucosa (6 CO₂): 12 NADPH i 18 ATP.</text></svg>