ext><text x="20" y="137.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">llet.</text><text x="20" y="163.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">El VIH infecta limfòcits T CD4. La sida és la immunodeficiència que en resulta, no el nom del virus.</text></svg>