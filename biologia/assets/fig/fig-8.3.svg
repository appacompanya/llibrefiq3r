<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="740" height="200" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="370" y="22" font-size="14" text-anchor="middle" fill="#8E3A55" font-weight="700" font-style="normal">Dues branques de la immunitat específica</text><rect x="30" y="50" width="320" height="90" rx="8" fill="#fde8ec" stroke="#B23A52" stroke-width="1.5"/><text x="190" y="84" font-size="16" text-anchor="middle" fill="#B23A52" font-weight="700" font-style="normal">Humoral</text><text x="190" y="110" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="400" font-style="normal">limfòcits B → cèl·lules plasmàtiques → anticossos</text><rect x="380" y="50" width="330" height="90" rx="8" fill="#e8f1fa" stroke="#1F6AA5" stroke-width="1.5"/><text x="545" y="84" font-size="16" text-anchor="middle" fill="#1F6AA5" font-weight="700" font-style="normal">Cel·lular</text><text x="545" y="110" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="400" font-style="normal">T col·laboradors (CD4) i T citotòxics (CD8)</text><text x="30" y="170" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Els T col·laboradors reconeixen l’antigen presentat amb MHC II. Els citotòxics, amb MHC I.</text></svg>