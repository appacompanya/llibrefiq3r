ext><line x1="548" y1="186" x2="550" y2="226" stroke="#1b1f24" stroke-width="1.8"/><text x="551" y="244" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">OH</text><line x1="492" y1="186" x2="456" y2="178" stroke="#1b1f24" stroke-width="1.8"/><text x="428" y="182" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">OH</text><line x1="464" y1="138" x2="428" y2="148" stroke="#1b1f24" stroke-width="1.8"/><text x="400" y="154" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">OH</text><line x1="576" y1="138" x2="598" y2="104" stroke="#1b1f24" stroke-width="1.8"/><text x="606" y="97" font-size="13" text-anchor="middle" fill="#1F6AA5" font-weight="700">OH</text></g><text x="16" y="338" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">L’oxigen és un vèrtex de l’anell, entre C5 i C1. C1 a la dreta; C2 i C3 a baix; C4 a l’esquerra.</text><text x="16" y="356" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">Sèrie D: el CH₂OH del C5 mira amunt. α: l’OH del C1 és avall. β: l’OH del C1 és amunt.</text><text x="16" y="374" font-size="13" fill="#3b4148" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">C2–OH avall, C3–OH amunt, C4–OH avall. L’H de cada carboni, no escrit, és al costat oposat de l’OH.</text></svg>