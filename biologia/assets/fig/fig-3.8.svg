<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="760" height="220" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="380" y="22" font-size="15" text-anchor="middle" fill="#C4651A" font-weight="700" font-style="normal">On passa cada via (eucariota)</text><rect x="20" y="50" width="170" height="70" rx="8" fill="#fff8e8" stroke="#A67C12" stroke-width="1.5"/><text x="105" y="80" font-size="14" text-anchor="middle" fill="#A67C12" font-weight="700" font-style="normal">citosol</text><text x="105" y="100" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="400" font-style="normal">glucòlisi</text><rect x="210" y="50" width="250" height="70" rx="8" fill="#fde8ec" stroke="#B23A52" stroke-width="1.5"/><text x="335" y="78" font-size="14" text-anchor="middle" fill="#B23A52" font-weight="700" font-style="normal">mitocondri</text><text x="335" y="98" font-size="11" text-anchor="middle" fill="#1b1f24" font-weight="400" font-style="normal">piruvat, Krebs, β-oxidació, cadena</text><rect x="480" y="50" width="250" height="70" rx="8" fill="#f3faf0" stroke="#3E7A32" stroke-width="1.5"/><text x="605" y="78" font-size="14" text-anchor="middle" fill="#3E7A32" font-weight="700" font-style="normal">cloroplast</text><text x="605" y="98" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="400" font-style="normal">fase lluminosa i Calvin</text><text x="20" y="160" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Fermentació: citosol. Lipogènesi: citosol (gasta NADPH). Fotosíntesi bacteriana: membrana.</text><text x="20" y="184" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Quimiosíntesi: bacteris, sense llum; oxiden un compost inorgànic i fixen CO₂.</text><text x="20" y="208" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Respiració aeròbica ≈ 30–32 ATP/glucosa. Fermentació = 2 ATP/glucosa.</text></svg>