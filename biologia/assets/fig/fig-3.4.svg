<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><rect width="760" height="305" fill="#fff"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1f24"/></marker><marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0E7C66"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B23A52"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F6AA5"/></marker></defs><text x="380" y="22" font-size="15" text-anchor="middle" fill="#1F6AA5" font-weight="700" font-style="normal">Cadena respiratòria · membrana interna</text><rect x="40" y="60" width="110" height="44" rx="8" fill="#1F6AA5" stroke="#1F6AA5" stroke-width="1.5"/><text x="95.0" y="86.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700" font-style="normal">I</text><rect x="180" y="60" width="110" height="44" rx="8" fill="#5C4B8A" stroke="#5C4B8A" stroke-width="1.5"/><text x="235.0" y="86.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700" font-style="normal">II</text><rect x="320" y="60" width="110" height="44" rx="8" fill="#0E7C66" stroke="#0E7C66" stroke-width="1.5"/><text x="375.0" y="86.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700" font-style="normal">III</text><rect x="460" y="60" width="110" height="44" rx="8" fill="#B23A52" stroke="#B23A52" stroke-width="1.5"/><text x="515.0" y="86.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700" font-style="normal">IV</text><rect x="600" y="60" width="110" height="44" rx="8" fill="#C4651A" stroke="#C4651A" stroke-width="1.5"/><text x="655.0" y="86.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700" font-style="normal">ATP-sintasa</text><text x="40" y="130" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">NADH entra pel complex I. El FADH₂ (succinat) entra pel complex II i salta el I.</text><text x="40" y="154" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">L’acceptor final és l’O₂, al complex IV: ½ O₂ + 2 e⁻ + 2 H⁺ → H₂O (per cada parell d’electrons).</text><text x="40" y="178" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">El gradient de protons torna a la matriu per l’ATP-sintasa (quimiosmosi).</text><text x="40" y="210" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">P/O actual: NADH ≈ 2,5 ATP; FADH₂ ≈ 1,5 ATP. Per això una glucosa rendeix uns 30–32 ATP.</text><text x="40" y="234.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Balanç clàssic (3 i 2): 38 ATP (llançadora malat-aspartat o procariota) o 36 (llançadora del</text><text x="40" y="251.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">glicerol-fosfat).</text><text x="40" y="275.0" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="400" font-style="normal">Sense O₂ la cadena s’atura, el NADH no es reoxida i el Krebs s’atura.</text></svg>