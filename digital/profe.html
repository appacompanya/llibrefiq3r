<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zona del professorat · FQ 3r ESO</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --fg:#1f2328; --muted:#5f6670; --line:#e1ddd5; --chip:#efece6; --ok:#1f7a4a; --warn:#9a5b00; --ink:#1d2a3a; --ink-fg:#f3f1ec;
  --s1:#2F8F95; --s2:#E0782F; --s3:#6C5CC9; --s4:#3F9A5A; --s5:#D14B66; --s6:#2F6DB5; --acc:var(--s6);
  --font-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif; --font-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171b;--surface:#1d2026;--fg:#eceef1;--muted:#a3aab4;--line:#2f333b;--chip:#272b32;--ok:#5fd394;--warn:#f0b45c;--ink:#0f1620;--ink-fg:#eceef1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--surface:#1d2026;--fg:#eceef1;--muted:#a3aab4;--line:#2f333b;--chip:#272b32;--ok:#5fd394;--warn:#f0b45c;--ink:#0f1620;--ink-fg:#eceef1;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.5vw,2.2rem)}h2{font-size:1.3rem}h3{font-size:1.05rem}
.eyebrow{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:12px}
.btn{font:inherit;font-size:.86rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;border:1.5px solid var(--acc);background:var(--acc);color:#fff;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}.btn.ghost:hover{border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{background:transparent;color:#c2413a;border-color:#c2413a}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;font-size:.9rem;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.note{font-size:.86rem;color:var(--muted);margin:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}
label.f{display:grid;gap:4px;font-weight:700;font-size:.86rem}
.tscroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
table.t thead th{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.t tbody tr.click{cursor:pointer}table.t tbody tr.click:hover{background:var(--chip)}
code.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;background:var(--chip);border-radius:6px;padding:2px 6px}
.pill{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.sub{background:#c98a16;color:#fff}.pill.ret{background:var(--ok);color:#fff}.pill.draft{background:var(--chip);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{display:flex;align-items:center;gap:12px;font-weight:700}
.switch input{width:44px;height:24px;accent-color:var(--ok)}
.login{max-width:420px;margin:8vh auto 0}
.err{color:#c2413a;font-weight:700;min-height:1.2em;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:.9rem;z-index:60}
.revhead{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.revhead h2{flex:1;min-width:0}
.fbed{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;background:color-mix(in srgb,var(--ink) 5%,var(--surface));border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.fbed .lvs{display:flex;gap:4px}
.fbed .lvs button{font:inherit;font-size:.75rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:2px 8px;cursor:pointer}
.fbed .lvs button.on{color:#fff}
.fbed .lvs button.on[data-lv=NA]{background:#c2413a;border-color:#c2413a}.fbed .lvs button.on[data-lv=AS]{background:#c98a16;border-color:#c98a16}.fbed .lvs button.on[data-lv=AN]{background:#3f8f5a;border-color:#3f8f5a}.fbed .lvs button.on[data-lv=AE]{background:#2f6db5;border-color:#2f6db5}
.fbed textarea{grid-column:1/-1;min-height:2.4em}
.fbed .prop{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.fbed .prop button{font:inherit;font-size:.78rem;font-weight:700;border:0;background:none;color:var(--acc);cursor:pointer;padding:0 0 0 6px}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.codecard{border:1.5px dashed var(--fg);border-radius:12px;padding:12px;display:grid;gap:4px;background:var(--surface)}
.codecard b{font-size:1rem}.codecard code{font-size:1.35rem;letter-spacing:.12em;font-weight:800}
.codecard span{font-size:.78rem;color:var(--muted)}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.wrap{max-width:none}.codecard{break-inside:avoid}}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="css/fitxa.css">
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.105.3/mathlive.min.js"></script>
<script src="js/units.js"></script>
<script src="js/fitxes.js"></script>
<script src="js/docs.js"></script>
<script src="js/store.js"></script>
<script src="js/fitxa.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden aria-live="polite"></div>
<script src="js/profe.js"></script>
</body>
</html>
