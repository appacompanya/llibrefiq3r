<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taula en joc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Joc per aprendre els grups 1, 2 i 13–18 de la taula periòdica (símbols, noms i valències). Comú a 2n, 3r i 4t d'ESO.
   ?nivell=2n|3r|4t tria la configuració inicial. Les millors puntuacions es desen només en aquest navegador. */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --fg:#1f2328; --muted:#5f6670; --line:#e1ddd5; --chip:#efece6;
  --acc:#6C5CC9; --acc-soft:#ECE9FA; --ok:#2e7d4f; --ok-soft:#dff1e6; --bad:#c2413a; --bad-soft:#fbe3e1; --pre:#eceff3;
  --g1:#F6C2B5; --g2:#F9DDAA; --g13:#D3DCE6; --g14:#BFE3E0; --g15:#BFD8F4; --g16:#C9D6F7; --g17:#D7CCF2; --g18:#F2C9E3;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171c; --surface:#1d2027; --fg:#e8eaee; --muted:#a1a8b3; --line:#2f333c; --chip:#262a32;
  --acc:#a99cf2; --acc-soft:#2b2745; --ok:#5fc08a; --ok-soft:#1f3a2b; --bad:#f07870; --bad-soft:#3d2222; --pre:#2a2e36;
  --g1:#6b3a30; --g2:#6a5129; --g13:#3c4652; --g14:#2c5552; --g15:#2c4766; --g16:#35406b; --g17:#45396b; --g18:#653a58; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1d2027; --fg:#e8eaee; --muted:#a1a8b3; --line:#2f333c; --chip:#262a32;
  --acc:#a99cf2; --acc-soft:#2b2745; --ok:#5fc08a; --ok-soft:#1f3a2b; --bad:#f07870; --bad-soft:#3d2222; --pre:#2a2e36;
  --g1:#6b3a30; --g2:#6a5129; --g13:#3c4652; --g14:#2c5552; --g15:#2c4766; --g16:#35406b; --g17:#45396b; --g18:#653a58; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4.5vw,2.3rem);margin:0;line-height:1.05}
h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 8px}
.sub{color:var(--muted);margin:4px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);font-weight:700}
.opt:disabled{opacity:.45;cursor:not-allowed}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:var(--chip);color:var(--fg)}
.lab{font-weight:700;margin:12px 0 6px}
.lab:first-child{margin-top:0}
.small{font-size:.86rem;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.cols .opt{min-width:46px;padding:6px 10px;text-align:center}
/* barra del joc */
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:0 0 10px}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.stat b{font-size:1.05rem}
.msg{min-height:1.5em;font-weight:700;margin:4px 0 8px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
/* taula */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.tbl{display:grid;grid-template-columns:28px repeat(8,minmax(56px,1fr));gap:5px;min-width:520px}
.gh{text-align:center;font-size:.78rem;color:var(--muted);line-height:1.15;padding:2px 0}
.gh b{display:block;color:var(--fg);font-size:.95rem}
.ph{display:grid;place-items:center;font-size:.85rem;color:var(--muted)}
.cell{position:relative;min-height:62px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;cursor:pointer;text-align:center}
.cell .z{position:absolute;top:3px;left:6px;font-size:.66rem;color:var(--muted)}
.cell .s{font-weight:700;font-size:1.25rem;line-height:1.1}
.cell .n{font-size:.68rem;line-height:1.1;overflow-wrap:anywhere}
.cell.empty:hover,.cell.empty:focus-visible{border-color:var(--acc);outline:none}
.cell.target{border-color:var(--acc);border-style:solid;box-shadow:0 0 0 3px var(--acc-soft)}
.cell.done{border-style:solid;border-color:transparent}
.cell.pre{border-style:solid;border-color:transparent;opacity:.9}
.cell.void{visibility:hidden}
.cell.bad{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cell input{width:100%;font:inherit;font-weight:700;text-align:center;border:0;background:transparent;color:var(--fg);padding:2px;min-width:0}
.cell input:focus{outline:none}
.vslot{min-height:38px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.82rem;cursor:pointer;background:var(--surface);padding:2px;text-align:center}
.vslot.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.vslot.bad{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
/* fitxes */
.tray{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;min-width:52px;min-height:44px;text-align:center}
.tile .s{font-weight:700;font-size:1.1rem;display:block;line-height:1.1}
.tile .n{font-size:.72rem;display:block}
.tile[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 3px var(--acc-soft)}
/* repte ràpid */
.q{font-size:1.25rem;font-weight:700;margin:6px 0 12px}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ans button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700;font-size:1.05rem;cursor:pointer;min-height:52px}
.ans button.ok{border-color:var(--ok);background:var(--ok-soft)}.ans button.bad{border-color:var(--bad);background:var(--bad-soft)}
.timer{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 10px}.timer i{display:block;height:100%;background:var(--acc);width:100%;transition:width .25s linear}
.stars{font-size:2rem;letter-spacing:4px;color:#e0a526}
.best{font-size:.9rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:.8rem;color:var(--muted)}
.hidden{display:none!important}
@media (max-width:560px){.wrap{padding:12px}.ans{grid-template-columns:1fr}.tbl{grid-template-columns:18px repeat(8,minmax(0,1fr));gap:3px;min-width:0}.gh .gn{display:none}.gh b{font-size:.8rem}.cell{min-height:44px;border-radius:7px;padding:2px 1px}.cell .s{font-size:.92rem}.cell .n{font-size:.5rem}.cell .z{font-size:.5rem;top:1px;left:3px}.vslot{font-size:.62rem;min-height:34px}.tile{min-width:44px;padding:5px 7px}.stats{gap:6px}.stat{padding:3px 7px;font-size:.9rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header style="margin-bottom:10px">
    <h1>Taula en joc</h1>
    <p class="sub">Aprèn on és cada element dels grups 1, 2 i 13–18, com s'escriu el seu símbol i quina valència té.</p>
  </header>

  <!-- configuració -->
  <section id="setup">
    <div class="card">
      <div class="lab">Curs</div>
      <div class="row" id="optNivell">
        <button class="opt" data-v="2n">2n d'ESO</button><button class="opt" data-v="3r">3r d'ESO</button><button class="opt" data-v="4t">4t d'ESO</button>
      </div>
      <p class="small" id="nivellInfo"></p>
      <div class="lab">Què vols jugar?</div>
      <div class="row" id="optMode">
        <button class="opt" data-v="col">Col·loca les fitxes</button>
        <button class="opt" data-v="esc">Escriu-ho tu</button>
        <button class="opt" data-v="val">Valències</button>
        <button class="opt" data-v="rap">Repte ràpid (60 s)</button>
      </div>
      <p class="small" id="modeInfo"></p>
      <div id="blkWhat">
        <div class="lab">Què has d'escriure o col·locar?</div>
        <div class="row" id="optWhat"><button class="opt" data-v="sym">Símbols</button><button class="opt" data-v="nom">Noms</button><button class="opt" data-v="tots">Símbol i nom</button></div>
      </div>
      <div class="lab">Fins a quin període?</div>
      <div class="row" id="optPer"><button class="opt" data-v="3">Període 3</button><button class="opt" data-v="4">Període 4</button><button class="opt" data-v="5">Període 5</button><button class="opt" data-v="6">Període 6</button></div>
      <div id="blkStart">
        <div class="lab">Com comences?</div>
        <div class="row" id="optStart"><button class="opt" data-v="blanc">Taula en blanc</button><button class="opt" data-v="cols">Amb algunes columnes escrites</button></div>
        <div id="blkCols" class="hidden" style="margin-top:8px">
          <p class="small" style="margin:0 0 6px">Tria les columnes que ja surten escrites:</p>
          <div class="cols" id="optCols"></div>
        </div>
      </div>
      <div class="row" style="margin-top:16px"><button class="btn" id="goBtn">Comença</button><span class="best" id="bestTxt"></span></div>
    </div>
  </section>

  <!-- joc -->
  <section id="game" class="hidden">
    <div class="bar">
      <div class="stats">
        <span class="stat">Encerts <b id="sOk">0</b><span id="sTot"></span></span>
        <span class="stat">Errors <b id="sBad">0</b></span>
        <span class="stat">Temps <b id="sTime">0:00</b></span>
        <span class="stat">Punts <b id="sPts">0</b></span>
      </div>
      <div class="row"><button class="btn ghost" id="hintBtn">Pista</button><button class="btn ghost" id="quitBtn">Surt</button></div>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div id="boardBox" class="card">
      <div class="tblwrap"><div class="tbl" id="tbl"></div></div>
      <div class="tray" id="tray"></div>
      <p class="small" id="help"></p>
    </div>
    <div id="quizBox" class="card hidden">
      <div class="timer"><i id="tBar"></i></div>
      <div class="q" id="qTxt"></div>
      <div class="ans" id="qAns"></div>
    </div>
  </section>

  <!-- resultat -->
  <section id="end" class="hidden">
    <div class="card" style="text-align:center">
      <h2 id="endTitle">Molt bé!</h2>
      <div class="stars" id="endStars"></div>
      <p id="endTxt"></p>
      <p class="best" id="endBest"></p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="againBtn">Torna-hi</button><button class="btn ghost" id="cfgBtn">Canvia la configuració</button></div>
    </div>
    <div class="card" id="endTable"></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  // ---------- dades ----------
  const GROUPS = [1, 2, 13, 14, 15, 16, 17, 18];
  const GNAME = { 1: "Alcalins", 2: "Alcalinoterris", 13: "Terris", 14: "Carbonoides", 15: "Nitrogenoides", 16: "Amfígens", 17: "Halògens", 18: "Gasos nobles" };
  // [símbol, nom, Z, període, grup]
  const E = [
    ["H", "hidrogen", 1, 1, 1], ["He", "heli", 2, 1, 18],
    ["Li", "liti", 3, 2, 1], ["Be", "beril·li", 4, 2, 2], ["B", "bor", 5, 2, 13], ["C", "carboni", 6, 2, 14], ["N", "nitrogen", 7, 2, 15], ["O", "oxigen", 8, 2, 16], ["F", "fluor", 9, 2, 17], ["Ne", "neó", 10, 2, 18],
    ["Na", "sodi", 11, 3, 1], ["Mg", "magnesi", 12, 3, 2], ["Al", "alumini", 13, 3, 13], ["Si", "silici", 14, 3, 14], ["P", "fòsfor", 15, 3, 15], ["S", "sofre", 16, 3, 16], ["Cl", "clor", 17, 3, 17], ["Ar", "argó", 18, 3, 18],
    ["K", "potassi", 19, 4, 1], ["Ca", "calci", 20, 4, 2], ["Ga", "gal·li", 31, 4, 13], ["Ge", "germani", 32, 4, 14], ["As", "arsènic", 33, 4, 15], ["Se", "seleni", 34, 4, 16], ["Br", "brom", 35, 4, 17], ["Kr", "criptó", 36, 4, 18],
    ["Rb", "rubidi", 37, 5, 1], ["Sr", "estronci", 38, 5, 2], ["In", "indi", 49, 5, 13], ["Sn", "estany", 50, 5, 14], ["Sb", "antimoni", 51, 5, 15], ["Te", "tel·luri", 52, 5, 16], ["I", "iode", 53, 5, 17], ["Xe", "xenó", 54, 5, 18],
    ["Cs", "cesi", 55, 6, 1], ["Ba", "bari", 56, 6, 2], ["Tl", "tal·li", 81, 6, 13], ["Pb", "plom", 82, 6, 14], ["Bi", "bismut", 83, 6, 15], ["Po", "poloni", 84, 6, 16], ["At", "àstat", 85, 6, 17], ["Rn", "radó", 86, 6, 18],
  ].map(([s, n, z, p, g]) => ({ s, n, z, p, g }));
  // valències: «ió» = càrrega de l'ió més habitual (2n i 3r); «totes» = valències que es fan servir a la formulació (4t)
  const VAL_ION = { 1: "+1", 2: "+2", 13: "+3", 14: "±4", 15: "−3", 16: "−2", 17: "−1", 18: "0" };
  const VAL_ALL = { 1: "+1", 2: "+2", 13: "+3", 14: "+2, ±4", 15: "−3, +3, +5", 16: "−2, +2, +4, +6", 17: "−1, +1, +3, +5, +7", 18: "0" };
  const VAL_NOTE = "Excepcions: l'hidrogen té ±1, l'oxigen només −2 (i −1 als peròxids) i el fluor només −1. El carboni té ±4 i +2.";
  const NIVELL = {
    "2n": { per: 4, what: "sym", val: "ion", info: "Períodes 1–4 i símbols. A 2n no cal saber les valències, però les pots practicar." },
    "3r": { per: 6, what: "sym", val: "ion", info: "Períodes 1–6. València = càrrega de l'ió que tendeix a formar cada grup (Na⁺, Mg²⁺, O²⁻…)." },
    "4t": { per: 6, what: "tots", val: "all", info: "Períodes 1–6, símbol i nom, i totes les valències que fem servir a la formulació." },
  };
  const MODEINFO = {
    col: "Toca una fitxa i després la casella on va. Si l'encertes, es queda fixa.",
    esc: "Toca una casella buida i escriu-hi el símbol o el nom. Prem Retorn per comprovar-ho.",
    val: "Els símbols ja hi són. Toca una valència i després el grup que la té.",
    rap: "Respon tantes preguntes com puguis en 60 segons: símbols, noms, posicions i valències.",
  };

  // ---------- estat ----------
  const $ = (s) => document.querySelector(s);
  const qn = (/nivell=(2n|3r|4t)/.exec(location.search) || [])[1];
  const cfg = { nivell: qn || "3r", mode: "col", what: "sym", per: 6, start: "blanc", cols: new Set() };
  Object.assign(cfg, { per: NIVELL[cfg.nivell].per, what: NIVELL[cfg.nivell].what });
  let st = null, timerId = null;
  const store = { get(k) { try { return JSON.parse(localStorage.getItem("taulajoc:" + k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem("taulajoc:" + k, JSON.stringify(v)); } catch {} } };
  const norm = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/l[·.•]l/g, "ll").replace(/[^a-z]/g, "");
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const valOf = (g) => (NIVELL[cfg.nivell].val === "all" ? VAL_ALL : VAL_ION)[g];
  const key = () => [cfg.nivell, cfg.mode, cfg.mode === "val" || cfg.mode === "rap" ? "" : cfg.what, cfg.per, cfg.start === "cols" ? [...cfg.cols].sort((a, b) => a - b).join("-") : "blanc"].join("|");

  // ---------- configuració ----------
  function pick(groupSel, val, attr = "v") { document.querySelectorAll(groupSel + " .opt").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[attr] === String(val)))); }
  function renderSetup() {
    pick("#optNivell", cfg.nivell); pick("#optMode", cfg.mode); pick("#optWhat", cfg.what); pick("#optPer", cfg.per); pick("#optStart", cfg.start);
    $("#nivellInfo").textContent = NIVELL[cfg.nivell].info; $("#modeInfo").textContent = MODEINFO[cfg.mode];
    $("#blkWhat").classList.toggle("hidden", cfg.mode === "val" || cfg.mode === "rap");
    $("#blkStart").classList.toggle("hidden", cfg.mode === "val" || cfg.mode === "rap");
    $("#blkCols").classList.toggle("hidden", cfg.start !== "cols");
    $("#optCols").innerHTML = GROUPS.map((g) => `<button class="opt" data-g="${g}" aria-pressed="${cfg.cols.has(g)}" title="${GNAME[g]}">${g}</button>`).join("");
    const b = store.get(key()); $("#bestTxt").textContent = b ? `Millor resultat amb aquesta configuració: ${b.pts} punts` : "";
  }
  $("#optNivell").onclick = (e) => { const b = e.target.closest(".opt"); if (!b) return; cfg.nivell = b.dataset.v; cfg.per = NIVELL[cfg.nivell].per; cfg.what = NIVELL[cfg.nivell].what; renderSetup(); };
  $("#optMode").onclick = (e) => { const b = e.target.closest(".opt"); if (!b) return; cfg.mode = b.dataset.v; renderSetup(); };
  $("#optWhat").onclick = (e) => { const b = e.target.closest(".opt"); if (!b) return; cfg.what = b.dataset.v; renderSetup(); };
  $("#optPer").onclick = (e) => { const b = e.target.closest(".opt"); if (!b) return; cfg.per = +b.dataset.v; renderSetup(); };
  $("#optStart").onclick = (e) => { const b = e.target.closest(".opt"); if (!b) return; cfg.start = b.dataset.v; if (cfg.start === "cols" && !cfg.cols.size) [1, 18].forEach((g) => cfg.cols.add(g)); renderSetup(); };
  $("#optCols").onclick = (e) => { const b = e.target.closest(".opt"); if (!b) return; const g = +b.dataset.g; cfg.cols.has(g) ? cfg.cols.delete(g) : cfg.cols.add(g); if (cfg.cols.size === GROUPS.length) cfg.cols.delete(g); renderSetup(); };

  // ---------- joc ----------
  const els = () => E.filter((x) => x.p <= cfg.per);
  const isPre = (x) => cfg.start === "cols" && cfg.cols.has(x.g);
  const label = (x, what = cfg.what) => what === "sym" ? `<span class="s">${x.s}</span>` : what === "nom" ? `<span class="s" style="font-size:.95rem">${esc(x.n)}</span>` : `<span class="s">${x.s}</span><span class="n">${esc(x.n)}</span>`;
  function start() {
    st = { ok: 0, bad: 0, pts: 0, t0: Date.now(), sel: null, hints: 0, misses: {} };
    $("#setup").classList.add("hidden"); $("#end").classList.add("hidden"); $("#game").classList.remove("hidden");
    $("#msg").textContent = ""; $("#msg").className = "msg";
    clearInterval(timerId); timerId = setInterval(tick, 250);
    const quiz = cfg.mode === "rap";
    $("#boardBox").classList.toggle("hidden", quiz); $("#quizBox").classList.toggle("hidden", !quiz); $("#hintBtn").classList.toggle("hidden", quiz);
    if (quiz) startQuiz(); else buildBoard();
    stats();
  }
  function tick() {
    const s = Math.floor((Date.now() - st.t0) / 1000);
    if (cfg.mode === "rap") { const left = Math.max(0, 60 - (Date.now() - st.t0) / 1000); $("#tBar").style.width = (left / 60 * 100) + "%"; $("#sTime").textContent = fmt(Math.ceil(left)); if (left <= 0) finish(); }
    else $("#sTime").textContent = fmt(s);
  }
  function stats() { $("#sOk").textContent = st.ok; $("#sBad").textContent = st.bad; $("#sPts").textContent = Math.max(0, st.pts); $("#sTot").textContent = st.total ? ` / ${st.total}` : ""; }
  function say(t, kind) { const m = $("#msg"); m.textContent = t; m.className = "msg " + (kind || ""); }

  function buildBoard() {
    const T = $("#tbl"); const val = cfg.mode === "val";
    let h = '<div></div>' + GROUPS.map((g) => `<div class="gh" title="${GNAME[g]}"><b>${g}</b><span class="gn">${GNAME[g]}</span></div>`).join("");
    if (val) h += '<div class="ph small">val.</div>' + GROUPS.map((g) => `<button class="vslot" data-vg="${g}" aria-label="València del grup ${g}"></button>`).join("");
    for (let p = 1; p <= cfg.per; p++) {
      h += `<div class="ph">${p}</div>`;
      GROUPS.forEach((g) => {
        const x = E.find((e) => e.p === p && e.g === g);
        if (!x) { h += '<div class="cell void" aria-hidden="true"></div>'; return; }
        const bg = `background:var(--g${g})`;
        if (val || isPre(x)) h += `<div class="cell pre" style="${bg}"><span class="z">${x.z}</span>${label(x, val ? "sym" : cfg.what)}</div>`;
        else h += `<button class="cell empty" data-z="${x.z}" aria-label="Grup ${g}, període ${p}"><span class="z">${x.z}</span></button>`;
      });
    }
    T.innerHTML = h;
    const todo = val ? GROUPS.slice() : els().filter((x) => !isPre(x));
    st.total = todo.length; st.left = new Set(todo.map((x) => val ? x : x.z));
    const tray = $("#tray");
    if (cfg.mode === "col") { tray.innerHTML = shuffle(todo).map((x) => `<button class="tile" data-z="${x.z}">${label(x)}</button>`).join(""); $("#help").textContent = "Toca una fitxa i després la casella. També pots tocar primer la casella i després la fitxa."; }
    else if (val) { tray.innerHTML = shuffle(GROUPS).map((g) => `<button class="tile" data-val="${g}"><span class="s" style="font-size:1rem">${valOf(g)}</span></button>`).join(""); $("#help").textContent = NIVELL[cfg.nivell].val === "all" ? VAL_NOTE : "La valència és la càrrega de l'ió que forma cada grup. Els elements del grup 14 poden guanyar o perdre 4 electrons (±4)."; }
    else { tray.innerHTML = ""; $("#help").textContent = cfg.what === "sym" ? "Escriu el símbol: la primera lletra es posa en majúscula sola." : cfg.what === "nom" ? "Escriu el nom en català. No cal posar accents." : "Escriu el símbol o el nom: si encertes, es mostren tots dos."; }
  }
  function select(el) { document.querySelectorAll(".tile[aria-pressed=true],.cell.target,.vslot.target").forEach((b) => { b.setAttribute("aria-pressed", "false"); b.classList.remove("target"); }); st.sel = el; if (el) { el.classList.contains("tile") ? el.setAttribute("aria-pressed", "true") : el.classList.add("target"); } }
  function good(cell, x) {
    cell.outerHTML = `<div class="cell done" style="background:var(--g${x.g})"><span class="z">${x.z}</span>${label(x, cfg.what === "nom" ? "tots" : cfg.what)}</div>`;
    st.ok++; st.pts += 10; st.left.delete(x.z); stats(); say(`Molt bé! ${x.s} · ${x.n} · grup ${x.g}, període ${x.p}.`, "ok");
    if (!st.left.size) setTimeout(finish, 450);
  }
  function badMark(el, txt) { st.bad++; st.pts -= 3; stats(); el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad"); setTimeout(() => el.classList.remove("bad"), 600); say(txt, "bad"); }
  function tryPlace(tile, cell) {
    const x = E.find((e) => e.z === +cell.dataset.z), y = E.find((e) => e.z === +tile.dataset.z);
    if (x.z === y.z) { tile.remove(); good(cell, x); select(null); }
    else { st.misses[y.z] = (st.misses[y.z] || 0) + 1; badMark(cell, `No: el ${y.n} (${y.s}) no va aquí. Fixa't en el grup i el període.`); select(null); }
  }
  function tryVal(tile, slot) {
    const g = +slot.dataset.vg, gv = +tile.dataset.val;
    if (valOf(g) === valOf(gv)) { slot.textContent = valOf(g); slot.classList.add("done"); slot.disabled = true; tile.remove(); st.ok++; st.pts += 10; st.left.delete(g); stats(); say(`Correcte: el grup ${g} (${GNAME[g].toLowerCase()}) té valència ${valOf(g)}.`, "ok"); if (!st.left.size) setTimeout(finish, 450); }
    else badMark(slot, `No: ${valOf(gv)} no és la valència del grup ${g}. Pensa quants electrons té a l'última capa.`);
    select(null);
  }
  $("#tbl").addEventListener("click", (e) => {
    const cell = e.target.closest(".cell.empty"), slot = e.target.closest(".vslot:not(.done)");
    if (slot) { if (st.sel && st.sel.classList.contains("tile")) tryVal(st.sel, slot); else select(slot); return; }
    if (!cell) return;
    if (cfg.mode === "esc") { if (!cell.querySelector("input")) openInput(cell); return; }
    if (st.sel && st.sel.classList.contains("tile")) tryPlace(st.sel, cell); else select(cell);
  });
  $("#tray").addEventListener("click", (e) => {
    const t = e.target.closest(".tile"); if (!t) return;
    if (st.sel && st.sel.classList.contains("cell")) { tryPlace(t, st.sel); return; }
    if (st.sel && st.sel.classList.contains("vslot")) { tryVal(t, st.sel); return; }
    select(st.sel === t ? null : t);
  });
  function openInput(cell) {
    const x = E.find((e) => e.z === +cell.dataset.z);
    cell.insertAdjacentHTML("beforeend", `<input aria-label="Escriu ${cfg.what === "nom" ? "el nom" : "el símbol"}" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="${cfg.what === "sym" ? 2 : 14}">`);
    const inp = cell.querySelector("input"); inp.focus();
    inp.addEventListener("input", () => { if (cfg.what === "sym") { const v = inp.value.replace(/[^A-Za-z]/g, ""); inp.value = v ? v[0].toUpperCase() + v.slice(1).toLowerCase() : ""; } });
    const check = () => {
      const v = inp.value.trim(); if (!v) { inp.remove(); return; }
      const okSym = v === x.s, okNom = norm(v) === norm(x.n);
      const ok = cfg.what === "sym" ? okSym : cfg.what === "nom" ? okNom : (okSym || okNom);
      if (ok) good(cell, x);
      else { st.misses[x.z] = (st.misses[x.z] || 0) + 1; const other = E.find((e) => e.s === v || norm(e.n) === norm(v)); badMark(cell, other ? `No: ${other.s} (${other.n}) és al grup ${other.g}, període ${other.p}.` : "No és correcte. Torna-ho a provar o demana una pista."); inp.value = ""; inp.focus(); }
    };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check(); } if (e.key === "Escape") inp.remove(); });
    inp.addEventListener("blur", () => setTimeout(() => { if (document.body.contains(inp) && inp.value.trim()) check(); else if (document.body.contains(inp)) inp.remove(); }, 120));
  }
  $("#hintBtn").onclick = () => {
    if (cfg.mode === "val") { const g = [...st.left][0]; if (g == null) return; st.pts -= 2; st.hints++; stats(); say(`Pista: el grup ${g} té ${g <= 2 ? g : g - 10} electrons a l'última capa.`, ""); return; }
    let z = st.sel && st.sel.dataset && st.sel.dataset.z ? +st.sel.dataset.z : [...st.left][0]; if (z == null) return;
    const x = E.find((e) => e.z === z); st.pts -= 2; st.hints++; stats();
    say(st.sel && st.sel.classList.contains("tile") ? `Pista: el ${x.n} és al grup ${x.g} (${GNAME[x.g].toLowerCase()}), període ${x.p}.` : `Pista: a la casella del grup ${x.g}, període ${x.p}, hi va un element que comença per «${(cfg.what === "nom" ? x.n : x.s)[0].toUpperCase()}».`, "");
  };
  $("#quitBtn").onclick = () => { clearInterval(timerId); $("#game").classList.add("hidden"); $("#setup").classList.remove("hidden"); renderSetup(); };

  // ---------- repte ràpid ----------
  function startQuiz() { st.total = 0; nextQ(); }
  function nextQ() {
    const pool = els(); const x = pool[Math.floor(Math.random() * pool.length)];
    const types = ["sym", "nom", "pos", "elem", "val"]; const t = types[Math.floor(Math.random() * types.length)];
    let q, right, opts;
    const others = (f, n = 3) => shuffle([...new Set(pool.filter((e) => e !== x).map(f))].filter((v) => v !== f(x))).slice(0, n);
    if (t === "sym") { q = `Quin és el símbol del <b>${esc(x.n)}</b>?`; right = x.s; opts = others((e) => e.s); }
    else if (t === "nom") { q = `Quin element té el símbol <b>${x.s}</b>?`; right = x.n; opts = others((e) => e.n); }
    else if (t === "pos") { q = `On és el <b>${esc(x.n)} (${x.s})</b>?`; right = `Grup ${x.g} · període ${x.p}`; opts = others((e) => `Grup ${e.g} · període ${e.p}`); }
    else if (t === "elem") { q = `Quin element és al <b>grup ${x.g}</b>, <b>període ${x.p}</b>?`; right = `${x.s} · ${x.n}`; opts = others((e) => `${e.s} · ${e.n}`); }
    else { q = `Quina valència té el <b>${esc(x.n)} (${x.s})</b>?`; right = x.s === "H" ? "±1" : x.s === "O" && NIVELL[cfg.nivell].val === "all" ? "−2" : x.s === "F" && NIVELL[cfg.nivell].val === "all" ? "−1" : valOf(x.g); opts = shuffle([...new Set(GROUPS.map(valOf).concat(["±1"]))].filter((v) => v !== right)).slice(0, 3); }
    const all = shuffle([right, ...opts]);
    $("#qTxt").innerHTML = q;
    $("#qAns").innerHTML = all.map((o) => `<button data-a="${esc(o)}">${esc(o)}</button>`).join("");
    $("#qAns").onclick = (e) => {
      const b = e.target.closest("button"); if (!b || $("#qAns").dataset.lock === "1") return;
      $("#qAns").dataset.lock = "1"; st.total++;
      if (b.dataset.a === right) { b.classList.add("ok"); st.ok++; st.pts += 10; say("Correcte!", "ok"); }
      else { b.classList.add("bad"); [...$("#qAns").children].find((c) => c.dataset.a === right).classList.add("ok"); st.bad++; st.pts -= 3; st.misses[x.z] = (st.misses[x.z] || 0) + 1; say(`No: és ${right}.`, "bad"); }
      stats(); setTimeout(() => { $("#qAns").dataset.lock = "0"; if (!$("#game").classList.contains("hidden")) nextQ(); }, b.dataset.a === right ? 450 : 1100);
    };
  }

  // ---------- final ----------
  function finish() {
    if ($("#game").classList.contains("hidden")) return;
    clearInterval(timerId);
    const secs = Math.floor((Date.now() - st.t0) / 1000);
    if (cfg.mode !== "rap") st.pts += Math.max(0, st.total * 6 - secs) > 0 ? Math.round(Math.max(0, st.total * 6 - secs) / 2) : 0;
    const pts = Math.max(0, st.pts);
    const ratio = cfg.mode === "rap" ? (st.total ? st.ok / st.total : 0) : st.total / (st.total + st.bad + st.hints);
    const stars = ratio >= 0.95 ? 3 : ratio >= 0.75 ? 2 : ratio >= 0.5 ? 1 : 0;
    $("#game").classList.add("hidden"); $("#end").classList.remove("hidden");
    $("#endTitle").textContent = stars === 3 ? "Excel·lent!" : stars === 2 ? "Molt bé!" : stars === 1 ? "Ben fet, continua practicant" : "Cal practicar-ho més";
    $("#endStars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
    $("#endTxt").textContent = cfg.mode === "rap" ? `Has respost ${st.total} preguntes i n'has encertat ${st.ok}. Punts: ${pts}.` : `Has completat ${st.total} ${cfg.mode === "val" ? "grups" : "elements"} en ${fmt(secs)}, amb ${st.bad} errors i ${st.hints} pistes. Punts: ${pts}.`;
    const k = key(), best = store.get(k);
    if (!best || pts > best.pts) { store.set(k, { pts, at: Date.now() }); $("#endBest").textContent = best ? `Nou rècord! L'anterior era ${best.pts} punts.` : "Primer resultat desat en aquest navegador."; }
    else $("#endBest").textContent = `El teu millor resultat amb aquesta configuració: ${best.pts} punts.`;
    const miss = Object.entries(st.misses).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([z]) => E.find((e) => e.z === +z));
    $("#endTable").innerHTML = miss.length ? `<h2>Repassa aquests elements</h2><div class="row">${miss.map((x) => `<span class="stat" style="background:var(--g${x.g})"><b>${x.s}</b> ${esc(x.n)} · grup ${x.g}, període ${x.p} · valència ${valOf(x.g)}</span>`).join("")}</div>` : "<h2>Cap error. Perfecte!</h2>";
  }
  $("#againBtn").onclick = start;
  $("#cfgBtn").onclick = () => { $("#end").classList.add("hidden"); $("#setup").classList.remove("hidden"); renderSetup(); };
  $("#goBtn").onclick = start;
  renderSetup();
})();
</script>
</body>
</html>
