# Font única del currículum de 3r. No inventis textos: han de ser literals del decret.
font: Decret 175/2022, annex 3 (Física i química, 1r a 3r d'ESO). Textos copiats de la programació (tools/3r/dades/full.md); noms curts de CRIT_NAMES (digital/profe.html).
versio: 1
competencies:
- id: CE1
  text: Interpretar fenòmens de la naturalesa, predient i argumentant-ne el comportament a partir de models, lleis i teories propis de la física i química per apropiar-se de conceptes i processos propis de la ciència.
  criteris:
  - id: '1.1'
    nom_curt: Analitzar conceptes i processos
    text: Analitzar conceptes, fenòmens i processos relacionats amb els sabers de la física i la química interpretant informació en diferents formats (models, gràfics, taules, diagrames, fórmules, esquemes, símbols, pàgines web…), mantenint una actitud crítica i obtenint conclusions fonamentades en raons científiques.
  - id: '1.2'
    nom_curt: Explicar fenòmens amb teories
    text: Interpretar i predir el comportament de fenòmens quotidians rellevants, relacionant-lo amb models, lleis i teories adequades de la física i la química.
  - id: '1.3'
    nom_curt: Aplicar-ho a problemes reals
    text: Identificar els conceptes relacionats amb situacions problemàtiques reals de caràcter científic i proporcionar possibles solucions.
- id: CE2
  text: Dissenyar, desenvolupar i comunicar el plantejament i les conclusions de recerques incloent la formulació de preguntes i d'hipòtesis i la seva contrastació experimental, dins de l'àmbit escolar, seguint els passos de les metodologies pròpies de la ciència, com l'experimentació i la cerca d'evidències, i del pensament computacional cooperant, quan calgui, per indagar en aspectes relacionats amb la física i la química.
  criteris:
  - id: '2.1'
    nom_curt: Formular hipòtesis
    text: Plantejar preguntes sobre fenòmens quotidians i formular hipòtesis que puguin ser respostes o contrastades en el context escolar a través de l'experimentació, la presa de dades i l'anàlisi de fenòmens físics i químics.
  - id: '2.2'
    nom_curt: Dissenyar procediments
    text: Dissenyar, fent servir metodologies pròpies de la ciència, procediments de recerca que impliquin l'ús de la deducció, el treball experimental i el raonament logicomatemàtic.
  - id: '2.3'
    nom_curt: Experimentar i interpretar
    text: Portar a terme dissenys experimentals fent servir els instruments, les eines o les tècniques adequades amb correcció i interpretar-ne els resultats utilitzant, quan sigui necessari, eines matemàtiques i tecnològiques.
  - id: '2.4'
    nom_curt: Col·laborar
    text: Cooperar en un projecte científic assumint responsablement una funció concreta, utilitzant espais virtuals quan sigui necessari, respectant la diversitat i afavorint la inclusió.
  - id: '2.5'
    nom_curt: Comunicar resultats
    text: Presentar els resultats i les conclusions obtingudes mitjançant l'experimentació i l'observació de camp utilitzant el format adequat (taules, gràfics, informes, etc.) i, quan sigui necessari, eines digitals.
  - id: '2.6'
    nom_curt: Ciència i biaixos de gènere
    text: Valorar la contribució de la ciència a la societat i la tasca de les persones que s'hi han dedicat, reflexionant sobre els biaixos de gènere en les ciències i la tecnologia, i entenent la recerca com una tasca
    pendent: 'Text tallat a la programació (full.md): cal completar-lo amb el literal del Decret 175/2022.'
- id: CE3
  text: Generar, interpretar i validar dades i informació en diferents formats i fonts, fent servir de manera adient el llenguatge científic específic de la física i la química, i usar de manera responsable i segura el material de laboratori, per valorar el llenguatge científic com a eina universal de comunicació i intercanvi de coneixement.
  criteris:
  - id: '3.1'
    nom_curt: Dades de fonts diverses
    text: Generar i usar dades de fonts i formats diversos (textos, taules, gràfiques, diagrames, etc.) per interpretar, validar i comunicar informació relativa a un procés físic o químic concret, mitjançant la selecció crítica d'allò més rellevant per a la resolució del problema.
  - id: '3.2'
    nom_curt: Unitats i eines matemàtiques
    text: Utilitzar adequadament les regles bàsiques de la física i la química, incloent-hi l'ús d'unitats de mesura, les eines matemàtiques i la formulació i nomenclatura IUPAC, com a elements bàsics del llenguatge científic i d'una comunicació efectiva per a l'intercanvi de coneixement entre la comunitat científica.
  - id: '3.3'
    nom_curt: Seguretat al laboratori
    text: Utilitzar de manera pràctica i responsable les normes d'ús dels espais específics de ciència, com el laboratori de física i química, com a mitjà per preservar la salut pròpia i col·lectiva, la conservació sostenible del medi ambient i el respecte per les instal·lacions.
- id: CE4
  text: Utilitzar de forma crítica i eficient plataformes tecnològiques i recursos variats, tant per al treball individual com en equip, per a la cerca d'informació, la creació de materials i la comunicació fonamentada en coneixements de la física i la química, entorn de fenòmens i qüestions ecosocialment rellevants.
  criteris:
  - id: '4.1'
    nom_curt: Comunicar amb entorns digitals
    text: Utilitzar de forma crítica, creativa i eficient entorns digitals i diferents recursos en formats diversos per defensar el punt de vista propi sobre fenòmens i qüestions ecosocialment rellevants.
  - id: '4.2'
    nom_curt: Argumentar en equip
    text: Justificar el punt de vista propi sobre qüestions ecosocialment rellevants, utilitzant tant el treball individual com en equip, respectant les aportacions de tothom i promovent la inclusió de gènere i social.
  - id: '4.3'
    nom_curt: Informació fiable i fonts
    text: Cercar i analitzar informació amb mitjans convencionals i digitals i crear continguts relacionats amb la física i la química, seleccionant amb criteri les fonts més fiables i organitzant informació mitjançant l'ús i la citació correctes de diferents fonts.
- id: CE5
  text: Analitzar els efectes de determinades accions sobre el medi ambient i la salut, basant-se en els fonaments de les ciències físiques i químiques, per fer propostes d'acció per decidir de manera informada en problemàtiques actuals i adoptar hàbits que minimitzin els impactes mediambientals, que siguin compatibles amb un desenvolupament sostenible i que permetin mantenir i millorar la salut individual i col·lectiva.
  criteris:
  - id: '5.1'
    nom_curt: Preservar l'aigua, l'aire i el sòl
    text: Justificar amb fonaments científics la importància de la preservació dels sistemes fisicoquímics de l'entorn (qualitat de l'aire, de l'aigua, del sòl).
  - id: '5.2'
    nom_curt: Hàbits sostenibles
    text: Justificar la necessitat de tenir hàbits sostenibles, analitzant d'una manera crítica les activitats pròpies i alienes i basant-se en els raonaments propis, els coneixements adquirits i la informació disponible.
  - id: '5.3'
    nom_curt: Ciència, salut i sostenibilitat
    text: Identificar algunes situacions en què els coneixements derivats de la física i la química poden contribuir a millorar la sostenibilitat ambiental i la salut individual i col·lectiva.
  - id: '5.4'
    nom_curt: Projectes que milloren la societat
    text: Emprendre, de manera guiada i amb la metodologia adequada, projectes científics relacionats amb la millora de la societat i que afavoreixin el creixement entre iguals com a base d'una comunitat científica escolar crítica i ètica.
- id: CE6
  text: Interpretar i valorar la ciència com una construcció col·lectiva en continu canvi i evolució, que requereix la interacció amb la resta de la societat per generar millores que repercuteixin en l'avenç tecnològic, econòmic, ambiental i social.
  criteris:
  - id: '6.1'
    nom_curt: Perspectiva històrica
    text: Interpretar la ciència com un procés en construcció, a través de l'anàlisi amb perspectiva històrica dels avenços científics dels homes i dones que hi van participar, i valorar les repercussions mútues de la ciència actual amb la tecnologia, la societat i el medi ambient.
  - id: '6.2'
    nom_curt: Solucions sostenibles i participació
    text: Raonar la capacitat de la ciència per proposar, mitjançant la implicació ciutadana, solucions sostenibles per a les necessitats tecnològiques, ambientals, econòmiques i socials, detectades en l'entorn, sense biaixos de gènere.
