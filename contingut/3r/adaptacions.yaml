          exemple: 'Exemple amb el liti, ⁷₃Li: Z = 3 → 3 protons; A = 7 → neutrons = 7 − 3 = 4; àtom neutre → 3 electrons.'
          passos:
          - 'Z és el número de baix: protons.'
          - A és el número de dalt.
          - Neutrons = A − Z.
          - Electrons = protons.
        '3':
          passos:
          - '⁶₃Li: protons = 3, neutrons = 6 − 3 = 3, electrons = 3.'
          - '⁷₃Li: protons = 3, neutrons = 4, electrons = 3.'
          - 'Compara: què canvia i què no?'
          frases:
