          - Simplifica les unitats i calcula.
        '2':
          exemple: 90 km/h · (1000 m / 1 km) · (1 h / 3600 s) = 25 m/s.
          pistes:
          - 'Drecera: de km/h a m/s divideix entre 3,6. De m/s a km/h multiplica per 3,6.'
        '3':
          pistes:
          - 1 g = 1000 mg i 1 L = 1000 mL.
          - 1 m³ = 1000 L.
        '4':
          passos:
          - 0,5 L/min · (1000 mL / 1 L) = 500 mL/min.
          - 500 mL/min · (1 min / 60 s) = … mL/s.
        '5':
          frases:
          - He trobat valors diferents perquè la densitat depèn de …
          - La font més fiable és … perquè …
    discalculia:
      preguntes:
        '2':
          passos:
          - 90 / 3,6 = …
