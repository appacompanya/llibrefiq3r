  d4f1:
    basics:
      abans_titol: Com es formulen
      abans: '<ul><li>Ions: Na⁺ (sodi), Mg²⁺ (magnesi), Al³⁺ (alumini), Ca²⁺ (calci), Cl⁻ (clorur), O²⁻ (òxid), S²⁻ (sulfur).</li><li>Compost iònic: les càrregues s''han de compensar. Mg²⁺ + Cl⁻ → MgCl₂.</li><li>Dos no metalls:
        prefixos mono-, di-, tri-, tetra-. CO₂ = diòxid de carboni.</li></ul>'
      preguntes:
        '1':
          pistes:
          - 'Un sol símbol (H₂, O₂, Mg, He): substància simple. Dos símbols o més: compost.'
        '2':
          pistes:
          - Si la càrrega és +, és un catió. Si és −, és un anió.
          - Els anions acaben en -ur (clorur, sulfur, fluorur) o són òxid.
        '3':
          exemple: 'Al³⁺ i O²⁻: 2 Al donen +6 i 3 O donen −6 → Al₂O₃ (òxid d''alumini).'
          passos:
          - Escriu les dues càrregues.
          - Busca quants de cada calen perquè la suma sigui zero.
          - 'Escriu primer el catió i després l''anió. El nom: anió + de + catió.'
        '4':
          pistes:
          - 'Els prefixos et diuen quants àtoms: diòxid = 2 O, triòxid = 3 O.'
        '5':
          pistes:
          - 'Si hi ha un metall, no posis prefixos: NaCl = clorur de sodi.'
          - 'Si són dos no metalls, posa prefixos: CO = monòxid de carboni.'
    discalculia:
      preguntes:
        '3':
          passos:
          - 'Càrrega del catió: …'
          - 'Càrrega de l''anió: …'
          - Quants de cada fan suma 0?
  d4lab2:
    basics:
      preguntes:
        '1':
          frases:
          - L'hidrogen és menys dens que l'aire, per això …
        '2':
          passos:
          - 'Reactius: Mg + HCl. Productes: MgCl₂ + H₂.'
          - 'Compta els Cl: n''hi ha 1 a l''esquerra i 2 a la dreta.'
          - 'Posa un 2 davant de l''HCl: Mg + 2 HCl → MgCl₂ + H₂.'
        '3':
          pistes:
          - 2 H₂ + O₂ → 2 H₂O. Compta 4 H i 2 O a cada costat.
        '4':
          pistes:
          - 'Si la temperatura puja, la reacció dona energia a l''entorn: és exotèrmica.'
        '5':
          pistes:
          - 'Busca: bombolles de gas, el magnesi desapareix, canvi de temperatura, so a la flama.'
    nouvingut:
      preguntes:
        '1':
          frases:
          - Boca avall perquè l'hidrogen …
          paraules:
          - dens
          - lleuger
          - aire
          - pujar
        '4':
          frases:
          - La temperatura … La reacció és …
          paraules:
          - pujar
          - baixar
          - exotèrmica
          - endotèrmica
        '5':
          frases:
          - Sabem que és un canvi químic perquè …
          paraules:
          - bombolles
          - gas
          - calor
          - substància nova
    tea:
      preguntes:
        '1':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '3':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '4':
