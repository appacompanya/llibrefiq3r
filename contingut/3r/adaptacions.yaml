  d3f3:
    basics:
      abans_titol: Recorda
      abans: '<ul><li>Els protons no canvien mai: protons = Z.</li><li>Catió (+): ha <b>perdut</b> electrons. Electrons = Z − càrrega.</li><li>Anió (−): ha <b>guanyat</b> electrons. Electrons = Z + càrrega.</li></ul>'
      preguntes:
        '1':
          exemple: 'Li⁺: Z = 3 → 3 protons. Càrrega +1 → ha perdut 1 electró → 3 − 1 = 2 electrons. Catió.'
          passos:
          - Busca la Z a la taula periòdica.
          - Protons = Z.
          - Si és +, resta la càrrega a Z. Si és −, suma-la.
        '2':
          pistes:
          - Fent servir el mòbil, els Li⁺ van de l'ànode al càtode a través de l'electròlit.
          - Els electrons van pel cable, fora de la bateria.
        '3':
          pistes:
          - 'L''àtom de liti perd un electró: Li → Li⁺ + e⁻.'
        '4':
          frases:
          - L'etapa … serveix per …
  d4repte:
