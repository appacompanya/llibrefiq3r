        '2':
          exemple: Si una fletxa fa 8 mm a la làmina i la barra d'escala diu 4 mm = 1 µm, el desplaçament real és 8 / 4 = 2 µm. Després, força = k · Δx.
          passos:
          - Mesura la fletxa en mm.
          - Divideix entre els mm que fa 1 µm a la barra d'escala.
          - Multiplica per la constant del gel per obtenir la força en nN.
          - 1 nN = 1 · 10⁻⁹ N.
        '3':
          passos:
          - Cada 1 nN = 5 mm de fletxa.
          - Comença la fletxa a la boleta i dibuixa-la en la direcció del desplaçament.
          - 'Prolonga les fletxes: on es tallen?'
        '4':
          pistes:
          - Posa les fletxes una darrere l'altra. Si tornes al punt de sortida, la resultant és zero.
        '5':
