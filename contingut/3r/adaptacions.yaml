          - Al tub on hi ha més gas hi ha hidrogen (càtode, −).
          - Relació = volum del tub A / volum del tub B.
        '4':
          pistes:
          - 'En volum s''espera 2 : 1 (dues molècules d''H₂ per una d''O₂).'
          - 'En massa: 4 g d''H₂ i 32 g d''O₂ → 1 : 8.'
        '5':
          frases:
          - La relació no és 2 perquè l'oxigen …
        '6':
          frases:
          - És endotèrmic perquè …
          - Es diu hidrogen verd perquè l'electricitat …
    discalculia:
      preguntes:
        '1':
          passos:
          - 400 / 1000 = 0,4 L
          - 50 · 0,4 = … g
        '3':
          passos:
          - volum A / volum B = …
  d4f3:
    basics:
      abans_titol: Proporcions útils
      abans: '<ul><li>C₃H₈: 44 g → 3 CO₂: 132 g.</li><li>2 H₂: 4 g → 2 H₂O: 36 g.</li><li>2 Mg: 48 g → 2 MgO: 80 g.</li><li>2 C₈H₁₈: 228 g → 16 CO₂: 704 g.</li></ul>'
      preguntes:
        '1':
          pistes:
          - Amb un metall, sense prefixos (CaO = òxid de calci). Dos no metalls, amb prefixos (SO₂ = diòxid de sofre).
        '2':
          pistes:
          - Ajusta primer el C, després l'H i al final l'O.
        '3':
          passos:
          - 'Compta àtoms: 3 C, 8 H, 10 O a cada costat.'
          - 'Masses: 44 + 160 = 132 + 72.'
          - 'CO₂: 11 kg · 132 / 44 = … kg.'
        '4':
          passos:
          - 'Aigua: 5,6 · 36 / 4 = … kg.'
          - 'Per quilòmetre: … / 650 = … kg.'
        '5':
          passos:
          - a) O₂ = 4,0 − 2,4 = … g.
          - b) L'oxigen de l'aire s'ha unit al magnesi.
          - c) 6,0 · 4,0 / 2,4 = … g.
        '6':
          passos:
          - 1 L = 0,74 kg = 740 g d'octà.
          - 'CO₂: 740 · 704 / 228 = … g.'
        '7':
          pistes:
          - 'Si desprèn calor o llum: exotèrmica. Si cal donar-li energia (electricitat, llum del sol): endotèrmica.'
        '8':
          frases:
          - La dissolució … és més concentrada perquè fa més … i …
        '9':
          frases:
          - Amb més concentració i més temperatura hi ha més xocs entre partícules, per això …
        '10':
          pistes:
          - 'Els factors són: temperatura, concentració i superfície de contacte.'
    discalculia:
      preguntes:
        '3':
          passos:
          - 11 · 3 = … kg de CO₂
        '4':
          passos:
          - 5,6 · 9 = … kg
          - … / 650 = … kg
        '5':
          passos:
          - 4,0 − 2,4 = …
          - 6,0 / 2,4 = 2,5 → 2,5 · 4,0 = …
        '6':
          passos:
          - 740 · 704 = …
          - … / 228 = … g
  d5repte:
    basics:
      preguntes:
        '1':
          frases:
          - El neutròfil … i el bacteri …
          - Crec que l'atraparà / no l'atraparà perquè …
        '2':
          frases:
          - Creiem que el neutròfil troba el bacteri perquè …
        '3':
          passos:
          - 'Velocitat: el neutròfil va a uns 17 µm/min.'
          - 'Gradient: segueix les molècules que deixa anar el bacteri.'
          - 'Forces: estira el terra cap enrere i avança cap endavant.'
    discalculia:
      preguntes:
        '3':
          pistes:
          - 'No cal calcular res: fes servir les dades que ja vas trobar a les fitxes.'
  d5f1:
    basics:
      abans_titol: Fórmules del MRU
      abans: '<ul><li><b>v = distància / temps</b></li><li><b>distància = v · t</b> · <b>t = distància / v</b></li><li>Equació de posició: <b>x = x₀ + v · t</b></li><li>km/h → m/s: divideix entre 3,6.</li></ul>'
      preguntes:
        '1':
          passos:
          - Mira quants metres avança cada segon.
          - v = metres / segons. Per tenir km/h, multiplica per 3,6.
          - És MRU si cada segon avança el mateix.
          - 'Marca els punts (t, x) i uneix-los: ha de sortir una recta.'
        '2':
          pistes:
          - 'Resta les posicions seguides: 3, 9, 15, 21… La distància de cada segon és igual?'
        '3':
          exemple: 18 km/h / 3,6 = 5 m/s.
          passos:
          - 2 min = 120 s → distància = 5 · 120 = … m.
          - 1,5 km = 1500 m → t = 1500 / 5 = … s.
        '4':
          passos:
          - 36 km/h / 3,6 = 10 m/s.
          - x = 50 + 10 · t.
          - t = 8 s → x = 50 + 10 · 8 = … m.
          - x = 250 → 250 = 50 + 10 · t → t = … s.
        '5':
          passos:
          - 'Passa a m/s: 72 / 3,6 = 20 i 54 / 3,6 = 15.'
          - '3 km = 3000 m. Temps de cadascun: 3000 / v.'
          - Resta els dos temps.
        '6':
          pistes:
          - Com més inclinada és la recta, més de pressa va.
          - 'v = canvi de x / canvi de t: agafa dos punts de cada recta.'
          - Una recta horitzontal vol dir que no es mou.
    discalculia:
      preguntes:
        '3':
          passos:
          - 18 / 3,6 = 5
          - 5 · 120 = …
          - 1500 / 5 = …
        '4':
          passos:
          - 36 / 3,6 = 10
          - 50 + 80 = …
          - (250 − 50) / 10 = …
        '5':
          passos:
          - 3000 / 20 = … s
          - 3000 / 15 = … s
          - … − … = … s
  d5f2:
    basics:
      abans_titol: Fórmules del MRUA
      abans: <ul><li><b>a = (v − v₀) / t</b></li><li><b>v = v₀ + a · t</b></li><li><b>distància = v₀ · t + ½ · a · t²</b></li><li>Si frena, la a és negativa.</li></ul>
      preguntes:
        '1':
          passos:
          - v₀ = 0, a = 2,5, t = 8.
          - v = 0 + 2,5 · 8 = … m/s. Per a km/h, · 3,6.
          - distància = ½ · 2,5 · 8² = … m.
        '2':
          pistes:
          - 'Si la velocitat puja: MRUA. Si es manté: MRU.'
          - 'Distància = àrea sota la gràfica: triangle (base · altura / 2) i rectangle (base · altura).'
        '3':
          passos:
          - a = (0 − 6) / 3 = … m/s². És negativa perquè frena.
          - distància = 6 · 3 + ½ · a · 3² = … m.
        '4':
          passos:
          - 50 km/h / 3,6 = 13,9 m/s. t = 13,9 / 5 = … s.
          - distància = v · t / 2 = … m.
          - Fes el mateix amb 30 km/h (8,3 m/s).
          - 'Reacció: suma v · 1 s a cada distància.'
        '5':
          pistes:
          - 'MRU: recta i velocitat constant. MRUA: recta i la velocitat canvia igual cada segon.'
          - Un revolt no és recte.
    discalculia:
      preguntes:
        '1':
          passos:
          - 2,5 · 8 = …
          - … · 3,6 = … km/h
          - 8 · 8 = 64 → 0,5 · 2,5 · 64 = …
        '3':
          passos:
          - −6 / 3 = …
          - 6 · 3 / 2 = … m
        '4':
          passos:
          - 13,9 / 5 = … s
          - 13,9 · … / 2 = … m
          - 8,3 / 5 = … s
          - 8,3 · … / 2 = … m
  d5f4:
    basics:
      abans_titol: Com es fa servir l'escala
      abans: <p>Augments = mida al dibuix (en µm) / mida real (µm). 1 mm = 1000 µm.</p><p>Mida real = mida al dibuix / augments.</p>
      preguntes:
        '1':
          passos:
          - Mesura el glòbul vermell en mm i passa-ho a µm (· 1000).
          - Augments = mida al dibuix (µm) / 7,5.
          - 'Per a cada cèl·lula: mida real = mida al dibuix / augments.'
        '2':
          pistes:
          - Divideix els µm que diu la barra entre els mm que fa amb el regle.
        '3':
          passos:
          - Mesura cada segment en mm.
          - Multiplica pels µm d'1 mm (pregunta 2).
          - Suma-ho tot per tenir el total.
        '4':
          pistes:
          - El desplaçament és la fletxa recta que va de la primera creu a l'última.
        '5':
          passos:
          - Rapidesa mitjana = camí total / 5 min.
          - Velocitat mitjana = desplaçament / 5 min.
          - Són diferents perquè el camí no és recte.
        '6':
          pistes:
          - 'Mira quin segment és més llarg: en el mateix temps, ha anat més lluny.'
        '7':
          passos:
          - temps = 120 µm / rapidesa (µm/min).
        '8':
          frases:
          - No és un MRU perquè la velocitat …
          - Té sentit fer la mitjana perquè …
    discalculia:
      preguntes:
        '1':
          passos:
          - mm · 1000 = … µm
          - … / 7,5 = … augments
        '3':
          passos:
          - mm · (µm d'1 mm) = … µm
          - 'Suma: … µm'
        '5':
          passos:
          - camí / 5 = … µm/min
          - desplaçament / 5 = … µm/min
        '7':
          passos:
          - 120 / … = … min
  d5prob:
    basics:
      abans_titol: Fórmules
      abans: '<ul><li>MRU: <b>x = x₀ + v · t</b></li><li>MRUA: <b>v = v₀ + a · t</b> i <b>x = x₀ + v₀ · t + ½ · a · t²</b></li><li>Trobada: iguala les dues x.</li></ul>'
      preguntes:
        '1':
          passos:
          - 3 min = 180 s → distància = 5 · 180 = … m.
          - 2 km = 2000 m → t = 2000 / 5 = … s.
        '2':
          passos:
          - 'Primer: x₁ = 5 · t.'
          - 'Segon (va cap enrere): x₂ = 300 − 5 · t.'
          - 'Iguala: 5t = 300 − 5t → t = … s.'
          - Posa la t a x₁ per saber on es troben.
        '3':
          passos:
          - 'Autobús: x = 10 · t. Bici: x = ½ · 0,5 · t² = 0,25 · t².'
          - 'Iguala: 10t = 0,25t² → t = 10 / 0,25 = … s.'
          - 'Distància: 10 · t = … m.'
        '4':
          passos:
          - t = 20 / 1 = … s.
          - distància = ½ · 1 · t² = … m.
        '5':
          passos:
          - a = (0 − 20) / 25 = … m/s².
          - distància = 20 · 25 / 2 = … m.
          - 'Tram a 20 m/s: 700 − 200 − … = … m → t = … / 20.'
        '6':
          passos:
          - 'Tram 1: a = 4 / 2. Tram 2: a = 0. Tram 3: a = −4 / 4.'
          - 'Distància = àrea: 2 · 4 / 2 + 6 · 4 + 4 · 4 / 2.'
        '7':
          passos:
          - t = 120 / 17 = … min. · 60 = … s.
          - 17 µm/min = 17 · 10⁻⁶ m / 60 s = … m/s.
        '8':
          passos:
          - 'Neutròfil: x = 17 · t. Bacteri: x = 60 + 2 · t.'
          - 'Iguala: 17t = 60 + 2t → 15t = 60 → t = … min.'
    discalculia:
      preguntes:
        '1':
          passos:
          - 5 · 180 = …
          - 2000 / 5 = …
        '2':
          passos:
          - 10 · t = 300 → t = …
          - 5 · … = … m
        '3':
          passos:
          - 10 / 0,25 = …
          - 10 · … = … m
        '4':
          passos:
          - 20 / 1 = 20 s
          - 0,5 · 400 = … m
        '5':
          passos:
          - −20 / 25 = …
          - 20 · 25 / 2 = …
          - 700 − 200 − 250 = …
          - … / 20 = … s
        '6':
          passos:
          - 4 + 24 + 8 = … m
        '7':
          passos:
          - 120 / 17 = …
          - … · 60 = … s
        '8':
          passos:
          - 17 − 2 = 15
          - 60 / 15 = …
  d5f6:
    basics:
      abans_titol: Les tres lleis de Newton
      abans: <ul><li><b>1a:</b> sense força, un cos continua com estava.</li><li><b>2a:</b> <b>F = m · a</b> (N = kg · m/s²).</li><li><b>3a:</b> si A empeny B, B empeny A amb la mateixa força i sentit contrari.</li></ul>
      preguntes:
        '1':
          pistes:
          - 'Continuar movent-se sol: 1a. Més massa, costa més: 2a. Empènyer enrere per anar endavant: 3a.'
        '2':
          passos:
          - F = m · a = 80 · (−3) = … N.
          - 'Amb 60 kg més: m = 140 kg → F = 140 · (−3) = … N.'
        '3':
          pistes:
          - Dues fletxes iguals i de sentit contrari. La que fa avançar la cèl·lula és la que fa la superfície sobre la cèl·lula.
        '4':
          passos:
          - a = (6 − 0) / 4 = … m/s².
          - F = 80 · a = … N.
          - F = 60 · a = … N.
        '5':
          frases:
          - La cèl·lula té molt poca massa i l'aigua la frena molt, per això …
        '6':
          pistes:
          - 'Actina: empeny la membrana. Adhesions: enganxen al terra. Microtúbuls: vies de transport.'
        '7':
          frases:
          - L'actina estira el substrat cap enrere a través de …
          - El substrat estira la cèl·lula cap …
        '8':
          frases:
          - El neutròfil tot sol pot …, per això és una unitat …
    discalculia:
      preguntes:
        '2':
          passos:
          - 80 · 3 = … → amb signe −
          - 140 · 3 = … → amb signe −
        '4':
          passos:
          - 6 / 4 = …
          - 80 · … = … N
          - 60 · … = … N
  d6repte:
    basics:
      abans_titol: Fórmula de l'energia
      abans: '<p><b>E (kWh) = P (W) · hores / 1000</b></p><p>Exemple: un llum de 36 W encès 6 h → 36 · 6 / 1000 = 0,216 kWh.</p>'
      preguntes:
        '1':
          pistes:
          - Pensa en els aparells que tenen més potència i en els que estan encesos més hores.
        '2':
          frases:
          - Creiem que a la nostra aula el que consumeix més energia és … perquè …
        '3':
          passos:
          - Escriu la fórmula de l'Excel (per exemple, =D6*E6/1000).
          - 'Agafa una fila: potència · hores / 1000 = … kWh.'
          - Comprova que surt igual que a l'Excel.
        '4':
          frases:
          - L'aparell que consumeix més és …
          - Coincideix / no coincideix amb la hipòtesi perquè …
        '5':
          passos:
          - 'Un dia: energia de l''aula · 30 = … kWh.'
          - 'Un curs: … · 175 = … kWh.'
          - 'Preu: … · 0,15 = … €.'
        '6':
          frases:
          - Ara sé que …
    discalculia:
      preguntes:
        '3':
          passos:
          - P · h = … Wh
          - … / 1000 = … kWh
        '5':
          passos:
          - kWh de l'aula · 30 = …
          - … · 175 = …
          - … · 0,15 = … €
  d6f1:
    basics:
      abans_titol: Fórmules
      abans: <ul><li>Rendiment = energia útil / energia consumida · 100.</li><li><b>E (J) = P (W) · t (s)</b></li><li><b>E (kWh) = P (W) · hores / 1000</b></li><li>Cost = kWh · preu.</li></ul>
      preguntes:
        '1':
          passos:
          - Elèctrica → lluminosa (útil) + tèrmica (perduda).
          - 'Suma l''energia de llum i de calor: dona el mateix que l''elèctrica?'
          - Rendiment = llum / elèctrica · 100.
        '2':
          passos:
          - Rendiment = 3 / 8 · 100 = … %.
          - 'Diagrama: entra 8 J d''electricitat, surten 3 J de llum i 5 J de calor.'
        '3':
          pistes:
          - Pensa què entra (electricitat, llum…) i què surt de més útil (moviment, so, calor, llum).
        '4':
          passos:
          - 1 h = 3600 s.
          - E = 60 · 3600 = … J.
          - Escriu-ho en notació científica.
        '5':
          passos:
          - 'Hores a l''any: 5 · 365 = 1825 h.'
          - '60 W: 60 · 1825 / 1000 = … kWh · 0,15 = … €.'
          - '8 W: 8 · 1825 / 1000 = … kWh · 0,15 = … €.'
          - Resta els dos costos.
        '6':
          passos:
          - 1 W · 20 h · 365 = … Wh → / 1000 = … kWh.
          - · 3 000 000 llars = … kWh.
          - / 1 000 000 = … GWh.
        '7':
          frases:
          - Potser no la coneixem perquè …
          - La sal, en solidificar-se, desprèn energia …
    discalculia:
      preguntes:
        '2':
          passos:
          - 3 / 8 = …
          - … · 100 = … %
        '4':
          passos:
          - 60 · 3600 = …
        '5':
          passos:
          - 5 · 365 = 1825
          - 60 · 1825 / 1000 = …
          - 8 · 1825 / 1000 = …
          - Cada un · 0,15 i resta
        '6':
          passos:
          - 20 · 365 / 1000 = … kWh
          - … · 3 = … GWh
  d6lab:
    basics:
      abans_titol: Fórmules
      abans: <ul><li><b>E = P · t</b> (W · s = J; W · h / 1000 = kWh)</li><li>1 kWh = 3,6 · 10⁶ J</li><li>Cost = kWh · 0,15 €</li></ul>
      preguntes:
        '1':
          passos:
          - Anota la potència (W) i l'energia del wattímetre.
          - 1 min = 60 s → E = P · 60 = … J.
          - 'Per comparar: kWh · 3,6 · 10⁶ = … J.'
        '2':
          frases:
          - La potència mesurada és més petita / més gran perquè el carregador …
        '3':
          passos:
          - 'Diferència de potència: halògena − LED = … W.'
          - · 100 bombetes · 6 h · 175 dies / 1000 = … kWh.
          - · 0,15 = … €.
        '4':
          passos:
          - Potència en espera d'una pissarra · 30 · 18 h · 365 / 1000 = … kWh.
          - Fes el mateix per als carregadors.
        '5':
          frases:
          - Proposem … perquè estalvia … kWh.
        '6':
          pistes:
          - Si s'apaga un llum, els altres continuen encesos?
        '7':
          pistes:
          - 'Molta potència fa passar molt de corrent: el cable s''escalfa.'
          - El magnetotèrmic talla si passa massa corrent. El diferencial talla si hi ha una fuita.
    discalculia:
      preguntes:
        '1':
          passos:
          - P · 60 = … J
        '3':
          passos:
          - halògena − LED = … W
          - … · 100 · 6 · 175 = … Wh
          - … / 1000 = … kWh
          - … · 0,15 = … €
        '4':
          passos:
          - P · 30 · 18 · 365 = … Wh
          - … / 1000 = … kWh
  dcR1:
    basics:
      preguntes:
        '1':
          passos:
          - 'K = °C + 273: 283, 293, 303, 313.'
          - 'p / T: divideix cada pressió entre la seva temperatura en K.'
          - Si surt sempre el mateix número, p i T són proporcionals (llei de Gay-Lussac).
        '2':
          passos:
          - Marca els punts (t, v) i uneix-los.
          - 'La velocitat baixa igual cada segon: MRUA.'
          - a = (0 − 6) / 4 = … m/s².
          - 'Distància = àrea del triangle: 4 · 6 / 2 = … m.'
        '3':
          frases:
          - A 40 °C, les partícules es mouen més … i xoquen més …, per això la pressió …
        '4':
          passos:
          - 'Tema A: 60 °C = 333 K. p = (p/T) · 333 = … bar.'
          - 'Tema B: t = 3 / 1,5 = … s. Distància = 3 · t / 2 = … m.'
        '5':
          pistes:
          - 'Tema A: compara la pressió a 60 °C amb 2,8 bar.'
          - 'Tema B: durant la reacció recorre 6 · 1 = 6 m. Suma-hi la distància de frenada.'
        '6':
          passos:
          - 'Títol: el fenomen.'
          - Dibuix del model.
          - La gràfica o la dada.
          - La predicció.
          - Un consell final.
    discalculia:
      preguntes:
        '1':
          passos:
          - 10 + 273 = 283 (i igual amb els altres)
          - 2,40 / 283 = …
        '2':
          passos:
          - −6 / 4 = …
          - 4 · 6 / 2 = …
        '4':
          passos:
          - (p/T) · 333 = …
          - 3 / 1,5 = …
          - 3 · … / 2 = …
        '5':
          passos:
          - 6 · 1 = 6 m
          - 6 + 12 = … m
  dcR2:
    basics:
      preguntes:
        '1':
          exemple: 'Pregunta: l''aigua calenta dissol el sucre més de pressa que la freda? Hipòtesi: sí, perquè les partícules es mouen més de pressa.'
          frases:
          - 'La nostra pregunta és: …?'
          - Creiem que … perquè …
        '2':
          pistes:
          - Canvies una sola cosa (independent), mesures una cosa (dependent) i la resta la deixes igual (controlades).
        '3':
          passos:
          - Suma les tres mesures i divideix entre 3.
          - 'Fes la gràfica: la variable independent a l''eix horitzontal.'
          - Mira si la gràfica diu el mateix que la hipòtesi.
        '4':
          frases:
