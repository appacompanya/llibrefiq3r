  d5hooke:
    basics:
      abans_titol: Fórmules d'aquest laboratori
      abans: '<ul><li>Pes: <b>F = m · 9,8</b> (m en kg). 50 g = 0,050 kg.</li><li>Allargament: <b>Δx = longitud − longitud sense massa</b>.</li><li>Llei de Hooke: <b>F = k · Δx</b>.</li></ul>'
      preguntes:
        '1':
          exemple: 50 g = 0,050 kg → F = 0,050 · 9,8 = 0,49 N. Si la molla fa 10,0 cm sense massa i 12,5 cm amb la massa, Δx = 2,5 cm = 0,025 m.
          passos:
          - Passa cada massa a kg (divideix entre 1 000).
          - 'Calcula el pes: kg · 9,8.'
          - Resta la longitud inicial per trobar l'allargament.
          - Passa l'allargament a metres (divideix entre 100).
        '2':
          passos:
          - 'Eix horitzontal: Δx (m). Eix vertical: F (N).'
          - Tria escales que hi càpiguen.
          - Marca un punt per cada fila de la taula.
        '3':
          passos:
          - Si és una recta que passa per l'origen, F i Δx són proporcionals.
          - 'Agafa un punt de la recta: k = F / Δx.'
          - 'Escriu: F = … · Δx.'
        '4':
          passos:
          - Passa l'allargament a metres.
          - F = k · Δx.
          - Massa = F / 9,8.
        '5':
          pistes:
          - 'Pensa què li passa a una molla si l''estires massa: torna a la forma inicial?'
    discalculia:
      preguntes:
        '1':
          passos:
          - 50 / 1000 = 0,050 kg
          - 0,050 · 9,8 = 0,49 N
          - Allargament = longitud − longitud inicial
        '3':
          passos:
          - k = F / Δx = … N/m
        '4':
          passos:
          - Δx en m = cm / 100
          - F = k · Δx
          - m = F / 9,8
