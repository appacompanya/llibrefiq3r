# Adaptacions del llibre digital per perfil (NESE). Font única de:
#  - llengues: llista de llengües per al perfil nouvingut (el docent en tria una); «traductor» = codi de Google Traductor (buit si no n'hi ha);
#  - glossari: vocabulari mínim de cada SdA (programació, apartat 8.3) amb definició i traduccions revisables per l'aula d'acollida (tr: codi → traducció), per al perfil nouvingut;
#  - fitxes: per a cada fitxa i perfil, «no_cal» (la fitxa ja és adient: l'alumne rep l'original) o el contingut
#    afegit d'una versió adaptada (exemples resolts, pistes, frases model, exemple de resposta).
#    Una fitxa que no surt aquí rep les adaptacions automàtiques del seu perfil.
#  - pendents: fitxes i perfils on cal escriure una versió adaptada (taula de decisió validada pel docent).
# Genera digital/js/adaptacions-dades.js amb tools/3r/build_adaptacions.py.
# Criteris: document «Adaptacions del llibre digital: criteris per perfil».
perfils:
- dislexia
- nouvingut
