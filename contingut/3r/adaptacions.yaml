          - 'Si dos pots tenen la mateixa densitat, cal una altra prova: el color, l''olor, si condueix el corrent…'
    discalculia:
      preguntes:
        '1':
          passos:
          - 'Massa: ple − tara = … g'
          - ρ = … / … = … g/mL
          - … · 1000 = … kg/m³
        '3':
          passos:
          - mesurada − referència = … (sense signe)
          - … / referència = …
          - … · 100 = … %
  d1prov:
    basics:
      abans_titol: Recorda
      abans: <ul><li><b>Substància pura:</b> un sol component (element o compost).</li><li><b>Mescla homogènia:</b> no es veuen les parts (aigua amb sal).</li><li><b>Mescla heterogènia:</b> es veuen les parts (aigua amb sorra).</li></ul>
      preguntes:
        '1':
          pistes:
          - Si l'etiqueta diu «dissolució» o porta dues substàncies, és una mescla.
        '2':
          pistes:
          - 'Si el LED s''encén, el líquid té ions: segurament hi ha sal dissolta.'
        '3':
          frases:
          - Amb aquesta prova he distingit … perquè un condueix i l'altre no.
          - Condueix perquè la sal es separa en … que es mouen.
        '4':
          frases:
          - 'És un canvi químic perquè apareix una substància nova: …'
        '5':
          passos:
          - 'Primer, l''imant: treu el ferro.'
          - 'Segon, l''aigua: les serradures suren i les recollim.'
          - 'Tercer, filtrar: la sorra queda al paper.'
          - 'Quart, evaporar: la sal queda a la càpsula.'
  d1sep:
    basics:
      preguntes:
        '1':
