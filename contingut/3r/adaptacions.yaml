      abans: '<ul><li><b>Protó:</b> càrrega +, massa 1 u, al nucli.</li><li><b>Neutró:</b> sense càrrega, massa 1 u, al nucli.</li><li><b>Electró:</b> càrrega −, massa gairebé 0, al voltant del nucli.</li></ul><p><b>Z</b>
