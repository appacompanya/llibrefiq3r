  d4f2:
    basics:
      abans_titol: Com es fa un càlcul de massa
      abans: '<ol><li>Ajusta l''equació.</li><li>Escriu la massa de cada substància amb les masses atòmiques (H = 1, C = 12, O = 16).</li><li>Fes un factor de conversió amb les dues substàncies que et demanen.</li></ol><p>2
        H₂ + O₂ → 2 H₂O: <b>4 g</b> d''H₂ + <b>32 g</b> d''O₂ → <b>36 g</b> d''H₂O.</p>'
      preguntes:
        '1':
          pistes:
          - Compta les boles de cada color a cada costat.
        '2':
          exemple: 'H₂O → H₂ + O₂: a la dreta hi ha 2 O, posem un 2 davant de l''H₂O. Ara hi ha 4 H, posem un 2 davant de l''H₂: 2 H₂O → 2 H₂ + O₂.'
          passos:
          - Compta els àtoms de cada element a cada costat.
          - Posa números davant (mai canviïs els subíndexs).
          - Torna a comptar fins que quadri.
        '3':
          passos:
          - 'Aigua: 8 · 36 / 4 = … g.'
          - 'Oxigen: 8 · 32 / 4 = … g.'
        '4':
          passos:
          - Igual que la pregunta 3, però amb 20 kg.
          - 'Aigua: 20 · 36 / 4 = … kg.'
          - 'Oxigen: 20 · 32 / 4 = … kg.'
        '5':
          passos:
          - CH₄ + 2 O₂ → CO₂ + 2 H₂O.
          - 16 g CH₄ → 44 g CO₂ i 36 g H₂O.
          - '1 kg = 1000 g: 1000 · 44 / 16 = … g de CO₂.'
        '6':
          passos:
          - Mg = 24 u; 2 HCl = 73 u; MgCl₂ = 95 u; H₂ = 2 u.
          - 'Reactius: 24 + 73. Productes: 95 + 2. Són iguals?'
          - 'H₂: 0,024 · 2 / 24 = … g.'
        '7':
          passos:
          - 10 g d'H₂ necessiten 10 · 32 / 4 = … g d'O₂.
          - 'En tenim 100 g: en sobra o en falta?'
          - 'El que s''acaba primer decideix l''aigua: 10 · 36 / 4 = … g.'
    discalculia:
      preguntes:
        '3':
          passos:
          - 8 · 36 = 288 → 288 / 4 = …
          - 8 · 32 = 256 → 256 / 4 = …
        '4':
          passos:
          - 20 · 9 = … kg d'aigua
          - 20 · 8 = … kg d'oxigen
        '5':
          passos:
          - 1000 · 44 / 16 = …
          - 1000 · 36 / 16 = …
        '6':
          passos:
          - 24 + 73 = …
          - 95 + 2 = …
          - 0,024 / 12 = …
        '7':
          passos:
          - 10 · 8 = … g O₂
          - 100 − … = … g que sobren
          - 10 · 9 = … g d'aigua
  d4lab3:
    basics:
      preguntes:
        '1':
          passos:
          - 400 mL = 0,4 L.
          - Massa = concentració · volum = 50 · 0,4 = … g.
        '2':
          pistes:
          - Escriu la fórmula, posa-hi els números amb les unitats i el resultat.
        '3':
