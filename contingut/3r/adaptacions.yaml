  lab:
    basics:
      abans_titol: Fórmules d'aquest laboratori
      abans: '<ul><li>Radi: <b>r = perímetre / (2 · 3,14)</b></li><li>Volum: <b>V = 4/3 · 3,14 · r³</b> (cm³)</li><li>Litres: <b>cm³ / 1000</b></li><li>Variació: <b>(V final − V inicial) / V inicial · 100</b></li></ul>'
      preguntes:
        '1':
          passos:
          - Mesura tres vegades el perímetre de cada globus.
          - 'Suma les tres mesures i divideix entre 3: és la mitjana.'
          - Anota les dues temperatures.
        '2':
          frases:
          - El globus del congelador es farà més … perquè …
          - El globus de l'aigua calenta es farà més … perquè …
        '3':
          exemple: 'Si el perímetre és 62,8 cm: r = 62,8 / 6,28 = 10 cm; V = 4/3 · 3,14 · 10³ = 4 187 cm³ = 4,19 L.'
          passos:
          - r = perímetre / 6,28
          - r³ = r · r · r
          - V = 4,19 · r³ (cm³)
          - Divideix entre 1000 per tenir litres.
        '4':
          passos:
          - Calcula el volum final igual que el volum inicial.
          - 'Resta: V final − V inicial.'
          - Divideix aquesta resta entre el V inicial i multiplica per 100.
        '5':
          frases:
          - La predicció s'ha complert / no s'ha complert perquè …
          - La variació més gran ha estat al globus …
        '6':
          pistes:
          - El globus no és una esfera perfecta.
          - Mesurar el perímetre amb una cinta és difícil.
        '7':
          frases:
          - Al fred, les partícules d'aire es mouen més …
          - A la calor, …
    discalculia:
      preguntes:
        '3':
          passos:
          - r = P / 6,28
          - r · r · r = …
          - 4,19 · … = … cm³
          - … / 1000 = … L
        '4':
          passos:
          - V final − V inicial = …
          - … / V inicial = …
          - … · 100 = … %
  d1f1:
    basics:
      abans_titol: Recorda
      abans: '<ul><li>Fonamentals: longitud (m), massa (kg), temps (s), temperatura (K).</li><li>Derivades: es fan amb les fonamentals (superfície m², volum m³, velocitat m/s, densitat kg/m³).</li><li>kilo = 1000 · centi =
        0,01 · mil·li = 0,001 · micro = 0,000 001</li></ul>'
      preguntes:
        '1':
          pistes:
          - Si la unitat té una sola lletra bàsica (m, kg, s, K), és fonamental.
          - Si la unitat té una fracció o un exponent (m/s, m², kg/m³), és derivada.
        '3':
          exemple: 2,5 kg · (1000 g / 1 kg) = 2500 g. Els kg de dalt i de baix es van.
          passos:
          - Escriu la quantitat.
          - 'Multiplica pel factor: a dalt la unitat que vols, a baix la que tens.'
          - Fes l'operació i escriu la unitat.
        '4':
          exemple: '300 000 000 → comptem els llocs que movem la coma fins a 3: 8 llocs → 3 · 10⁸.'
          passos:
          - Posa la coma darrere la primera xifra que no sigui zero.
          - Compta quants llocs l'has moguda.
          - 'Cap a l''esquerra: exponent positiu. Cap a la dreta: negatiu.'
        '5':
          pistes:
          - 'Exponent positiu: mou la coma cap a la dreta tants llocs com diu.'
          - 'Exponent negatiu: mou-la cap a l''esquerra.'
        '6':
          exemple: '(3·10⁴)·(2·10⁻⁶): 3 · 2 = 6 i 10⁴⁺⁽⁻⁶⁾ = 10⁻² → 6·10⁻².'
          passos:
          - Multiplica (o divideix) els números.
          - Suma (o resta) els exponents.
          - Si el número és 10 o més, passa'l a notació científica.
        '7':
          passos:
          - 'Passa-ho tot a metres: nm = 10⁻⁹ m, µm = 10⁻⁶ m, mm = 10⁻³ m.'
          - 'Compara els exponents: el més negatiu és el més petit.'
    discalculia:
      preguntes:
        '3':
          passos:
          - 2,5 · 1000 = 2500
        '6':
          passos:
          - 'Números: 3 · 2 = 6'
          - 'Exponents: 4 + (−6) = −2'
          - 'Resultat: 6·10⁻²'
  d1f2:
