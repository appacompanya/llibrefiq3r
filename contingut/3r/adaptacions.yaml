  d3lab:
    discalculia: no_cal
    basics:
      abans_titol: Capes del model de Bohr
      abans: '<p>1a capa: fins a 2 electrons. 2a capa: fins a 8. 3a capa: comencem a omplir-la amb 8.</p><p>Exemple: sodi, Z = 11 → 2, 8, 1.</p>'
      preguntes:
        '1':
          passos:
          - 'Liti, Z = 3: 2 a la 1a capa i 1 a la 2a.'
          - 'Oxigen, Z = 8: 2 i 6.'
          - 'Sodi, Z = 11: 2, 8 i 1.'
        '2':
          pistes:
          - Els elements amb el mateix nombre d'electrons a l'última capa s'assemblen.
        '3':
          frases:
          - La mostra X conté … perquè la flama és de color … i les línies són …
        '4':
          frases:
          - Les podem distingir amb … perquè cada element té unes línies …
        '5':
          passos:
          - Dibuixa el nucli i les capes.
          - Fletxa d'un electró que puja de capa (absorbeix energia).
          - Fletxa de l'electró que torna i fa llum.
        '6':
          frases:
          - El color depèn dels electrons de l'àtom de …, no del compost.
        '7':
          frases:
          - Van trobar elements nous perquè van veure unes línies que …
    nouvingut:
      preguntes:
        '3':
          frases:
          - La mostra conté … perquè …
          paraules:
          - flama
          - color
          - línia
          - espectroscopi
        '4':
          frases:
          - L'espectroscopi és millor perquè …
          paraules:
          - línies
          - vermell
          - segur
        '6':
          frases:
          - El color identifica l'element perquè …
          paraules:
          - element
          - compost
          - àtom
        '7':
          frases:
          - Van trobar elements nous perquè …
          paraules:
          - descobrir
          - línia nova
          - llum
    tea:
      preguntes:
        '2':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '3':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '4':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '6':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '7':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '1':
          model: Dibuixa pocs elements i posa'ls una etiqueta. Fes servir boles per a les partícules i fletxes per al moviment.
        '5':
          model: Dibuixa pocs elements i posa'ls una etiqueta. Fes servir boles per a les partícules i fletxes per al moviment.
  d3f4:
    discalculia: no_cal
    basics:
      abans_titol: Com es llegeix la taula
      abans: <ul><li><b>Període</b> = fila (horitzontal).</li><li><b>Grup</b> = columna (vertical), de l'1 al 18.</li><li>Els elements del mateix grup s'assemblen.</li></ul>
      preguntes:
        '1':
          pistes:
          - 'Els metalls són la gran majoria: a l''esquerra i al centre.'
        '2':
          passos:
          - Busca el símbol de l'element.
          - La Z és el número de dalt.
          - Compta la fila (període) i la columna (grup).
        '3':
          pistes:
          - 'Busca la fila (període) i la columna (grup) que diu cada frase: on es creuen hi ha l''element.'
        '4':
          passos:
          - 'Li (Z = 3): 2, 1. Na (Z = 11): 2, 8, 1. K (Z = 19): 2, 8, 8, 1.'
          - Què tenen igual a l'última capa?
          - Perden aquest electró i formen un ió +1.
        '5':
          pistes:
          - 'Grup 1: +1 · grup 2: +2 · grup 13: +3 · grup 16: −2 · grup 17: −1.'
    nouvingut:
      preguntes:
        '4':
          frases:
          - Tots tenen … electró a l'última capa.
          - El més reactiu és …
          paraules:
          - grup
          - capa
          - electró
          - reactiu
        '5':
          frases:
          - El magnesi forma l'ió … perquè …
          paraules:
          - perdre
          - guanyar
          - ió
    tea:
      preguntes:
        '4':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '5':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
  d3f5:
    discalculia: no_cal
    basics:
      abans_titol: Tres enllaços
      abans: '<ul><li><b>Iònic:</b> metall + no metall. Un dona electrons i l''altre els agafa.</li><li><b>Covalent:</b> no metall + no metall. Comparteixen electrons.</li><li><b>Metàl·lic:</b> entre metalls. Electrons lliures:
        condueix el corrent.</li></ul>'
      preguntes:
        '1':
          passos:
          - 'Li (Z = 3): 2, 1. F (Z = 9): 2, 7.'
          - El liti dona 1 electró al fluor.
          - Es formen Li⁺ i F⁻.
          - 'Una càrrega + i una −: el total és zero.'
        '2':
          pistes:
          - 'Cu i Au: metàl·lic. Si i SiO₂: covalent. LiCoO₂: iònic.'
        '3':
          frases:
          - El coure condueix perquè té electrons …
          - El vidre i el plàstic no condueixen; per això …
        '4':
          frases:
          - El grafit condueix perquè té electrons que …
    nouvingut:
      preguntes:
        '1':
          frases:
          - El liti dona un electró al …
          paraules:
          - electró
          - ió
          - càrrega
        '3':
          frases:
          - Els cables són de coure perquè …
          paraules:
          - conduir
          - corrent
          - aïllant
        '4':
          frases:
          - El grafit condueix perquè …
          paraules:
          - carboni
          - capa
          - electró lliure
    tea:
      preguntes:
        '3':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '4':
          model: Una bona resposta diu <b>què passa</b> i <b>per què</b>, amb una paraula clau del tema. Dues o tres frases n'hi ha prou.
        '1':
          model: Dibuixa pocs elements i posa'ls una etiqueta. Fes servir boles per a les partícules i fletxes per al moviment.
