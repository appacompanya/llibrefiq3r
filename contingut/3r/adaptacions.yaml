      abans: '<ul><li>MRUA: <b>v = v₀ + a·t</b> i <b>x = x₀ + v₀·t + ½·a·t²</b></li><li>MRU: <b>x = x₀ + v·t</b></li></ul><p>Tram 1: accelera. Tram 2: velocitat constant. Tram 3: frena.</p>'
      preguntes:
        '1':
          passos:
          - 'Tram 1: v = 0 + 0,25 · 20 = … m/s.'
          - 'Tram 3: el temps de frenada és t = v / 0,25 = …'
          - 'Durada total: 20 s + 40 s + temps de frenada.'
        '2':
          exemple: 'A t = 10 s (tram 1): v = 0,25 · 10 = 2,5 m/s; x = ½ · 0,25 · 10² = 12,5 m.'
          pistes:
          - 'Al final del tram 1 (20 s): v = 5 m/s i x = 50 m.'
          - 'Al tram 2, x augmenta 5 m cada segon: x = 50 + 5 · (t − 20).'
        '3':
          passos:
          - Mira el valor més gran de x a la taula i tria una escala que hi càpiga.
          - Marca cada punt de la taula.
          - 'Uneix-los: corba al tram 1 i 3, recta al tram 2.'
        '4':
          passos:
          - 'Tram 1: la velocitat puja de 0 a 5 m/s (recta que puja).'
          - 'Tram 2: es manté a 5 m/s (recta horitzontal).'
          - 'Tram 3: baixa de 5 a 0 (recta que baixa).'
        '5':
          passos:
          - Pendent = (canvi de v) / (canvi de t).
          - 'Tram 1: (5 − 0) / 20 = … m/s². Representa l''acceleració.'
          - 'Tram 2 a la x–t: (250 − 50) / 40 = … m/s. Representa la velocitat.'
        '6':
          frases:
          - Als trams 1 i 3 la velocitat canvia, per això la gràfica x–t és …
          - Al tram 2 la velocitat és constant, per això …
          pistes:
          - Rapidesa mitjana = distància total / temps total = 300 m / 80 s.
