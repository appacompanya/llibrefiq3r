# SdA 6: font única (sessions, documents, fitxes digitals, evidències i criteris).
# uid = identificador estable (el mateix que a la base de dades). No el canviïs mai ni el reutilitzis.
# versio: puja-la quan el canvi sigui de fons (canvia què es pregunta o què s'avalua); les errates no.
# Els camps d'una pregunta hereten la versio de la pregunta.
sda: 6
versio: 2
color: --s6
titol: L'energia del nostre institut
repte: Quanta energia gasta la nostra aula i com podem estalviar-ne a tot l'institut?
meta: '3r trimestre · 7 sessions · Producte final: pla d''estalvi energètic del grup i votació del pla que es presenta a la direcció · Competències específiques avaluades: CE1, CE4 i CE6'
publicada: true
ce_aprovades:
- CE1
- CE4
- CE6
sessions:
- titol: Auditoria energètica de l'aula
  fase: Explorem
  text: 'La direcció ens demana propostes per reduir el consum d''electricitat de l''institut. Començarem per la nostra aula: en grup, escriureu una hipòtesi sobre quin aparell gasta més energia. Després fareu l''inventari a l''Excel (baixa la plantilla amb el botó d''aquesta sessió), amb la potència de les etiquetes i fórmules per calcular l''energia diària, i comprovareu si la hipòtesi era correcta. Rebràs les rúbriques de la SdA.'
  docs:
  - d6ruta
  - d6repte
  - d6rub
  enllacos:
  - inv
  mitja: true
- titol: Energia, potència i consum
  fase: Aprenem
  text: Veurem que l'energia es transforma però es conserva, i què és el rendiment. Compararem una bombeta d'incandescència amb una de LED i calcularem el consum en kWh i el que costa. Coneixeràs Mária Telkes, pionera de l'energia solar. La fitxa 1 l'acabaràs a casa.
  docs:
  - d6f1
  enllacos:
  - telkes
  mitja: false
- titol: Mesurem el consum real
  fase: Experimentem
  text: Corregirem la fitxa 1. Amb un wattímetre d'endoll mesurarem la potència real dels portàtils i els carregadors, el ventilador, la pissarra digital i dues bombetes, en marxa i en espera, i calcularem quanta energia consumeixen en un any. Al final veurem per què la instal·lació elèctrica de l'institut està connectada en paral·lel.
  docs:
  - d6lab
  enllacos:
  - inv
  mitja: true
- titol: D'on ve l'electricitat?
  fase: Investiguem
  text: Veurem com es genera l'electricitat amb una turbina i un alternador, i analitzarem d'on va venir l'electricitat de Catalunya el 2024. En parelles, investigareu una tecnologia en fonts fiables i en citareu les fonts.
  docs:
  - d6f2
  enllacos:
  - reecat
  - phetfaraday
  mitja: false
- titol: El pla d'estalvi i el debat
  fase: Ho apliquem
  text: 'En grups de tres, elaborareu el pla d''estalvi de l''institut amb tres mesures: una d''hàbits sostenibles, una d''eficiència i una de generació renovable, amb l''estalvi calculat i amb la participació de tota la comunitat. Després debatreu quina mesura és la prioritària, amb arguments i escoltant els altres. Al final tens el mapa conceptual de la SdA.'
  docs:
  - d6pla
  - d6repte
  - d6mapa
  enllacos:
  - inv
  mitja: true
- titol: Demostració d'assoliment
  fase: Avaluem
  text: Activitat de demostració d'assoliment, individual, amb situacions noves. Porta la calculadora i repassa les fitxes, el laboratori i el mapa conceptual.
  docs: []
  docs_professorat:
  - d6prova
  - d6solpr
  enllacos: []
  mitja: false
- titol: Corregeixo, votem i reflexiono
  fase: Reflexionem
  text: Corregirem l'activitat de demostració entre tots i l'esmenaràs amb bolígraf verd, sense esborrar res. Els portaveus presentaran els plans d'estalvi i votarem quin es presenta a la direcció. Faràs la diana per valorar què has après.
  docs:
  - d6diana
  - d6pla
  docs_professorat:
  - d6solpr
  enllacos: []
  mitja: true
professorat:
- bloc: Material multinivell · ampliació
  text: Reptes d'ampliació per a l'alumnat que ja domina els criteris o acaba abans (també al llibre de l'alumnat) i el seu solucionari.
  docs:
  - d6amp
  - d6solamp
- bloc: Atenció a la diversitat · TEA
  text: 'Anticipació de la sessió del debat: horari, rol, frases model, normes i targeta de pausa. Mesura addicional. Inclou una nota per al professorat a l''última pàgina.'
  docs:
  - d6adap
- bloc: Tasques de recuperació (una per CE)
  text: Sis tasques amb el mateix format (repte, parts guiades, calendari, defensa oral i rúbrica per criteris). Es fan quan una CE queda en NA en acabar la darrera SdA on s'avalua, o per millorar. El nivell nou substitueix l'anterior si és més alt. Al registre d'avaluació hi ha la columna per anotar-ne el resultat.
  docs:
  - dcR1
  - dcR2
  - dcR3
  - dcR4
  - dcR5
  - dcR6
- bloc: Sessió de tancament del curs
  text: Tornen a respondre el sondeig de la sessió 0 i el comparen, revisen les sis dianes i fan la reflexió final. Enquesta anònima de valoració (també al final de cada trimestre).
  docs:
  - dcT
  - dcE
- bloc: Plantilla de la SdA
  text: Identificació, context, elements curriculars, sessions, avaluació, diversitat, organització i seguretat, i materials.
  url: https://claude.ai/code/artifact/f23639ea-f6d3-4b35-9773-ba40dc76dea1
  url_text: Obre la plantilla
- bloc: Registre de competències
  text: Què es treballa a cada SdA i què queda pendent.
  url: https://claude.ai/artifact/CtU9znNixhemwYF8QSuFVc
  url_text: Obre el registre
- bloc: Activitat de demostració i solucionaris
  text: Activitat de demostració d'assoliment de la sessió 6, solucionari amb criteris, solucionari de les fitxes i del laboratori de consum. La plantilla d'Excel de l'inventari i el seu solucionari es pengen a l'aula virtual del grup.
  docs:
  - d6prova
  - d6solpr
  - d6solf
- bloc: Rúbriques
  text: Cerca d'informació, pla d'estalvi i debat.
  docs:
  - d6rub
