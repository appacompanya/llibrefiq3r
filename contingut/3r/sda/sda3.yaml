# SdA 3: font única (sessions, documents, fitxes digitals, evidències i criteris).
# uid = identificador estable (el mateix que a la base de dades). No el canviïs mai ni el reutilitzis.
# versio: puja-la quan el canvi sigui de fons (canvia què es pregunta o què s'avalua); les errates no.
# Els camps d'una pregunta hereten la versio de la pregunta.
# Avaluació oficial: nivells NA–AE, sense pesos.
# Fitxes: la 2 (d3f2, evolució dels models) és qualificadora (evidència s3.fit, criteri 6.1). Les fitxes 1, 3, 4 i 5 són formatives i no entren al càlcul oficial.
# CE (mapa de la programació, 25/10/2026): principals CE1 i CE5. Secundària CE6, només a la fitxa 2 (6.1). La demostració avalua el model atòmic, la taula periòdica i l'enllaç amb 1.1 i 1.2, i l'activitat 5 amb 5.1 i 5.2. La campanya no avalua el 4.1 (passa a la presentació del pla de la SdA 6).
# El balanç del punt de recollida es comenta a la SdA 4; aquí es qualifica la campanya.
sda: 3
versio: 3
color: --s3
titol: Què hi ha dins del meu mòbil?
repte: Quins elements químics fan funcionar un mòbil i què n'hem de fer quan el llencem?
meta: '1r i 2n trimestre · 10 sessions · Producte final: campanya del punt de recollida de mòbils (objectiu, rols, cartell i arguments) · Competències específiques avaluades: CE1, CE5 i CE6'
publicada: true
ce_aprovades:
- CE1
- CE5
- CE6
sessions:
- titol: Desmuntem el mòbil
  fase: Explorem
  text: 'Desmuntarem un model de mòbil peça a peça i, a partir de les etiquetes tècniques, trobarem quins elements químics conté. Farem una hipòtesi: què passaria si el llencéssim al contenidor de rebuig? Presentarem el repte: un punt de recollida de mòbils a l''institut.'
  docs:
  - d3ruta
  - d3f1
  - d3rub
  docs_professorat:
  - d3model
  enllacos: []
- titol: De Dalton a Bohr
  fase: Aprenem
  text: Veurem com ha canviat la idea d'àtom, des de Dalton fins a Bohr. Amb els simuladors reproduirem l'experiment de Rutherford i construirem àtoms per entendre el nombre atòmic, el nombre màssic i els isòtops.
  docs:
  - d3f2
  enllacos:
  - rutherford
  - buildatom
- titol: Ions i el camí del reciclatge
  fase: Aprenem
  text: Recordarem què és un ió i veurem, amb el nostre simulador, com es mouen els ions de liti dins de la bateria. Després cada grup explicarà una etapa del camí que fa un mòbil quan es recicla.
  docs:
  - d3f3
  docs_professorat:
  - d3targ
  enllacos:
  - simbat
- titol: El liti a la flama
  fase: Experimentem
  text: 'Començarem amb 15 minuts per recordar el que vam fer abans de les vacances. Primer veurem com es distribueixen els electrons per capes segons el model de Bohr. Després comprovarem que una sal conté liti amb l''assaig a la flama i un espectroscopi: cada element emet uns colors propis, i ho explicarem amb el model de Bohr.'
  docs:
  - d3lab
  enllacos: []
- titol: La taula periòdica
  fase: Aprenem
  text: Veurem com Mendeléiev va ordenar els elements i va predir-ne de nous. Situarem a la taula els elements del mòbil i descobrirem per què els elements d'un mateix grup s'assemblen.
  docs:
  - d3f4
  enllacos:
  - ptable
  - joctaula
- titol: L'enllaç químic
  fase: Aprenem
  text: Veurem per què s'uneixen els àtoms i com són els enllaços iònic, covalent i metàl·lic. Explicarem per què els cables són de coure i el separador de la bateria és de plàstic.
  docs:
  - d3f5
  enllacos:
  - anenllac
- titol: Per què cremen les bateries?
  fase: Ho apliquem
  text: Analitzarem notícies d'incendis en camions de les escombraries i en plantes de residus, i explicarem què passa dins d'una bateria aixafada. També veurem quins elements del mòbil la Unió Europea considera crítics.
  docs:
  - d3dos
  enllacos:
  - simbat
- titol: Posem en marxa el punt de recollida
  fase: Ho apliquem
  text: 'Organitzarem la campanya: objectiu, normes, rols, cartell i difusió del punt de vista (per què no llençar el mòbil al rebuig). El punt de recollida es posa en marxa. El recompte del que s''ha recollit es comenta en tancar la SdA 4 i no forma part del producte que es qualifica aquí. Al final tens el mapa conceptual de la SdA.'
  docs:
  - d3camp
  - d3mapa
  enllacos: []
- titol: Demostració d'assoliment
  fase: Avaluem
  text: Activitat de demostració d'assoliment, individual, amb situacions noves. Repassa les fitxes i el mapa conceptual.
  docs: []
  docs_professorat:
  - d3prova
  - d3solpr
  enllacos: []
- titol: Corregeixo i reflexiono
  fase: Reflexionem
  text: Corregirem l'activitat de demostració entre tots. Esmenaràs les teves respostes amb bolígraf verd, sense esborrar res, i faràs la diana per valorar què has après.
  docs:
  - d3diana
  docs_professorat:
  - d3solpr
  enllacos: []
professorat:
- bloc: Material multinivell · ampliació
  text: Reptes d'ampliació per a l'alumnat que ja domina els criteris o acaba abans (també al llibre de l'alumnat) i el seu solucionari.
  docs:
  - d3amp
  - d3solamp
- bloc: Atenció a la diversitat · Suport manipulatiu
  text: 'Fitxa per a l''alumnat amb NESE que necessita suport manipulatiu i visual: models de Bohr per comptar, taula periòdica simplificada i rol de registre a la campanya. Mesura addicional, amb els mateixos criteris. Inclou una nota per al professorat a l''última pàgina.'
  docs:
  - d3adap
- bloc: Plantilla de la SdA
  text: Identificació, context, elements curriculars, sessions, avaluació, diversitat, metodologia i materials.
  url: https://claude.ai/code/artifact/89fa6c85-6fc9-4921-b84f-beb3ec06f5a3
  url_text: Obre la plantilla
- bloc: Registre de competències
  text: Què es treballa a cada SdA i què queda pendent.
  url: https://claude.ai/artifact/CtU9znNixhemwYF8QSuFVc
  url_text: Obre el registre
- bloc: Material per imprimir
  text: Model de mòbil desmuntable per plastificar (sessió 1) i targetes del camí del reciclatge (sessió 3).
  docs:
  - d3model
  - d3targ
- bloc: Activitat de demostració i solucionaris
  text: Activitat de demostració d'assoliment de la sessió 9, solucionari amb criteris i solucionari de les fitxes i del laboratori.
  docs:
  - d3prova
  - d3solpr
  - d3solf
- bloc: Rúbriques
  text: Campanya, presentació del reciclatge, laboratori i dossier.
  docs:
  - d3rub
