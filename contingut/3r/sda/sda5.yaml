# SdA 5: font única (sessions, documents, fitxes digitals, evidències i criteris).
# uid = identificador estable (el mateix que a la base de dades). No el canviïs mai ni el reutilitzis.
# versio: puja-la quan el canvi sigui de fons (canvia què es pregunta o què s'avalua); les errates no.
# Els camps d'una pregunta hereten la versio de la pregunta.
# Avaluació oficial: nivells NA–AE, sense pesos.
# Fitxes qualificadores: 3 (d5f3, gràfiques, 1.1), 5 (d5f5, disseny de la difusió, 2.2) i 6 (d5f6q, febre, 1.1 i 5.3), i el laboratori de Hooke (d5hooke, 2.3). La resta (1, 2, 4 i 7) són formatives i no entren al càlcul oficial.
# La resposta al repte de la sessió 13 és formativa (esmena de les hipòtesis). El producte que es qualifica és el full de forces cel·lulars.
# CE: principals CE1 i CE5. Secundària CE2: 2.2 al disseny de la demostració de difusió (grup sencer, sessió 7, fitxa 5) i 2.3 al laboratori de Hooke (mig grup, per parelles, sessió 10), on l'alumnat mesura de debò.
# Grup: mitja false = grup sencer (GS), mitja true = mig grup (MG). Horari: 1 GS + 2 migs (el docent repeteix la sessió de mig grup). La sessió 7 és GS: demostració del docent, no laboratori en mig grup.
sda: 5
versio: 3
color: --s5
titol: Cèl·lules immunitàries a la caça dels patògens
repte: Com persegueix un neutròfil un bacteri sense veure'l?
meta: '2n i 3r trimestre · 13 sessions · Producte final: full de forces cel·lulars · Competències específiques avaluades: CE1, CE5 i CE2'
publicada: true
ce_aprovades:
- CE1
- CE5
- CE2
sessions:
- titol: La persecució
  fase: Explorem
  text: 'Veurem un vídeo real d''un neutròfil que persegueix un bacteri. Veurem també per què és tan important que les cèl·lules migrin: per defensar-nos de les infeccions, per tancar les ferides i, malauradament, en la metàstasi d''un càncer. En grup, farem una hipòtesi sobre com es mou, si fa força i com sap on és el bacteri. Rebràs les rúbriques de la SdA.'
  docs:
  - d5ruta
  - d5repte
  - d5rub
  enllacos:
  - rogers
  - ferida
  - metastasi
  mitja: false
- titol: El moviment uniforme (MRU)
  fase: Aprenem
  text: Fotografiarem el moviment d'un cotxe i d'una moto cada segon i descobrirem quan un moviment és uniforme. Aprendrem què és la velocitat, a passar de km/h a m/s, a escriure l'equació de posició i a llegir gràfiques posició-temps amb cotxes, motos i patinets.
  docs:
  - d5f1
  enllacos:
  - labmru
  mitja: true
- titol: El moviment accelerat (MRUA)
  fase: Aprenem
  text: 'Comentarem les rúbriques abans de la primera activitat avaluada. Estudiarem l''acceleració i les equacions del moviment rectilini uniformement accelerat: una moto que surt d''un semàfor, un cotxe que frena i per què la velocitat es limita a 30 km/h a prop de les escoles.'
  docs:
  - d5f2
  enllacos:
  - anmrua
  - labmrua
  mitja: false
- titol: Les gràfiques del patinet
  fase: Ho apliquem
  text: Un patinet accelera, va a velocitat constant i frena. Farem la taula i les gràfiques posició-temps i velocitat-temps i interpretarem els pendents.
  docs:
  - d5f3
  enllacos:
  - anmrua
  - labmru
  - labmrua
  mitja: true
- titol: Trajectòria i desplaçament
  fase: Aprenem
  text: Ja coneixem els moviments ideals; ara veurem com es mou de veritat una cèl·lula. Mesurarem les cèl·lules fent servir un glòbul vermell (eritròcit, 7,5 µm de diàmetre) com a escala de referència i calcularem l'augment del dibuix. Després, en una sola imatge veurem la posició d'un neutròfil cada minut. Dibuixarem la trajectòria i calcularem la distància recorreguda, el desplaçament, la rapidesa mitjana i la velocitat mitjana.
  docs:
  - d5f4
  enllacos: []
  mitja: false
- titol: Problemes de moviment
  fase: Practiquem
  text: 'Problemes de MRU i MRUA: trobades, arrencades i frenades, i la persecució del neutròfil.'
  docs:
  - d5prob
  enllacos: []
  mitja: true
- titol: Difusió i gradient
  fase: Experimentem
  text: 'El docent fa, amb el grup sencer, la demostració de com es difon una gota de tinta en aigua freda, a temperatura ambient i calenta. No és un laboratori en mig grup: observem, registrem el disseny i les mesures a la fitxa 5 i en traiem conclusions. Després aprendrem què és un gradient de concentració i l''observarem amb una simulació.'
  docs:
  - d5f5
  enllacos:
  - difusio
  mitja: false
- titol: Quimiotaxi i febre
  fase: Aprenem
  text: Veurem com el neutròfil segueix el gradient de les substàncies que alliberen els bacteris i ho comprovarem tornant a mirar el vídeo de la sessió 1. Amb una gràfica de recerca descobrirem per què la febre ajuda les cèl·lules immunitàries, i distingirem una malaltia dels seus símptomes.
  docs:
  - d5f6q
  enllacos:
  - rogers
  - febre
  mitja: true
- titol: Les lleis de Newton
  fase: Aprenem
  text: 'Les tres lleis de Newton i el newton, aplicades al patinet i a la cèl·lula: per què avança quan estira el substrat i per què s''atura de cop quan deixa de fer força. En una píndola de 10 minuts veurem la cèl·lula per dins: el citoesquelet i les adhesions focals amb què fa força.'
  docs:
  - d5f6
  enllacos:
  - cito
  - phetforces
  mitja: false
- titol: La llei de Hooke
  fase: Experimentem
  text: Per parelles, penjareu masses d'una molla, en mesurareu l'allargament amb el regle i trobareu la constant elàstica a partir de la gràfica. Les mesures i la gràfica s'avaluen amb la rúbrica (criteri 2.3).
  docs:
  - d5hooke
  enllacos: []
  mitja: true
- titol: Les cèl·lules també fan forces
  fase: Ho apliquem
  text: Farem servir una tècnica de recerca actual, la microscòpia de forces de tracció, que el vostre professor va fer servir durant el doctorat a l'IBEC. Superposarem dues imatges de microscòpia de fluorescència d'un gel amb boletes, sense cèl·lula i amb cèl·lula, mesurarem el desplaçament de les boletes i calcularem les forces que fa la cèl·lula. Al final tens el mapa conceptual per preparar l'activitat de demostració d'assoliment.
  docs:
  - d5tfm
  - d5mapa
  docs_professorat:
  - d5lam
  enllacos: []
  mitja: false
- titol: Demostració d'assoliment
  fase: Avaluem
  text: Activitat de demostració d'assoliment, individual, amb situacions noves. Porta la calculadora i repassa les fitxes i el mapa conceptual.
  docs: []
  docs_professorat:
  - d5prova
  - d5solpr
  enllacos: []
  mitja: true
- titol: Responc el repte i reflexiono
  fase: Reflexionem
  text: 'Respondrem el repte de la sessió 1 amb tot el que hem après i esmenarem les hipòtesis. Corregirem l''activitat de demostració entre tots. Esmenaràs les teves respostes amb bolígraf verd, sense esborrar res, i faràs la diana per valorar què has après. Aquesta resposta al repte és formativa: no és una evidència de l''avaluació oficial. El producte que es qualifica és el full de forces cel·lulars.'
  docs:
  - d5diana
  docs_professorat:
  - d5solpr
  enllacos: []
  mitja: false
