# SdA 1: font única (sessions, documents, fitxes digitals, evidències i criteris).
# uid = identificador estable (el mateix que a la base de dades). No el canviïs mai ni el reutilitzis.
# versio: puja-la quan el canvi sigui de fons (canvia què es pregunta o què s'avalua); les errates no.
# Els camps d'una pregunta hereten la versio de la pregunta.
# Avaluació oficial: nivells NA, AS, AN i AE, sense pesos percentuals.
# Fitxes: són formatives. La nota del llibre digital és orientativa i no entra al càlcul oficial.
# Sabers: HC1–HC6, M2, M3, E8, C2, C4. No s'hi treballen M5 (estructura atòmica) ni M6 (taula periòdica); són de la SdA 3.
# CE: principals CE2 i CE3. Secundària CE5 (lectura Ellen Swallow Richards, ítem «Aigua i salut», rúbrica 5.1).
sda: 1
versio: 2
color: --s1
titol: Detectius de la matèria
repte: Com podem identificar dotze substàncies que han perdut l'etiqueta?
meta: '1r trimestre · 10 sessions · Producte final: informe del grup i protocol d''identificació de substàncies · Competències específiques avaluades: CE2, CE3 i CE5'
publicada: true
ce_aprovades:
- CE2
- CE3
- CE5
sessions:
- titol: El repte i la seguretat
  fase: Explorem
  text: Al laboratori hi ha dotze pots sense etiqueta i tenim la llista de les dotze etiquetes possibles. Observarem els pots sense obrir-los i farem les primeres hipòtesis. Abans de tocar res, buscarem els errors d'un laboratori on tothom fa alguna cosa perillosa i farem el nostre decàleg de seguretat.
  docs:
  - d1ruta
  - d1reg
  - d1seg
  - d1rub
  enllacos: []
- titol: Unitats i notació científica
  fase: Recordem
  text: Recordarem què és una magnitud, les unitats del Sistema Internacional i com es canvien les unitats de massa, longitud i volum. Veurem que els prefixos són potències de 10 i aprendrem a escriure i operar nombres molt grans i molt petits amb la notació científica.
  docs:
  - d1f1
  enllacos: []
- titol: Factors de conversió
  fase: Recordem
  text: Farem canvis d'unitats encadenats, també amb unitats compostes com la densitat. A casa buscaràs la densitat de les substàncies possibles en fonts fiables i en citaràs la font.
  docs:
  - d1f2
  enllacos: []
- titol: Densitat dels pots enigma
  fase: Experimentem
  text: Pesarem els nou pots que contenen líquids i en calcularem la densitat. La compararem amb els valors que has trobat i calcularem l'error absolut i l'error relatiu. Ja podrem assignar les primeres etiquetes!
  docs:
  - d1dens
  docs_professorat:
  - d1solf
  enllacos:
  - density
- titol: Conductivitat i el clau de ferro
  fase: Aprenem
  text: 'Repassarem què són les substàncies pures i les mescles. El professor farà dues demostracions i tu en registraràs els resultats: quins líquids condueixen el corrent elèctric i per què, i què passa quan posem un clau de ferro en els tres líquids blaus. Prepararem la separació de la sessió següent.'
  docs:
  - d1prov
  enllacos:
  - sugarsalt
- titol: Separem mescles
  fase: Experimentem
  text: Comprovarem quins líquids es barregen amb l'aigua i separarem l'oli de l'aigua per decantació. Després separarem una mescla de sorra, llimadures de ferro, serradures i aigua salada. A casa llegiràs un text en anglès sobre Ellen Swallow Richards.
  docs:
  - d1sep
  - d1ellen
  enllacos: []
- titol: La nota anònima
  fase: Ho apliquem
  text: Amb una cromatografia descobrirem amb quin retolador s'ha escrit cada nota anònima. Mentre esperem, revisarem l'assignació dels pots i debatrem sobre Ellen Swallow Richards.
  docs:
  - d1crom
  enllacos: []
- titol: Resolem el cas
  fase: Ho apliquem
  text: Cada grup presentarà l'assignació final dels dotze pots amb dues proves per a cadascun. Ens posarem d'acord i farem el protocol per identificar qualsevol substància. Si no hi ha temps perquè presentin tots els grups, els que falten ho faran a la sessió 10. Al final tens el mapa conceptual de la SdA.
  docs:
  - d1inf
  - d1mapa
  enllacos: []
- titol: Demostració d'assoliment
  fase: Avaluem
  text: Activitat de demostració d'assoliment, individual, amb situacions noves. Porta la calculadora i repassa les fitxes i el mapa conceptual.
  docs: []
  docs_professorat:
  - d1prova
  - d1solpr
  enllacos: []
- titol: Corregeixo i reflexiono
  fase: Reflexionem
  text: Si algun grup no va poder presentar a la sessió 8, ho farà ara. Corregirem l'activitat de demostració entre tots. Esmenaràs les teves respostes amb bolígraf verd, sense esborrar res, i faràs la diana per valorar què has après.
  docs:
  - d1diana
  docs_professorat:
  - d1solpr
  enllacos: []
professorat:
- bloc: Material multinivell · ampliació
  text: Reptes d'ampliació per a l'alumnat que ja domina els criteris o acaba abans (també al llibre de l'alumnat) i el seu solucionari.
  docs:
  - d1amp
  - d1solamp
- bloc: Atenció a la diversitat · Dislèxia
  text: Fitxa 1 amb format per a dislèxia (lletra gran, interlineat ampli, fons crema), exemples resolts i menys ítems. Mesura addicional. Inclou una nota per al professorat a l'última pàgina.
  docs:
  - d1adap
- bloc: Programació didàctica del curs
  text: 'La versió final és en Word (format de l''annex 4: Arial 11, interlineat 1,5, taules a 9 punts). Aquí tens els annexos (20 pàgines, Arial, text d''11 punts i taules de 9 com a mínim): fitxa resum de cada SdA, full de ruta en blanc, sondeig, full de tancament, formulari, glossari, rúbriques, un material adaptat i la tasca de recuperació.'
  url: https://claude.ai/code/artifact/21782c55-98bc-4930-b757-230697ea6cd7
  url_text: Obre la programació
  docs:
  - dannex
- bloc: Sessió 0 i sessió de tancament del curs
  text: 'Sessió 0 (abans de la SdA 1): sondeig d''idees prèvies de tot el curs i expectatives; no es qualifica i es guarda al portafoli. Sessió de tancament (després de la SdA 6): tornen a respondre el sondeig, el comparen, revisen les dianes i fan la reflexió final. Enquesta anònima de valoració.'
  docs:
  - dc0
  - dcT
  - dcE
- bloc: Plantilla de la SdA
  text: Identificació, context i contingut dels pots, elements curriculars, sessions, avaluació, diversitat, metodologia i materials.
  url: https://claude.ai/code/artifact/45d696a9-8eda-468d-9f5a-99e0b167aa3d
  url_text: Obre la plantilla
- bloc: Registre de competències
  text: Què es treballa a cada SdA i què queda pendent.
  url: https://claude.ai/artifact/CtU9znNixhemwYF8QSuFVc
  url_text: Obre el registre
- bloc: Activitat de demostració i solucionaris
  text: Activitat de demostració d'assoliment de la sessió 9, solucionari amb criteris, solucionari de les fitxes i contingut real de cada pot.
  docs:
  - d1prova
  - d1solpr
  - d1solf
- bloc: Rúbriques
  text: Informe del repte, posada en comú i protocol, i lectura en anglès.
  docs:
  - d1rub
