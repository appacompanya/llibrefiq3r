# SdA 4: font única (sessions, documents, fitxes digitals, evidències i criteris).
# uid = identificador estable (el mateix que a la base de dades). No el canviïs mai ni el reutilitzis.
# versio: puja-la quan el canvi sigui de fons (canvia què es pregunta o què s'avalua); les errates no.
# Els camps d'una pregunta hereten la versio de la pregunta.
sda: 4
versio: 2
color: --s4
titol: Un cotxe que només allibera aigua?
repte: Un cotxe que només allibera aigua pel tub d'escapament? Per què no són tots així?
meta: '2n trimestre · 10 sessions · Producte final: resposta argumentada del grup amb dades citades · Competències específiques avaluades: CE1, CE2 i CE3'
publicada: true
ce_aprovades:
- CE1
- CE2
- CE3
sessions:
- titol: El repte i l'espelma
  fase: Explorem
  text: Barcelona té autobusos d'hidrogen que, pel tub d'escapament, només alliberen vapor d'aigua. Per què no funcionen així tots els vehicles? El professor farà una demostració amb una espelma per descobrir quines substàncies es formen quan crema un combustible. En grup, escriureu la primera hipòtesi. Rebràs les rúbriques de la SdA.
  docs:
  - d4ruta
  - d4repte
  - d4rub
  enllacos:
  - tmbh2
- titol: Lavoisier al laboratori
  fase: Experimentem
  text: Farem reaccionar vinagre i bicarbonat en un sistema obert i en un sistema tancat, i en mesurarem la massa abans i després de la reacció. Comprovarem la llei de conservació de la massa i mesurarem la temperatura per saber si la reacció absorbeix o allibera energia.
  docs:
  - d4lab1
  enllacos: []
- titol: Formulació i nomenclatura
  fase: Aprenem
  text: Corregirem el full de laboratori. Aprendrem a escriure i anomenar substàncies simples, ions monoatòmics i compostos binaris segons les normes de la IUPAC. La fitxa 1 l'acabaràs a casa.
  docs:
  - d4f1
  enllacos: []
- titol: Obtenim hidrogen
  fase: Experimentem
  text: Corregirem la fitxa 1. Obtindrem hidrogen fent reaccionar magnesi amb àcid clorhídric, el recollirem en un tub i el professor l'acostarà a una flama. Mesurarem la temperatura i compararem aquesta reacció amb la de la sessió 2.
  docs:
  - d4lab2
  enllacos: []
- titol: Equacions i càlculs de massa
  fase: Aprenem
  text: Aprendrem a ajustar equacions químiques i a calcular les masses de reactius i productes a partir de les masses atòmiques. Calcularem quanta aigua allibera cada dia un autobús d'hidrogen. La fitxa 2 l'acabaràs a casa.
  docs:
  - d4f2
  enllacos:
  - anajust
  - ajust
- titol: 'Electròlisi: hidrogen verd'
  fase: Experimentem
  text: Corregirem la fitxa 2. Construirem el nostre propi dispositiu d'electròlisi amb un pot, dues xinxetes i una pila, i descompondrem l'aigua en hidrogen i oxigen. Mesurarem el volum de gas de cada tub cada 2 minuts i en calcularem la relació.
  docs:
  - d4lab3
  enllacos: []
- titol: Taller de problemes
  fase: Practiquem
  text: 'Començarem amb tres demostracions del professor per descobrir de què depèn la velocitat d''una reacció: la concentració, la superfície de contacte i la temperatura. Després resoldrem problemes de formulació, d''ajust d''equacions i de càlculs de massa, primer junts i després individualment o en parelles. El que no acabis, ho faràs a casa. Al final tens el mapa conceptual de la SdA.'
  docs:
  - d4f3
  - d4mapa
  enllacos:
  - ancol
  - ajust
- titol: Per què no són tots així?
  fase: Ho apliquem
  text: Corregirem la fitxa 3. En grups de tres, cada membre llegirà un aspecte del dossier (d'on surt l'hidrogen, eficiència i emmagatzematge, seguretat i usos) i l'explicarà als altres. Després escriureu la resposta del grup al repte amb dades citades i en farem una posada en comú. A casa esmenaràs la hipòtesi del full del repte.
  docs:
  - d4dos
  - d4repte
  enllacos:
  - anpila
- titol: Demostració d'assoliment
  fase: Avaluem
  text: Activitat de demostració d'assoliment, individual, amb situacions noves. Porta la calculadora i repassa les fitxes, els fulls de laboratori i el mapa conceptual.
  docs: []
  docs_professorat:
  - d4prova
  - d4solpr
  enllacos: []
- titol: Corregeixo i reflexiono
  fase: Reflexionem
  text: Corregirem l'activitat de demostració entre tots. Esmenaràs les teves respostes amb bolígraf verd, sense esborrar res, i faràs la diana per valorar què has après.
  docs:
  - d4diana
  docs_professorat:
  - d4solpr
  enllacos: []
professorat:
- bloc: Material multinivell · ampliació
  text: Reptes d'ampliació per a l'alumnat que ja domina els criteris o acaba abans (també al llibre de l'alumnat) i el seu solucionari.
  docs:
  - d4amp
  - d4solamp
- bloc: Atenció a la diversitat · Discalcúlia
  text: Ajust d'equacions amb models de boles i càlculs de massa amb taules de proporcionalitat i calculadora. Mesura addicional. Inclou una nota per al professorat a l'última pàgina.
  docs:
  - d4adap
- bloc: Plantilla de la SdA
  text: Identificació, context, elements curriculars, sessions, avaluació, diversitat, organització i seguretat, i materials.
  url: https://claude.ai/code/artifact/3ecfcc8c-4799-480d-a5da-d98b8ffa1c60
  url_text: Obre la plantilla
- bloc: Registre de competències
  text: Què es treballa a cada SdA i què queda pendent.
  url: https://claude.ai/artifact/CtU9znNixhemwYF8QSuFVc
  url_text: Obre el registre
- bloc: Activitat de demostració i solucionaris
  text: Activitat de demostració d'assoliment de la sessió 9, solucionari amb criteris i solucionari de les fitxes i dels tres laboratoris (amb notes de preparació).
  docs:
  - d4prova
  - d4solpr
  - d4solf
- bloc: Rúbriques
  text: Fulls de laboratori (Lavoisier i electròlisi) i dossier amb la resposta del grup.
  docs:
  - d4rub
