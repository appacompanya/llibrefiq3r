# SdA 2: font única (sessions, documents, fitxes digitals, evidències i criteris).
# uid = identificador estable (el mateix que a la base de dades). No el canviïs mai ni el reutilitzis.
# versio: puja-la quan el canvi sigui de fons (canvia què es pregunta o què s'avalua); les errates no.
# Els camps d'una pregunta hereten la versio de la pregunta.
# Avaluació oficial: nivells NA–AE, sense pesos.
# Fitxes 1 i 2: formatives (no entren al càlcul oficial).
# CE: principals CE1 i CE2. El vídeo no avalua 4.1 (no defensa un punt de vista ecosocial): l'adaptació al públic i els recursos digitals són 2.5.
sda: 2
versio: 3
color: --s2
titol: El desodorant kamikaze
repte: Per què explota un desodorant dins d'un cotxe a l'agost?
meta: '1r trimestre · 10 sessions · Producte final: un vídeo per a l''alumnat de 1r d''ESO · Competències específiques avaluades: CE1 i CE2'
publicada: true
ce_aprovades:
- CE1
- CE2
sessions:
- titol: El repte
  fase: Explorem
  text: Veurem què pot passar quan un esprai es queda dins d'un cotxe a l'estiu i llegirem l'etiqueta d'un aerosol. Dibuixaràs com t'imagines les partícules del gas de l'interior de la llauna i, en grup, formulareu hipòtesis sobre per què pot rebentar.
  docs:
  - ruta
  - repte
  - rub
  enllacos: []
- titol: Els globus al fred i a la calor
  fase: Experimentem
  text: Mesurarem el perímetre de dos globus i en calcularem el volum suposant que són esfèrics. Després en deixarem un 20 minuts al congelador i l'altre damunt d'un vas amb aigua calenta, i calcularem en quin percentatge ha variat el volum de cadascun. Mentre esperem, farem prediccions.
  docs:
  - lab
  enllacos: []
- titol: El model de partícules
  fase: Aprenem
  text: 'Descobrirem com és la matèria a escala de partícules: partícules en moviment constant i buit entre elles. Amb una simulació veurem que la pressió d''un gas és el resultat dels xocs de les partícules contra les parets del recipient, i entendrem per què ha variat el volum dels globus.'
  docs:
  - f1
  enllacos:
  - simgas
  - gasprop
  - states
- titol: Les lleis dels gasos
  fase: Aprenem
  text: Corregirem la fitxa 1. Estudiarem els estats d'agregació i les tres lleis dels gasos, i aprendrem a fer servir l'escala Kelvin.
  docs: []
  enllacos:
  - simgas
  - gasintro
- titol: Exercicis de gasos
  fase: Practiquem
  text: Resoldrem problemes de gasos, primer junts i després en parelles. La fitxa 2 l'acabaràs a casa.
  docs:
  - f2
  enllacos: []
- titol: Corba d'escalfament i canvis d'estat
  fase: Experimentem
  text: Escalfarem aigua i n'anotarem la temperatura cada 2 minuts fins que bulli, fent torns dins del grup. Mentre l'aigua s'escalfa, aprendrem els canvis d'estat i respondrem les preguntes del full. Al final veurem com l'aigua a uns 50 °C bull dins d'una xeringa tapada quan reduïm la pressió. Recull bé les dades per a l'informe.
  docs:
  - labc
  - inf
  enllacos: []
- titol: Torno al repte
  fase: Ho apliquem
  text: Tornaràs a explicar per què pot rebentar la llauna del desodorant, compararàs el dibuix nou amb el del primer dia i corregiràs els teus errors. Després, cada grup triarà el fenomen del vídeo. Al final tens el mapa conceptual de tot el que hem après.
  docs:
  - repte
  - video
  - mapa
  enllacos: []
- titol: Gravem el vídeo per a 1r
  fase: Ho apliquem
  text: Començarem a gravar el vídeo per explicar un fenomen a l'alumnat de 1r d'ESO. L'acabareu de gravar i editar a casa i el presentareu als companys a la sessió 10. Lliurament de l'informe de pràctica.
  docs:
  - rub
  enllacos: []
- titol: Demostració d'assoliment
  fase: Avaluem
  text: Activitat de demostració d'assoliment, individual, amb situacions noves. Porta la calculadora i repassa la fitxa 2 i el mapa conceptual.
  docs: []
  docs_professorat:
  - prova
  - solpr
  enllacos: []
- titol: Corregeixo i reflexiono
  fase: Reflexionem
  text: 'Corregirem l''activitat de demostració entre tots i esmenaràs les teves respostes amb bolígraf verd, sense esborrar res. Cada grup presentarà el seu vídeo: t''avaluaràs, avaluaràs un company, avaluareu el vostre grup i un altre grup (full «Avaluem els vídeos»). Faràs la diana per valorar què has après.'
  docs:
  - d2coav
  - diana
  docs_professorat:
  - solpr
  enllacos: []
professorat:
- bloc: Material multinivell · ampliació
  text: Reptes d'ampliació per a l'alumnat que ja domina els criteris o acaba abans (també al llibre de l'alumnat) i el seu solucionari.
  docs:
  - d2amp
  - d2solamp
- bloc: Atenció a la diversitat · Nouvingut
  text: Glossari visual trilingüe amb columna per a la llengua familiar, banc de paraules i frases model per a la fitxa 1. Mesura addicional, coordinada amb l'aula d'acollida. Inclou una nota per al professorat a l'última pàgina.
  docs:
  - d2adap
- bloc: Atenció a la diversitat · Continguts bàsics
  text: Fitxa 1 amb els continguts essencials del model de partícules (banc de paraules, frases per completar, selecció i dibuixos model) per a l'alumnat amb retard en l'aprenentatge o nouvingut amb nivell inicial de lectura. Mateix criteri (1.2). Mesura addicional.
  docs:
  - d2bas
- bloc: Plantilla de la SdA
  text: Identificació, context, elements curriculars, sessions, avaluació, diversitat, metodologia i materials.
  url: https://claude.ai/code/artifact/351c682b-378f-4335-843c-b3a0c27a6d99
  url_text: Obre la plantilla
- bloc: Registre de competències
  text: Què es treballa a cada SdA i què queda pendent.
  url: https://claude.ai/artifact/CtU9znNixhemwYF8QSuFVc
  url_text: Obre el registre
- bloc: Activitat de demostració i solucionaris
  text: Activitat de demostració d'assoliment de la sessió 9, solucionari amb criteris i solucionari de la fitxa 2.
  docs:
  - prova
  - solpr
  - solf2
- bloc: Rúbriques
  text: Vídeo, informe de pràctica i explicació final del repte.
  docs:
  - rub
