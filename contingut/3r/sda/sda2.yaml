- uid: s2.video
  id: video
  versio: 2
  titol: Vídeo per a 1r d'ESO
  instruments:
  - video
  items:
  - uid: s2.video.v1
    id: v1
    versio: 1
    titol: Explicació científica
    criteris:
    - '1.2'
    descriptors:
      AE: Explica el fenomen amb el model i relaciona bé pressió, volum i temperatura
      AN: Explica el fenomen amb el model, amb alguna imprecisió
      AS: Descriu el fenomen amb un ús parcial del model
      NA: No fa servir el model o l'explicació és incorrecta
  - uid: s2.video.v2
    id: v2
    versio: 2
    titol: Adaptació al públic
    criteris:
    - '2.5'
    descriptors:
      AE: Llenguatge clar, exemples propers i suport visual
      AN: Llenguatge clar i algun suport visual
      AS: Llenguatge massa tècnic o poc suport visual
      NA: No s'entén per a un alumne de 1r
  - uid: s2.video.v3
    id: v3
    versio: 2
    titol: Recursos digitals
    criteris:
    - '2.5'
    descriptors:
      AE: Imatge i so clars, 2–3 minuts, muntatge i suport visual cuidats
      AN: Imatge i so correctes, durada adequada
      AS: Problemes de so o d'imatge, o durada inadequada
      NA: No es pot seguir el vídeo
- uid: s2.expl
  id: expl
  versio: 1
  titol: Explicació final del repte
  instruments: []
  items:
  - uid: s2.expl.e1
    id: e1
    versio: 1
    titol: Ús del model
    criteris:
    - '1.2'
    descriptors:
      AE: Explica l'augment de pressió amb el moviment i els xocs de les partícules; el dibuix ho representa bé
      AN: Explicació correcta, dibuix amb alguna imprecisió
      AS: Explicació parcial o dibuix que no la representa
      NA: Explicació sense model o incorrecta
  - uid: s2.expl.e2
    id: e2
    versio: 1
    titol: Interpretació de l'etiqueta
    criteris:
    - '1.1'
    descriptors:
      AE: Interpreta l'avís i els pictogrames de l'etiqueta i en dedueix consells concrets
      AN: Interpreta l'avís de l'etiqueta
      AS: Esmenta l'avís sense interpretar-lo
      NA: No interpreta l'etiqueta
- uid: s2.labc
  id: labc
  versio: 1
  titol: Laboratori de la corba d'escalfament i informe de pràctica (sessió 6)
  instruments:
  - labc
  - inf
  items:
  - uid: s2.labc.k1
    id: k1
    versio: 1
    titol: Execució i registre de dades
    criteris:
    - '2.3'
    descriptors:
      AE: Mesura la temperatura cada 2 minuts amb el termòmetre ben col·locat, registra totes les dades amb unitats i fa la gràfica temperatura-temps amb escala i eixos correctes
      AN: Registra les dades amb unitats i fa la gràfica amb algun error menor d'escala o d'eixos
      AS: Registre incomplet o gràfica amb errors d'escala o sense unitats
      NA: No registra les dades o no fa la gràfica
  - uid: s2.labc.k2
    id: k2
    versio: 1
    titol: Interpretació dels resultats
    criteris:
    - '2.3'
    descriptors:
      AE: Identifica el tram on la temperatura es manté constant, l'explica amb el model de partícules i compara la predicció amb el resultat
      AN: Identifica el tram constant i l'explica amb alguna imprecisió
      AS: Descriu la gràfica sense interpretar-la
      NA: No interpreta els resultats
