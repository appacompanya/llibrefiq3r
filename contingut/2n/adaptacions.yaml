# Adaptacions del llibre digital de 2n d'ESO (NESE). Mateix format que contingut/3r/adaptacions.yaml.
# Els perfils i les llengues es comparteixen amb 3r. Genera 2n/digital/js/adaptacions-dades.js amb:
#   python3 -B tools/3r/build_adaptacions.py 2n
# Continguts bàsics: «treu» (preguntes que no fa) i «redueix» (què ha de fer d'una pregunta) rebaixen l'exigència;
# aquestes preguntes no s'avaluen i el nivell màxim de l'alumne és AS.
glossari:
  1:
  - ca: magnitud
    formes:
    - magnitud
    - magnituds
    def: propietat que es pot mesurar i expressar amb un nombre i una unitat
    tr:
      es: magnitud
      en: physical quantity
      fr: grandeur
      pt: grandeza
      ro: mărime
      ru: величина
      uk: величина
      ar: كمية فيزيائية
      zh: 物理量
      ur: مقدار
  - ca: unitat
    formes:
    - unitat
    - unitats
    def: quantitat que fem servir per comparar quan mesurem (metre, quilogram, segon…)
    tr:
      es: unidad
      en: unit
      fr: unité
      pt: unidade
      ro: unitate
      ru: единица измерения
      uk: одиниця вимірювання
      ar: وحدة قياس
      zh: 单位
      ur: اکائی
  - ca: factor de conversió
    formes:
    - factor de conversió
    - factors de conversió
    - factor
    def: fracció que val 1 i serveix per canviar d'unitat
    tr:
      es: factor de conversión
      en: conversion factor
      fr: facteur de conversion
      pt: fator de conversão
      ro: factor de conversie
      ru: коэффициент пересчёта
      uk: коефіцієнт перерахунку
      ar: معامل التحويل
      zh: 换算因子
      ur: تبادلی عامل
  - ca: proveta
    formes:
    - proveta
    - provetes
    def: recipient de vidre o plàstic, alt i graduat, per mesurar volums de líquids
    tr:
      es: probeta
      en: graduated cylinder
      fr: éprouvette graduée
      pt: proveta
      ro: cilindru gradat
      ru: мерный цилиндр
      uk: мірний циліндр
      ar: مخبار مدرج
      zh: 量筒
      ur: پیمائشی سلنڈر
  - ca: sensibilitat
    formes:
    - sensibilitat
    def: la quantitat més petita que pot mesurar un instrument
    tr:
      es: sensibilidad
      en: resolution (smallest division)
      fr: sensibilité
      pt: sensibilidade
      ro: sensibilitate
      ru: цена деления
      uk: ціна поділки
      ar: أصغر تدريجة
      zh: 最小刻度
      ur: حساسیت
  - ca: superfície
    formes:
    - superfície
    - superfícies
    def: mida d'una zona plana; es mesura en m²
    tr:
      es: superficie
      en: area
      fr: surface
      pt: área
      ro: suprafață
      ru: площадь
      uk: площа
      ar: مساحة
      zh: 面积
      ur: رقبہ
  - ca: volum
    formes:
    - volum
    - volums
    def: espai que ocupa un cos; es mesura en m³ o en litres
    tr:
      es: volumen
      en: volume
      fr: volume
      pt: volume
      ro: volum
      ru: объём
      uk: об'єм
      ar: حجم
      zh: 体积
      ur: حجم
  - ca: notació científica
    formes:
    - notació científica
    def: manera d'escriure nombres molt grans o molt petits amb una potència de 10
    tr:
      es: notación científica
      en: scientific notation
      fr: notation scientifique
      pt: notação científica
      ro: notație științifică
      ru: научная запись числа
      uk: стандартний вигляд числа
      ar: الترميز العلمي
      zh: 科学记数法
      ur: سائنسی ترقیم
  2:
  - ca: massa
    formes:
    - massa
    - masses
    def: quantitat de matèria d'un cos; es mesura amb la balança, en kg
    tr:
      es: masa
      en: mass
      fr: masse
      pt: massa
      ro: masă
      ru: масса
      uk: маса
      ar: كتلة
      zh: 质量
      ur: کمیت
  - ca: densitat
    formes:
    - densitat
    - densitats
    def: 'massa que té cada unitat de volum d''una substància: d = m / V'
    tr:
      es: densidad
      en: density
      fr: masse volumique
      pt: densidade
      ro: densitate
      ru: плотность
      uk: густина
      ar: كثافة
      zh: 密度
      ur: کثافت
  - ca: surar
    formes:
    - surar
    - sura
    - suren
    def: quedar-se a la superfície d'un líquid sense enfonsar-se
    tr:
      es: flotar
      en: to float
      fr: flotter
      pt: flutuar
      ro: a pluti
      ru: плавать
      uk: плавати
      ar: يطفو
      zh: 漂浮
      ur: تیرنا
  - ca: enfonsar-se
    formes:
    - enfonsa
    - enfonsar
    - enfonsen
    def: anar cap al fons d'un líquid
    tr:
      es: hundirse
      en: to sink
      fr: couler
      pt: afundar
      ro: a se scufunda
      ru: тонуть
      uk: тонути
      ar: يغرق
      zh: 下沉
      ur: ڈوبنا
  - ca: balança
    formes:
    - balança
    - balances
    def: instrument per mesurar la massa
    tr:
      es: balanza
      en: balance (scale)
      fr: balance
      pt: balança
      ro: balanță
      ru: весы
      uk: терези
      ar: ميزان
      zh: 天平
      ur: ترازو
  - ca: propietat característica
    formes:
    - propietat característica
    - propietats característiques
    - característica
    - característiques
    def: propietat que serveix per saber de quina substància es tracta (densitat, temperatura d'ebullició…)
    tr:
      es: propiedad característica
      en: characteristic property
      fr: propriété caractéristique
      pt: propriedade característica
      ro: proprietate caracteristică
      ru: характерное свойство
      uk: характерна властивість
      ar: خاصية مميزة
      zh: 特征性质
      ur: امتیازی خاصیت
  - ca: capa
    formes:
    - capa
    - capes
    def: part d'un líquid que queda separada, a sobre o a sota d'una altra
    tr:
      es: capa
      en: layer
      fr: couche
      pt: camada
      ro: strat
      ru: слой
      uk: шар
      ar: طبقة
      zh: 层
      ur: تہہ
  - ca: hipòtesi
    formes:
    - hipòtesi
    def: resposta provisional que després comprovem amb un experiment
    tr:
      es: hipótesis
      en: hypothesis
      fr: hypothèse
      pt: hipótese
      ro: ipoteză
      ru: гипотеза
      uk: гіпотеза
      ar: فرضية
      zh: 假设
      ur: مفروضہ
  3:
  - ca: partícula
    formes:
    - partícula
    - partícules
    def: tros molt i molt petit de matèria que no podem veure
    tr:
      es: partícula
      en: particle
      fr: particule
      pt: partícula
      ro: particulă
      ru: частица
      uk: частинка
      ar: جسيم
      zh: 粒子
      ur: ذرہ
  - ca: estat
    formes:
    - estat
    - estats
    - sòlid
    - líquid
    - gas
    def: 'forma en què es troba la matèria: sòlid, líquid o gas'
    tr:
      es: estado
      en: state of matter
      fr: état de la matière
      pt: estado físico
      ro: stare de agregare
      ru: агрегатное состояние
      uk: агрегатний стан
      ar: حالة المادة
      zh: 物态
      ur: مادے کی حالت
  - ca: fusió
    formes:
    - fusió
    - fon
    - fondre
    def: pas de sòlid a líquid
    tr:
      es: fusión
      en: melting
      fr: fusion
      pt: fusão
      ro: topire
      ru: плавление
      uk: плавлення
      ar: انصهار
      zh: 熔化
      ur: پگھلنا
  - ca: ebullició
    formes:
    - ebullició
    - bull
    - bullir
    def: pas de líquid a gas a tot el líquid, a una temperatura fixa
    tr:
      es: ebullición
      en: boiling
      fr: ébullition
      pt: ebulição
      ro: fierbere
      ru: кипение
      uk: кипіння
      ar: غليان
      zh: 沸腾
      ur: ابلنا
  - ca: evaporació
    formes:
    - evaporació
    - evapora
    def: pas de líquid a gas només a la superfície, a qualsevol temperatura
    tr:
      es: evaporación
      en: evaporation
      fr: évaporation
      pt: evaporação
      ro: evaporare
      ru: испарение
      uk: випаровування
      ar: تبخر
      zh: 蒸发
      ur: تبخیر
  - ca: condensació
    formes:
    - condensació
    - condensa
    def: pas de gas a líquid
    tr:
      es: condensación
      en: condensation
      fr: condensation
      pt: condensação
      ro: condensare
      ru: конденсация
      uk: конденсація
      ar: تكاثف
      zh: 液化
      ur: تکثیف
  - ca: pressió
    formes:
    - pressió
    def: força dels xocs de les partícules contra les parets; es mesura en atm o Pa
    tr:
      es: presión
      en: pressure
      fr: pression
      pt: pressão
      ro: presiune
      ru: давление
      uk: тиск
      ar: ضغط
      zh: 压强
      ur: دباؤ
  - ca: temperatura
    formes:
    - temperatura
    def: mesura de com de ràpid es mouen les partícules; es mesura en °C o en K
    tr:
      es: temperatura
      en: temperature
      fr: température
      pt: temperatura
      ro: temperatură
      ru: температура
      uk: температура
      ar: درجة الحرارة
      zh: 温度
      ur: درجہ حرارت
  4:
  - ca: mescla
    formes:
    - mescla
    - mescles
    def: material format per dues substàncies o més
    tr:
      es: mezcla
      en: mixture
      fr: mélange
      pt: mistura
      ro: amestec
      ru: смесь
      uk: суміш
      ar: خليط
      zh: 混合物
      ur: آمیزہ
  - ca: substància pura
    formes:
    - substància pura
    - substàncies pures
    def: material format per una sola substància
    tr:
      es: sustancia pura
      en: pure substance
      fr: corps pur
      pt: substância pura
      ro: substanță pură
      ru: чистое вещество
      uk: чиста речовина
      ar: مادة نقية
      zh: 纯净物
      ur: خالص مادہ
  - ca: dissolució
    formes:
    - dissolució
    - dissolucions
    def: 'mescla homogènia: no se''n veuen les parts'
    tr:
      es: disolución
      en: solution
      fr: solution
      pt: solução
      ro: soluție
      ru: раствор
      uk: розчин
      ar: محلول
      zh: 溶液
      ur: محلول
  - ca: solut
    formes:
    - solut
    def: substància que es dissol (n'hi ha menys)
    tr:
      es: soluto
      en: solute
      fr: soluté
      pt: soluto
      ro: substanță dizolvată
      ru: растворённое вещество
      uk: розчинена речовина
      ar: مذاب
      zh: 溶质
      ur: منحل
  - ca: dissolvent
    formes:
    - dissolvent
    def: substància on es dissol el solut (n'hi ha més)
    tr:
      es: disolvente
      en: solvent
      fr: solvant
      pt: solvente
      ro: solvent
      ru: растворитель
      uk: розчинник
      ar: مذيب
      zh: 溶剂
      ur: محلل
  - ca: concentració
    formes:
    - concentració
    def: quantitat de solut que hi ha en cada litre de dissolució (g/L)
    tr:
      es: concentración
      en: concentration
      fr: concentration
      pt: concentração
      ro: concentrație
      ru: концентрация
      uk: концентрація
      ar: تركيز
      zh: 浓度
      ur: ارتکاز
  - ca: solubilitat
    formes:
    - solubilitat
    def: quantitat màxima de solut que es pot dissoldre
    tr:
      es: solubilidad
      en: solubility
      fr: solubilité
      pt: solubilidade
      ro: solubilitate
      ru: растворимость
      uk: розчинність
      ar: ذوبانية
      zh: 溶解度
      ur: حل پذیری
  - ca: filtració
    formes:
    - filtració
    - filtrar
    - filtre
    def: tècnica que separa un sòlid d'un líquid amb un filtre
    tr:
      es: filtración
      en: filtration
      fr: filtration
      pt: filtração
      ro: filtrare
      ru: фильтрование
      uk: фільтрування
      ar: ترشيح
      zh: 过滤
      ur: فلٹریشن
  5:
  - ca: canvi físic
    formes:
    - canvi físic
    - canvis físics
    - físic
    def: canvi en què la substància continua sent la mateixa
    tr:
      es: cambio físico
      en: physical change
      fr: transformation physique
      pt: transformação física
      ro: transformare fizică
      ru: физическое явление
      uk: фізичне явище
      ar: تغير فيزيائي
      zh: 物理变化
      ur: طبعی تبدیلی
  - ca: canvi químic
    formes:
    - canvi químic
    - canvis químics
    - químic
    def: canvi en què es formen substàncies noves
    tr:
      es: cambio químico
      en: chemical change
      fr: transformation chimique
      pt: transformação química
      ro: transformare chimică
      ru: химическое явление
      uk: хімічне явище
      ar: تغير كيميائي
      zh: 化学变化
      ur: کیمیائی تبدیلی
  - ca: reactiu
    formes:
    - reactiu
    - reactius
    def: substància que hi ha al principi d'una reacció
    tr:
      es: reactivo
      en: reactant
      fr: réactif
      pt: reagente
      ro: reactant
      ru: реагент
      uk: реагент
      ar: مادة متفاعلة
      zh: 反应物
      ur: متعامل
  - ca: producte
    formes:
    - producte
    - productes
    def: substància nova que es forma en una reacció
    tr:
      es: producto
      en: product
      fr: produit
      pt: produto
      ro: produs de reacție
      ru: продукт реакции
      uk: продукт реакції
      ar: ناتج التفاعل
      zh: 生成物
      ur: حاصل
  - ca: reacció química
    formes:
    - reacció química
    - reaccions
    - reacció
    def: procés en què els reactius es transformen en productes
    tr:
      es: reacción química
      en: chemical reaction
      fr: réaction chimique
      pt: reação química
      ro: reacție chimică
      ru: химическая реакция
      uk: хімічна реакція
      ar: تفاعل كيميائي
      zh: 化学反应
      ur: کیمیائی تعامل
  - ca: combustió
    formes:
    - combustió
    - crema
    - cremar
    def: reacció d'un combustible amb l'oxigen que desprèn calor i llum
    tr:
      es: combustión
      en: combustion
      fr: combustion
      pt: combustão
      ro: ardere
      ru: горение
      uk: горіння
      ar: احتراق
      zh: 燃烧
      ur: احتراق
  - ca: evidència
    formes:
    - evidència
    - evidències
    def: senyal que es veu i que indica que hi ha hagut un canvi químic (gas, color, olor…)
    tr:
      es: evidencia
      en: evidence (sign)
      fr: indice
      pt: evidência
      ro: dovadă
      ru: признак
      uk: ознака
      ar: دليل
      zh: 证据
      ur: ثبوت
  - ca: conservació de la massa
    formes:
    - conservació de la massa
    - es conserva
    def: en una reacció en un recipient tancat, la massa no canvia
    tr:
      es: conservación de la masa
      en: conservation of mass
      fr: conservation de la masse
      pt: conservação da massa
      ro: conservarea masei
      ru: сохранение массы
      uk: збереження маси
      ar: حفظ الكتلة
      zh: 质量守恒
      ur: کمیت کا تحفظ
  6:
  - ca: energia
    formes:
    - energia
    def: capacitat de produir canvis; es mesura en joules (J)
    tr:
      es: energía
      en: energy
      fr: énergie
      pt: energia
      ro: energie
      ru: энергия
      uk: енергія
      ar: طاقة
      zh: 能量
      ur: توانائی
  - ca: calor
    formes:
    - calor
    def: energia que passa d'un cos calent a un de més fred
    tr:
      es: calor
      en: heat
      fr: chaleur
      pt: calor
      ro: căldură
      ru: теплота
      uk: теплота
      ar: حرارة
      zh: 热量
      ur: حرارت
  - ca: equilibri tèrmic
    formes:
    - equilibri tèrmic
    - equilibri
    def: quan dos cossos en contacte arriben a la mateixa temperatura
    tr:
      es: equilibrio térmico
      en: thermal equilibrium
      fr: équilibre thermique
      pt: equilíbrio térmico
      ro: echilibru termic
      ru: тепловое равновесие
      uk: теплова рівновага
      ar: توازن حراري
      zh: 热平衡
      ur: حرارتی توازن
  - ca: conducció
    formes:
    - conducció
    def: la calor passa a través d'un material, de partícula a partícula
    tr:
      es: conducción
      en: conduction
      fr: conduction
      pt: condução
      ro: conducție
      ru: теплопроводность
      uk: теплопровідність
      ar: توصيل حراري
      zh: 热传导
      ur: ایصال حرارت
  - ca: convecció
    formes:
    - convecció
    def: la calor es mou amb un líquid o un gas que puja quan s'escalfa
    tr:
      es: convección
      en: convection
      fr: convection
      pt: convecção
      ro: convecție
      ru: конвекция
      uk: конвекція
      ar: حمل حراري
      zh: 对流
      ur: حملِ حرارت
  - ca: radiació
    formes:
    - radiació
    def: la calor viatja sense tocar res, com la del Sol
    tr:
      es: radiación
      en: radiation
      fr: rayonnement
      pt: radiação
      ro: radiație
      ru: излучение
      uk: випромінювання
      ar: إشعاع
      zh: 热辐射
      ur: اشعاع
  - ca: aïllant
    formes:
    - aïllant
    - aïllants
    def: material que deixa passar molt poca calor
    tr:
      es: aislante
      en: insulator
      fr: isolant
      pt: isolante
      ro: izolator
      ru: теплоизолятор
      uk: теплоізолятор
      ar: عازل حراري
      zh: 隔热材料
      ur: حاجز حرارت
  - ca: font d'energia
    formes:
    - font d'energia
    - fonts d'energia
    - renovable
    - renovables
    def: 'd''on traiem l''energia: Sol, vent, aigua, gas…'
    tr:
      es: fuente de energía
      en: energy source
      fr: source d'énergie
      pt: fonte de energia
      ro: sursă de energie
      ru: источник энергии
      uk: джерело енергії
      ar: مصدر طاقة
      zh: 能源
      ur: توانائی کا ذریعہ
